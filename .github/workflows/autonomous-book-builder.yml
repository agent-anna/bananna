name: 📖 Autonomous Book Builder

on:
  push:
    paths:
      - 'book-init/**'
  schedule:
    - cron: '0 * * * *'  # Every hour - checks for incomplete books
  workflow_dispatch:  # Manual trigger

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find active book
        id: find-book
        run: |
          # Find book-init folders with status != complete
          # Pick the one with lowest page count
          
          cd book-init
          for dir in */; do
            if [ -f "${dir}tracker.md" ]; then
              echo "Found: ${dir}"
            fi
          done

      - name: Read tracker
        id: read-tracker
        run: |
          # Parse tracker: book_id, title, theme, current_page, target_pages, status
          
      - name: Generate next page
        if: steps.read-tracker.outputs.status != 'complete'
        env:
          API_KEY: ${{ secrets.ANNA_API_KEY }}
        run: node .github/scripts/generate-page.js

      - name: Write page to repo
        run: |
          # Write page to books/[book-id]/page-XX.md
          # Increment tracker page count
          # Update status if 10/10
          
      - name: Commit and push
        run: |
          git config --local user.email "bot@bananna.gay"
          git config --local user.name "Bananna Bot 🤖"
          git add .
          git commit -m "📖 Page ${{ steps.read-tracker.outputs.next_page }} — autonomous build"
          git push

      - name: Notify completion
        if: steps.read-tracker.outputs.status == 'complete'
        run: |
          echo "✅ BOOK COMPLETE: ${{ steps.read-tracker.outputs.book_title }}"
