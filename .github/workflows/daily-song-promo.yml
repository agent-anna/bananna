name: Anna - Marketing - New Song Promo Gate
on:
  workflow_dispatch:
    inputs:
      mode: { description: "Gate mode", required: true, default: "PREPARE_DAILY", type: "string" }
      task_id: { description: "Optional task ID", required: false, default: "", type: "string" }
      note: { description: "Optional operator note", required: false, default: "", type: "string" }
permissions: { contents: write }
jobs:
  promo-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run Promo Gate Builder
        env: { PROMO_MODE: "${{ github.event.inputs.mode }}", PROMO_TASK_ID: "${{ github.event.inputs.task_id }}", PROMO_NOTE: "${{ github.event.inputs.note }}" }
        run: node A1/promo-gate/build-daily-promo.js
      - name: Commit Promo Gate State
        run: |
          git config user.name "agent-anna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strayd/songs-db.json strayd/promo-queue.json promo-gate/latest-package.json promo-gate/latest-review.html
          if ! git diff --cached --quiet; then git commit -m "chore(promo-gate): ${{ github.event.inputs.mode }}" && git push; fi
