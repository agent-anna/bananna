name: AA01 Live Intel Feed

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "search or url"
        required: true
        default: "search"
      target_or_query:
        description: "Search query or target URL"
        required: true
      output_name:
        description: "Output slug without .md"
        required: true
        default: "intel-snapshot"

permissions:
  contents: write

jobs:
  fetch-intel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run search or URL scrape
        env:
          INTEL_MODE: ${{ inputs.mode }}
          INTEL_TARGET: ${{ inputs.target_or_query }}
          INTEL_SLUG: ${{ inputs.output_name }}
        run: |
          python3 - << 'PY'
          import os, urllib.parse, urllib.request, re, html, datetime

          mode = (os.environ.get("INTEL_MODE") or "search").strip().lower()
          target = (os.environ.get("INTEL_TARGET") or "").strip()
          slug = re.sub(r"[^a-zA-Z0-9_-]+", "-", (os.environ.get("INTEL_SLUG") or "intel")).strip("-") or "intel"
          os.makedirs("bible", exist_ok=True)
          out_path = os.path.join("bible", f"{slug}.md")
          now_utc = datetime.datetime.now(datetime.timezone.utc).isoformat()

          def fetch_text(url, timeout=20):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; AnnaIntelBot/2.6; +https://github.com/agent-anna/home)",
                      "Accept": "text/plain,text/html,application/xhtml+xml,*/*;q=0.8"
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  raw = resp.read()
              return raw.decode("utf-8", errors="replace")

          body_md = ""
          if mode == "url":
              try:
                  body_md = fetch_text("https://r.jina.ai/" + target)
              except Exception as e1:
                  try:
                      raw_html = fetch_text(target)
                      txt = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", raw_html, flags=re.S|re.I)
                      txt = html.unescape(re.sub(r"<[^>]+>", " ", txt))
                      body_md = re.sub(r"\s+", " ", txt).strip()[:12000]
                  except Exception as e2:
                      body_md = f"Fetch error: {e1} | {e2}"
          else:
              q = urllib.parse.quote_plus(target)
              try:
                  body_md = fetch_text(f"https://s.jina.ai/?q={q}")
              except Exception as e1:
                  try:
                      ddg = fetch_text(f"https://html.duckduckgo.com/html/?q={q}")
                      titles = re.findall(r'class="result__a"[^>]*>(.*?)</a>', ddg, flags=re.S)
                      links = re.findall(r'class="result__url"[^>]*>(.*?)</a>', ddg, flags=re.S)
                      snippets = re.findall(r'class="result__snippet"[^>]*>(.*?)</', ddg, flags=re.S)
                      lines = []
                      for i in range(min(8, max(len(titles), len(snippets)))):
                          t = html.unescape(re.sub(r"<[^>]+>", "", titles[i] if i < len(titles) else "")).strip()
                          l = html.unescape(re.sub(r"<[^>]+>", "", links[i] if i < len(links) else "")).strip()
                          s = html.unescape(re.sub(r"<[^>]+>", "", snippets[i] if i < len(snippets) else "")).strip()
                          lines.append(f"- **{t}** ({l})\n  {s}")
                      body_md = "\n".join(lines) if lines else f"Search fallback empty: {e1}"
                  except Exception as e2:
                      body_md = f"Search error: {e1} | {e2}"

          doc = f"""# AA01 Intel Snapshot: {target}

- **Mode**: {mode}
- **Captured UTC**: {now_utc}
- **Archive Path**: `bible/{slug}.md`

## Findings

{body_md[:16000]}
"""
          with open(out_path, "w", encoding="utf-8") as f:
              f.write(doc)
          print(f"Wrote {out_path} ({len(doc)} chars)")
          PY

      - name: Commit snapshot to bible/
        run: |
          git config user.name "Agent Anna Bot"
          git config user.email "anna-bot@users.noreply.github.com"
          git add bible/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(intel): archive ${{ inputs.mode }} snapshot for ${{ inputs.output_name }}"
            git push
          fi