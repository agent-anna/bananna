<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Veg Anna • Social Post Maker & Radio Filler</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-2: #192232;
      --text: #eef3fb;
      --muted: #9fb0c8;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px;
    }
    .hero {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      align-items: start;
    }
    @media (max-width: 720px) {
      .hero { grid-template-columns: 1fr; }
    }
    .art-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .art-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .song-title {
      margin: 0 0 6px;
      font-size: 1.65rem;
      line-height: 1.2;
    }
    .meta-line {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    select, input, textarea {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
      font-family: inherit;
    }
    textarea {
      min-height: 125px;
      resize: vertical;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.84rem;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: var(--accent);
      color: #061018;
      font-weight: 600;
      border: none;
    }
    .status-pill {
      font-size: 0.8rem;
      color: var(--accent);
      padding-left: 6px;
    }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .post-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .char-count {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 400;
    }
    .btn-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
    }
    .btn-row button {
      flex: 0 0 auto;
      padding: 6px 10px;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="art-box">
        <img id="coverImg" alt="Song cover art" />
      </div>
      <div>
        <h1 id="songHeading" class="song-title">Loading track...</h1>
        <div id="dateMeta" class="meta-line"></div>
        <div class="controls-grid">
          <div>
            <label for="songSelect">1. Pick Track from Catalog</label>
            <select id="songSelect"></select>
          </div>
          <div>
            <label for="customTitle">Custom Song Title (Optional)</label>
            <input id="customTitle" type="text" placeholder="Type a single title to test..." />
          </div>
          <div>
            <label for="hubUrl">Artist Hub / Release Link</label>
            <input id="hubUrl" type="text" value="https://martinstrayd.github.io/artist/" />
          </div>
          <div>
            <label for="noteInput">Release / Radio Note (Optional)</label>
            <input id="noteInput" type="text" placeholder="Add a fresh note or radio update..." />
          </div>
        </div>
        <div class="hero-actions">
          <button id="makePostsBtn" class="primary" type="button">Make Social Posts</button>
          <button id="stopSpeakBtn" type="button">Stop Voice</button>
          <span id="statusText" class="status-pill">Reading bible & catalog...</span>
        </div>
      </div>
    </section>

    <section id="postsGrid" class="posts-grid"></section>
  </div>

  <script>
    const CHANNELS = [
      { id: "x", label: "X", max: 280 },
      { id: "tiktok", label: "TikTok", max: 2200 },
      { id: "instagram", label: "Instagram", max: 2200 },
      { id: "facebook", label: "Facebook", max: 63206 },
      { id: "ytTitle", label: "YouTube Title", max: 100 },
      { id: "ytDesc", label: "YouTube Description", max: 5000 },
      { id: "press", label: "Press Release", max: 12000 }
    ];

    const BIBLE_STATE = {
      loadedFiles: [],
      hubUrl: "https://martinstrayd.github.io/artist/",
      paypalUrl: "https://www.paypal.com/paypalme/martinstrayd",
      wiseUrl: "https://wise.com/pay/r/xGmJi9kSdap4lKo",
      coffeeUrl: "https://buymeacoffee.com/martinstrayd"
    };

    const $ = (id) => document.getElementById(id);

    function cleanTitle(raw) {
      return String(raw || "")
        .replace(/\{\{TITLE\}\}/gi, "")
        .replace(/\b(?:SINGLE|STRAYD[-_ ]?ID)[-_ ]?\d+\b/gi, "")
        .replace(/^Martin\s+Strayd\s*[-–—:|]+\s*/i, "")
        .replace(/#FirstIteminCatalogJSONon\b/gi, "")
        .replace(/\s*\(\s*\)\s*/g, " ")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function fullDateString() {
      return new Date().toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function makeFallbackArt(title) {
      const safe = (title || "Single").replace(/[<>&"]/g, "");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
        <rect width="600" height="600" fill="#121926"/>
        <circle cx="300" cy="250" r="110" fill="#38bdf8" fill-opacity="0.16"/>
        <text x="300" y="290" text-anchor="middle" fill="#eef3fb" font-family="system-ui,sans-serif" font-size="30" font-weight="700">${safe.slice(0, 28)}</text>
        <text x="300" y="335" text-anchor="middle" fill="#9fb0c8" font-family="system-ui,sans-serif" font-size="18">Martin Strayd • DJ Veg Anna</text>
      </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    async function loadBibleRules() {
      const files = [
        "../bible/00-bible-index.md",
        "../bible/02-links.md",
        "../bible/03-master-pages.md",
        "../bible/AnnaManual.md"
      ];
      for (const path of files) {
        try {
          const r = await fetch(path, { cache: "no-store" });
          if (!r.ok) continue;
          const txt = await r.text();
          BIBLE_STATE.loadedFiles.push(path.replace("../", ""));
          const hubMatch = txt.match(/https:\/\/martinstrayd\.github\.io\/artist\/[^\s)]*/i);
          if (hubMatch) BIBLE_STATE.hubUrl = hubMatch[0];
          const ppMatch = txt.match(/https:\/\/www\.paypal\.com\/paypalme\/martinstrayd[^\s)]*/i);
          if (ppMatch) BIBLE_STATE.paypalUrl = ppMatch[0];
          const wiseMatch = txt.match(/https:\/\/wise\.com\/pay\/r\/[^\s)]*/i);
          if (wiseMatch) BIBLE_STATE.wiseUrl = wiseMatch[0];
          const bmcMatch = txt.match(/https:\/\/buymeacoffee\.com\/martinstrayd[^\s)]*/i);
          if (bmcMatch) BIBLE_STATE.coffeeUrl = bmcMatch[0];
        } catch {}
      }
      if (!$("hubUrl").value.trim()) {
        $("hubUrl").value = BIBLE_STATE.hubUrl;
      }
    }

    function renderCards() {
      const grid = $("postsGrid");
      grid.innerHTML = "";
      CHANNELS.forEach((ch) => {
        const card = document.createElement("article");
        card.className = "post-card";
        card.innerHTML = `
          <div class="post-head">
            <span>${ch.label}</span>
            <span id="count-${ch.id}" class="char-count">0 / ${ch.max}</span>
          </div>
          <textarea id="ta-${ch.id}" readonly></textarea>
          <div class="btn-row">
            <button type="button" data-act="speak" data-ch="${ch.id}">Speak</button>
            <button type="button" data-act="edit" data-ch="${ch.id}">Edit</button>
            <button type="button" data-act="save" data-ch="${ch.id}">Save</button>
            <button type="button" data-act="copy" data-ch="${ch.id}">Copy</button>
            <button type="button" data-act="post" data-ch="${ch.id}">Post</button>
          </div>
        `;
        grid.appendChild(card);

        const ta = card.querySelector("textarea");
        ta.addEventListener("input", () => updateCounter(ch.id, ch.max));
      });

      grid.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const act = btn.dataset.act;
        const chId = btn.dataset.ch;
        const ta = $(`ta-${chId}`);
        if (!ta) return;

        if (act === "speak") {
          speakForRadio(ta.value);
        } else if (act === "edit") {
          ta.readOnly = false;
          ta.focus();
          $("statusText").textContent = `Editing ${chId}`;
        } else if (act === "save") {
          ta.readOnly = true;
          localStorage.setItem(`anna_post_${chId}`, ta.value);
          $("statusText").textContent = `Saved ${chId}`;
        } else if (act === "copy") {
          navigator.clipboard?.writeText(ta.value).catch(() => {});
          $("statusText").textContent = `Copied ${chId}`;
        } else if (act === "post") {
          openShareTarget(chId, ta.value);
        }
      });
    }

    function updateCounter(chId, max) {
      const ta = $(`ta-${chId}`);
      const cnt = $(`count-${chId}`);
      if (ta && cnt) {
        cnt.textContent = `${ta.value.length} / ${max}`;
      }
    }

    function speakForRadio(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const spoken = String(text || "")
        .replace(/https?:\/\/\S+/gi, " ")
        .replace(/#[A-Za-z0-9_]+/g, " ")
        .replace(/[:*_=~`<>|]+/g, " ")
        .replace(/\s{2,}/g, " ")
        .trim();
      if (!spoken) return;
      const utter = new SpeechSynthesisUtterance(spoken);
      const voices = window.speechSynthesis.getVoices();
      const pref = voices.find((v) => /female|zira|aria|samantha|victoria|google uk english female/i.test(v.name))
        || voices.find((v) => /^en/i.test(v.lang));
      if (pref) utter.voice = pref;
      utter.rate = 0.98;
      window.speechSynthesis.speak(utter);
      $("statusText").textContent = "DJ Veg Anna speaking post for radio filler...";
    }

    function openShareTarget(chId, text) {
      const hub = $("hubUrl").value.trim() || BIBLE_STATE.hubUrl;
      if (chId === "x") {
        window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(text.slice(0, 280))}`, "_blank", "noopener");
      } else {
        navigator.clipboard?.writeText(text).catch(() => {});
        window.open(hub, "_blank", "noopener");
      }
      $("statusText").textContent = `Prepared ${chId} post`;
    }

    function buildPostsFromInput() {
      const sel = $("songSelect");
      const chosenOptionTitle = sel.options[sel.selectedIndex]?.dataset?.cleanTitle || "";
      const title = cleanTitle($("customTitle").value) || chosenOptionTitle || "Featured Single";
      const artist = "Martin Strayd";
      const dateStr = fullDateString();
      const hub = $("hubUrl").value.trim() || BIBLE_STATE.hubUrl;
      const note = cleanTitle($("noteInput").value);

      $("songHeading").textContent = title;
      $("dateMeta").textContent = `DJ Veg Anna • ${dateStr}`;
      const chosenArt = sel.options[sel.selectedIndex]?.dataset?.art || "";
      $("coverImg").src = chosenArt || makeFallbackArt(title);
      $("coverImg").onerror = () => { $("coverImg").src = makeFallbackArt(title); };

      const notePart = note ? `${note} ` : "";

      const values = {
        x: `"${title}" by ${artist} — ${notePart}${hub} #MartinStrayd #IndieMusic`.trim().slice(0, 280),
        tiktok: `DJ Anna's pick today (${dateStr}): "${title}" by ${artist}. ${notePart}Own the MP3 + cover art bundle at ${hub} #MartinStrayd #DJAnna #Songwriting #IndieMusic`.trim().slice(0, 2200),
        instagram: `"${title}" — ${artist} (${dateStr}) • ${hub}\n\n${notePart}MP3 + cover art bundle available at ${hub}\n\n#MartinStrayd #DJAnna #Songwriting #IndieMusic`.trim().slice(0, 2200),
        facebook: `DJ Veg Anna on air (${dateStr}) with "${title}" by ${artist}.\n\n${notePart}Listen and get the MP3 + cover art bundle: ${hub}\n\n#MartinStrayd #DJAnna #IndieMusic`.trim().slice(0, 63206),
        ytTitle: `"${title}" — ${artist} | DJ Veg Anna Spotlight #MartinStrayd`.slice(0, 100),
        ytDesc: `"${title}" by ${artist} — ${dateStr}\n\n${notePart}Artist Store & Hub: ${hub}\nPayPal: ${BIBLE_STATE.paypalUrl}\nWise (200 THB): ${BIBLE_STATE.wiseUrl}\nBuy Me a Coffee: ${BIBLE_STATE.coffeeUrl}\n\n#MartinStrayd #DJAnna #Songwriting #IndieMusic #DailySingle`.trim().slice(0, 5000),
        press: `OFFICIAL MARTIN STRAYD SINGLES PARTY BY DJ VEG ANNA\n${dateStr}\n\n"${title}" — ${artist}\n\n${notePart}Artist Store & Hub: ${hub}`
      };

      CHANNELS.forEach((ch) => {
        const ta = $(`ta-${ch.id}`);
        if (ta) {
          ta.value = values[ch.id] || "";
          updateCounter(ch.id, ch.max);
        }
      });
      const bibleNote = BIBLE_STATE.loadedFiles.length ? ` (${BIBLE_STATE.loadedFiles.length} bible files read)` : "";
      $("statusText").textContent = `Posts built for "${title}"${bibleNote}`;
    }

    async function loadCatalog() {
      await loadBibleRules();
      const select = $("songSelect");
      select.innerHTML = "";
      const sources = [
        "../strayd/songs-db.json",
        "../strayd/core-catalog.json",
        "songs-db.json",
        "core-catalog.json"
      ];
      let tracks = [];
      for (const url of sources) {
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) continue;
          const data = await r.json();
          const list = Array.isArray(data) ? data : (data.songs || data.tracks || data.items || []);
          if (list.length) {
            tracks = list;
            break;
          }
        } catch {}
      }

      if (!tracks.length) {
        tracks = [{ title: "Featured Single" }];
      }

      tracks.forEach((t, idx) => {
        const tClean = cleanTitle(t.title || t.name || t.track || `Track ${idx + 1}`) || `Track ${idx + 1}`;
        const opt = document.createElement("option");
        opt.value = String(idx);
        opt.textContent = tClean;
        opt.dataset.cleanTitle = tClean;
        opt.dataset.art = t.cover || t.artwork || t.image || "";
        select.appendChild(opt);
      });

      buildPostsFromInput();
    }

    renderCards();
    $("makePostsBtn").addEventListener("click", buildPostsFromInput);
    $("songSelect").addEventListener("change", buildPostsFromInput);
    $("stopSpeakBtn").addEventListener("click", () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      $("statusText").textContent = "Voice stopped";
    });
    loadCatalog();
  </script>
</body>
</html>
