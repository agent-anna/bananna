<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ ANNA - Daily Singles Media Empire Studio</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-2: #192232;
      --text: #eef3fb;
      --muted: #9fb0c8;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 20px; }
    .hero {
      display: grid;
      grid-template-columns: 205px 1fr;
      gap: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      align-items: start;
    }
    @media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }
    .art-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .song-title { margin: 0 0 6px; font-size: 1.65rem; line-height: 1.2; }
    .meta-line { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    select, input, textarea {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
      font-family: inherit;
    }
    textarea { min-height: 195px; resize: vertical; line-height: 1.54; }
    .link-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.84rem;
    }
    .link-toggles label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--text);
      cursor: pointer;
    }
    .link-toggles input[type="checkbox"] { width: auto; margin: 0; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.84rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #061018; font-weight: 600; border: none; }
    .status-pill { font-size: 0.8rem; color: var(--accent); padding-left: 6px; }
    .press-top { margin-bottom: 16px; }
    .press-top textarea { min-height: 440px; line-height: 1.6; }
    .posts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; }
    .head-left { display: flex; align-items: center; gap: 10px; }
    .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); flex: 0 0 auto; }
    .char-count { font-size: 0.76rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
    .btn-row { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; }
    .btn-row button { flex: 0 0 auto; padding: 6px 10px; font-size: 0.78rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="art-box">
        <img id="coverImg" alt="Song cover art" />
      </div>
      <div>
        <h1 id="songHeading" class="song-title">Loading song database...</h1>
        <div id="djMeta" class="meta-line">DJ ANNA - Live Non-Repeating Daily Singles Studio</div>
        <div class="controls-grid">
          <div>
            <label for="songSelect">1. Pick Song from Catalog</label>
            <select id="songSelect"></select>
          </div>
          <div>
            <label for="voiceSelect">DJ ANNA / Veg Anna Female Voice</label>
            <select id="voiceSelect"></select>
          </div>
          <div>
            <label for="customTitle">Custom Song Title (Optional)</label>
            <input id="customTitle" type="text" placeholder="Type a song title..." />
          </div>
          <div>
            <label for="hubUrl">Sales Portal / Artist Hub</label>
            <input id="hubUrl" type="text" value="https://martinstrayd.github.io/artist/" />
          </div>
          <div>
            <label for="noteInput">Story / Hook / Lyrics Angle (Optional)</label>
            <input id="noteInput" type="text" placeholder="Add a song hook, lyric line, or backstory..." />
          </div>
          <div>
            <label for="newsInput">New Cities / Tour / News Update (Optional)</label>
            <input id="newsInput" type="text" placeholder="e.g. New radio cities or upcoming dates..." />
          </div>
          <div>
            <label for="countriesInput">Radio Airplay Countries (Press Release)</label>
            <input id="countriesInput" type="text" value="Australia, the Philippines, Ecuador, the United States, Chile, Canada, Indonesia, France, and Thailand" />
          </div>
        </div>

        <div class="link-toggles" aria-label="Optional links to append">
          <label><input type="checkbox" id="chkHub" checked /> Artist Hub</label>
          <label><input type="checkbox" id="chkCoffee" /> Buy Me a Coffee</label>
          <label><input type="checkbox" id="chkPaypal" /> PayPal</label>
          <label><input type="checkbox" id="chkWise" /> Wise (200 THB)</label>
        </div>

        <div class="hero-actions">
          <button id="makePostsBtn" class="primary" type="button">Generate Fresh Set</button>
          <a href="catalog-filter.html" style="color:var(--accent);font-size:0.84rem;font-weight:600;text-decoration:none;padding:0 4px;">Song Selector</a>
          <a href="radio-stream.html" style="color:var(--accent);font-size:0.84rem;font-weight:600;text-decoration:none;padding:0 4px;">Live Radio Stream</a>
          <button id="testVoiceBtn" type="button">Test Anna Voice</button>
          <button id="stopSpeakBtn" type="button">Stop Voice</button>
          <button id="exportHistoryBtn" type="button">Save History JSON</button>
          <span id="statusText" class="status-pill">Loading bible & song database...</span>
        </div>
      </div>
    </section>

    <section id="pressTop" class="press-top"></section>
    <section id="postsGrid" class="posts-grid"></section>
  </div>

  <script>
    const PRESS_CHANNEL = { id: "press", label: "Official Wire Press Release (Dated - 3/4-Page A4 - Full Bio)", max: 12000 };
    const SOCIAL_CHANNELS = [
      { id: "x", label: "X", max: 280 },
      { id: "tiktok", label: "TikTok", max: 2200 },
      { id: "instagram", label: "Instagram", max: 2200 },
      { id: "facebook", label: "Facebook", max: 63206 },
      { id: "ytTitle", label: "YouTube Title", max: 100 },
      { id: "ytDesc", label: "YouTube Description", max: 5000 }
    ];
    const ALL_CHANNELS = [PRESS_CHANNEL, ...SOCIAL_CHANNELS];

    const BIBLE = {
      hubUrl: "https://martinstrayd.github.io/artist/",
      coffeeUrl: "https://buymeacoffee.com/martinstrayd",
      paypalUrl: "https://www.paypal.com/paypalme/martinstrayd",
      wiseUrl: "https://wise.com/pay/r/xGmJi9kSdap4lKo",
      callSignFragments: []
    };

    const FEMALE_VOICE_HINTS = [
      "aria", "jenny", "sonia", "libby", "maisie", "natasha", "clara", "ava",
      "samantha", "victoria", "allison", "zoe", "karen", "moira", "tessa",
      "zira", "hazel", "susan", "fiona", "veena", "female", "woman", "girl"
    ];
    const MALE_VOICE_HINTS = [
      "guy", "ryan", "christopher", "eric", "davis", "andrew", "brian",
      "steffan", "david", "mark", "george", "daniel", "arthur", "oliver",
      "male", "man", "boy"
    ];

    let CATALOG_SONGS = [];
    let CURRENT_ART = "";
    let GEN_NONCE = Date.now() % 100000;
    let AVAILABLE_VOICES = [];
    const SEEN_HASHES = new Set(JSON.parse(localStorage.getItem("anna_seen_posts_v1") || "[]"));

    const $ = (id) => document.getElementById(id);

    function sanitizeText(str) {
      return String(str || "")
        .replace(/[\u2013\u2014\u2015]/g, "-")
        .replace(/\s+-\s+/g, " - ")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(36);
    }

    function makeRng(seedNum) {
      let s = seedNum >>> 0;
      return () => {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function pickOne(rng, arr) {
      return arr[Math.floor(rng() * arr.length)];
    }

    function extractTitleTokens(title) {
      const stop = new Set(["the", "and", "for", "with", "from", "into", "that", "this", "your", "you", "can", "are", "was", "but", "not", "all", "one", "out", "off"]);
      const words = String(title || "")
        .replace(/[^A-Za-z0-9\s'-]/g, " ")
        .split(/\s+/)
        .map((w) => w.trim())
        .filter((w) => w.length >= 3 && !stop.has(w.toLowerCase()));
      return Array.from(new Set(words));
    }

    function parseBibleCallSigns(md) {
      const list = [];
      md.split(/\r?\n/).forEach((raw) => {
        if (!/^-\s+/.test(raw)) return;
        const clean = sanitizeText(raw.replace(/^-\s+/, ""));
        const parts = clean.split("|").map((p) => p.trim());
        const host = /^(DJ ANNA|Veg Anna)$/i.test(parts[0]) ? parts[0] : (parts.length > 1 ? "DJ ANNA" : "Veg Anna");
        const phrase = parts.length > 1 ? parts[1] : parts[0];
        if (phrase) list.push({ host, phrase });
      });
      if (list.length) BIBLE.callSignFragments = list;
    }

    async function loadBible() {
      const docs = [
        "../bible/00-bible-index.md",
        "../bible/02-links.md",
        "../bible/03-master-pages.md",
        "../bible/04-voice-and-broadcast-law.md",
        "../bible/05-mission-manifesto.md",
        "../bible/06-dj-anna-persona.md"
      ];
      for (const path of docs) {
        try {
          const r = await fetch(path, { cache: "no-store" });
          if (!r.ok) continue;
          const txt = await r.text();
          if (path.endsWith("06-dj-anna-persona.md")) parseBibleCallSigns(txt);
          const hubMatch = txt.match(/https:\/\/martinstrayd\.github\.io\/artist\/[^\s)]*/i);
          if (hubMatch) BIBLE.hubUrl = hubMatch[0];
          const coffeeMatch = txt.match(/https:\/\/buymeacoffee\.com\/martinstrayd[^\s)]*/i);
          if (coffeeMatch) BIBLE.coffeeUrl = coffeeMatch[0];
          const ppMatch = txt.match(/https:\/\/www\.paypal\.com\/paypalme\/martinstrayd[^\s)]*/i);
          if (ppMatch) BIBLE.paypalUrl = ppMatch[0];
          const wiseMatch = txt.match(/https:\/\/wise\.com\/pay\/r\/[^\s)]*/i);
          if (wiseMatch) BIBLE.wiseUrl = wiseMatch[0];
        } catch {}
      }
      if (!$("hubUrl").value.trim()) $("hubUrl").value = BIBLE.hubUrl;
    }

    function scoreFemaleVoice(voice) {
      const hay = `${voice.name || ""} ${voice.voiceURI || ""} ${voice.lang || ""}`.toLowerCase();
      let score = /^en[-_]/i.test(voice.lang || "") ? 20 : 0;
      if (/natural|neural|online|premium|enhanced/i.test(hay)) score += 35;
      for (const h of FEMALE_VOICE_HINTS) if (hay.includes(h)) score += 45;
      for (const m of MALE_VOICE_HINTS) if (new RegExp(`\\b${m}\\b`, "i").test(hay)) score -= 120;
      return score;
    }

    function populateVoices() {
      if (!("speechSynthesis" in window)) return;
      const raw = window.speechSynthesis.getVoices() || [];
      if (!raw.length) return;
      const sorted = [...raw].sort((a, b) => scoreFemaleVoice(b) - scoreFemaleVoice(a));
      const nonMale = sorted.filter((v) => scoreFemaleVoice(v) > -50);
      AVAILABLE_VOICES = nonMale.length ? nonMale : sorted;

      const sel = $("voiceSelect");
      const savedName = localStorage.getItem("anna_female_voice_name") || "";
      sel.innerHTML = "";
      AVAILABLE_VOICES.forEach((v, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        const tag = scoreFemaleVoice(v) >= 45 ? "Female" : "Voice";
        opt.textContent = `${tag} - ${v.name} (${v.lang})`;
        sel.appendChild(opt);
      });
      const savedIdx = AVAILABLE_VOICES.findIndex((v) => v.name === savedName);
      sel.value = String(savedIdx >= 0 ? savedIdx : 0);
    }

    function getSelectedVoice() {
      if (!AVAILABLE_VOICES.length) populateVoices();
      const idx = Number($("voiceSelect")?.value || 0);
      return AVAILABLE_VOICES[idx] || AVAILABLE_VOICES[0] || null;
    }

    function cleanTitle(raw) {
      return sanitizeText(String(raw || "")
        .replace(/\{\{TITLE\}\}/gi, "")
        .replace(/\b(?:SINGLE|STRAYD[-_ ]?ID)[-_ ]?\d+\b/gi, "")
        .replace(/^Martin\s+Strayd\s*[-–—:|]+\s*/i, "")
        .replace(/#FirstIteminCatalogJSONon\b/gi, "")
        .replace(/\s*\(\s*\)\s*/g, " "));
    }

    function fitUnderLimit(text, maxLen) {
      const clean = sanitizeText(String(text || "").replace(/\s+/g, " "));
      if (clean.length <= maxLen) return clean;
      const cut = clean.slice(0, maxLen - 1);
      const sp = cut.lastIndexOf(" ");
      return (sp > Math.floor(maxLen * 0.65) ? cut.slice(0, sp) : cut).trim();
    }

    function pressDateString() {
      return new Date().toLocaleDateString("en-US", {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });
    }

    function makeFallbackArt(title) {
      const safe = (title || "Martin Strayd Single").replace(/[<>&"]/g, "");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
        <rect width="600" height="600" fill="#132238"/>
        <text x="300" y="280" text-anchor="middle" fill="#eef3fb" font-family="system-ui,sans-serif" font-size="28" font-weight="700">${safe.slice(0, 26)}</text>
        <text x="300" y="325" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="18">DAILY SINGLE BROADCAST</text>
      </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function resolveArtUrl(songOrRaw, title) {
      const candidates = typeof songOrRaw === "object" && songOrRaw !== null
        ? [songOrRaw.artUrl, songOrRaw.art, songOrRaw.artwork, songOrRaw.image, songOrRaw.coverArt]
        : [songOrRaw];
      for (const raw of candidates) {
        const val = String(raw || "").trim();
        if (!val) continue;
        if (/^(https?:\/\/|data:image\/)/i.test(val)) return val;
        if (/^store-art\//i.test(val)) return `https://martinstrayd.github.io/artist/${encodeURI(val)}`;
        return `../${encodeURI(val.replace(/^(\.\/|\.\.\/)+/, ""))}`;
      }
      return makeFallbackArt(title);
    }

    function getCompanionTitles(currentIdx, rng) {
      if (CATALOG_SONGS.length <= 1) return `"365"`;
      const picks = new Set();
      let guard = 0;
      while (picks.size < Math.min(3, CATALOG_SONGS.length - 1) && guard < 30) {
        guard += 1;
        const pickIdx = Math.floor(rng() * CATALOG_SONGS.length);
        if (pickIdx !== currentIdx && CATALOG_SONGS[pickIdx]?.title) {
          picks.add(`"${CATALOG_SONGS[pickIdx].title}"`);
        }
      }
      return Array.from(picks).join(", ") || `"365"`;
    }

    function getSelectedLinks() {
      const hub = $("hubUrl").value.trim() || BIBLE.hubUrl;
      const chosen = [];
      if ($("chkHub")?.checked && hub) chosen.push(`Artist Hub: ${hub}`);
      if ($("chkCoffee")?.checked) chosen.push(`Buy Me a Coffee: ${BIBLE.coffeeUrl}`);
      if ($("chkPaypal")?.checked) chosen.push(`PayPal: ${BIBLE.paypalUrl}`);
      if ($("chkWise")?.checked) chosen.push(`Wise (200 THB): ${BIBLE.wiseUrl}`);
      return { hub, chosen };
    }

    function createCardElement(ch) {
      const card = document.createElement("article");
      card.className = "post-card";
      card.innerHTML = `
        <div class="post-head">
          <div class="head-left">
            <img class="thumb" data-art-thumb alt="" />
            <span>${ch.label}</span>
          </div>
          <span id="count-${ch.id}" class="char-count">0 / ${ch.max}</span>
        </div>
        <textarea id="ta-${ch.id}" readonly></textarea>
        <div class="btn-row">
          <button type="button" data-act="speak" data-ch="${ch.id}">Speak</button>
          <button type="button" data-act="edit" data-ch="${ch.id}">Edit</button>
          <button type="button" data-act="save" data-ch="${ch.id}">Save</button>
          <button type="button" data-act="copy" data-ch="${ch.id}">Copy</button>
          <button type="button" data-act="post" data-ch="${ch.id}">Post</button>
        </div>
      `;
      const ta = card.querySelector("textarea");
      ta.addEventListener("input", () => updateCounter(ch.id, ch.max));
      return card;
    }

    function renderCards() {
      const pressContainer = $("pressTop");
      const grid = $("postsGrid");
      pressContainer.innerHTML = "";
      grid.innerHTML = "";
      pressContainer.appendChild(createCardElement(PRESS_CHANNEL));
      SOCIAL_CHANNELS.forEach((ch) => grid.appendChild(createCardElement(ch)));

      const handleAction = (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const act = btn.dataset.act;
        const chId = btn.dataset.ch;
        const ta = $(`ta-${chId}`);
        if (!ta) return;

        if (act === "speak") {
          speakForRadio(ta.value);
          recordHistory(chId, "spoken", ta.value);
        } else if (act === "edit") {
          ta.readOnly = false;
          ta.focus();
          $("statusText").textContent = `Editing ${chId}`;
        } else if (act === "save") {
          ta.readOnly = true;
          localStorage.setItem(`anna_post_${chId}`, ta.value);
          recordHistory(chId, "saved", ta.value);
          $("statusText").textContent = `Saved ${chId}`;
        } else if (act === "copy") {
          navigator.clipboard?.writeText(ta.value).catch(() => {});
          recordHistory(chId, "copied", ta.value);
          $("statusText").textContent = `Copied ${chId}`;
        } else if (act === "post") {
          const { hub } = getSelectedLinks();
          if (chId === "x") {
            window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(ta.value.slice(0, 280))}`, "_blank", "noopener");
          } else {
            navigator.clipboard?.writeText(ta.value).catch(() => {});
            window.open(hub, "_blank", "noopener");
          }
          recordHistory(chId, "posted", ta.value);
        }
      };

      pressContainer.addEventListener("click", handleAction);
      grid.addEventListener("click", handleAction);
    }

    function recordHistory(channel, action, text) {
      const title = $("songHeading").textContent || "Featured Single";
      const key = "anna_strayd_release_history";
      let list = [];
      try { list = JSON.parse(localStorage.getItem(key) || "[]"); } catch { list = []; }
      list.unshift({
        timestamp: new Date().toISOString(),
        date: pressDateString(),
        song: title,
        channel,
        action,
        preview: String(text || "").slice(0, 240)
      });
      localStorage.setItem(key, JSON.stringify(list.slice(0, 500)));
    }

    function exportHistoryJson() {
      const raw = localStorage.getItem("anna_strayd_release_history") || "[]";
      const blob = new Blob([raw], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "strayd-release-history.json";
      a.click();
      URL.revokeObjectURL(url);
      $("statusText").textContent = "Downloaded strayd-release-history.json";
    }

    function syncArtwork(title) {
      const fallback = makeFallbackArt(title);
      const src = CURRENT_ART || fallback;
      const heroImg = $("coverImg");
      heroImg.src = src;
      heroImg.onerror = () => { if (heroImg.src !== fallback) heroImg.src = fallback; };
      document.querySelectorAll("img[data-art-thumb]").forEach((img) => {
        img.alt = `${title} cover art`;
        img.src = src;
        img.onerror = () => { if (img.src !== fallback) img.src = fallback; };
      });
    }

    function updateCounter(chId, max) {
      const ta = $(`ta-${chId}`);
      const cnt = $(`count-${chId}`);
      if (ta && cnt) cnt.textContent = `${ta.value.length} / ${max}`;
    }

    function speakForRadio(text) {
      if (!("speechSynthesis" in window)) return;
      populateVoices();
      window.speechSynthesis.cancel();
      const spoken = sanitizeText(String(text || "")
        .replace(/https?:\/\/\S+/gi, " ")
        .replace(/#[A-Za-z0-9_]+/g, " ")
        .replace(/[:*_=~`<>|]+/g, " "));
      if (!spoken) return;
      const utter = new SpeechSynthesisUtterance(spoken);
      const chosenVoice = getSelectedVoice();
      if (chosenVoice) utter.voice = chosenVoice;
      utter.rate = 0.98;
      utter.pitch = 1.04;
      window.speechSynthesis.speak(utter);
      $("statusText").textContent = `On Air (${chosenVoice ? chosenVoice.name : "Female Voice"})...`;
    }

    function assembleUniqueCandidate(chId, ctx) {
      const { title, artist, host, callSign, kw1, kw2, peers, note, news, countries, dateStr, linksBlock, shortLink, rng } = ctx;
      const notePart = note ? ` ${note}` : "";
      const newsPart = news ? ` ${news}` : "";

      if (chId === "x") {
        const openers = [
          `Caught "${title}" (${artist}) spinning via ${host} - zero label polish, focus on ${kw1}.`,
          `${host} just put "${title}" by ${artist} in rotation. What happens when ${kw1} meets ${kw2}?`,
          `Daily single spotlight: "${title}" from ${artist}. ${host} flags ${kw1} before the hook settles.`,
          `Why skip a track built on ${kw1}? ${artist} delivers "${title}" with ${host} on the mic.`
        ];
        const closers = [`${shortLink} #MartinStrayd`, `${shortLink} #DailySingle`, `${shortLink} #IndieMusic`];
        return fitUnderLimit(`${pickOne(rng, openers)}${notePart}${pickOne(rng, closers)}`, 280);
      }

      if (chId === "tiktok") {
        const hooks = [
          `Hold up on "${title}" by ${artist} - ${callSign} and ${kw1} hits immediately.`,
          `${callSign}. When ${kw1} shows up in a daily release from ${artist}, you pay attention.`,
          `Listen closely to how ${artist} shapes ${kw1} inside "${title}" - ${callSign}.`,
          `Fresh single in the feed: "${title}" (${artist}). ${callSign} with a sharp look at ${kw1}.`
        ];
        const body = pickOne(rng, [
          `One new song every day from a 10+ album catalog without waiting on corporate gatekeepers.`,
          `Built across four decades of songwriting and rolling out a single every single day.`,
          `Direct from ${artist} to listeners and radio worldwide, one daily release at a time.`
        ]);
        const offer = `Grab the "${title}" MP3 and cover art bundle to own outright and share freely with friends for non-commercial enjoyment. Companion tracks: ${peers}.${notePart}${newsPart}${linksBlock}`;
        return sanitizeText(`${pickOne(rng, hooks)} ${body} ${offer}\n\n#MartinStrayd #DailySingle #${kw1.replace(/[^A-Za-z0-9]/g, "") || "Music"}`).slice(0, 2200);
      }

      if (chId === "instagram") {
        const moodLead = pickOne(rng, [
          `${callSign} - letting "${title}" by ${artist} settle in around ${kw1}.`,
          `Late-night frequency with ${host}: "${title}" from ${artist} carries the weight of ${kw1} and ${kw2}.`,
          `${callSign} with "${title}" by ${artist}, shaped by four decades of songwriting and 55 years inside music.`
        ]);
        const craft = pickOne(rng, [
          `Real songwriting has a different pulse when it goes straight from the artist to the listener.`,
          `Every release in this daily run adds another human chapter to the archive.`
        ]);
        const own = `Own the "${title}" MP3 and cover art bundle and share copies freely with friends for non-commercial enjoyment.${notePart}${linksBlock}`;
        return sanitizeText(`${moodLead} ${craft} ${own}\n\n#MartinStrayd #Songwriting #IndieMusic`).slice(0, 2200);
      }

      if (chId === "facebook") {
        const lead = pickOne(rng, [
          `${callSign} with "${title}" by ${artist}. Where does ${kw1} take you on first listen?`,
          `${host} in the booth highlighting "${title}" from ${artist} - spotlighting ${kw1} and ${kw2}.`,
          `Daily single broadcast with ${host}: "${title}" by ${artist}.`
        ]);
        const bioSnippet = pickOne(rng, [
          `${artist} brings 55 years of music history and four decades of songwriting, including 1990s Hollywood guitar technician work alongside Steve Jones of the Sex Pistols and Doug Fieger of The Knack, into a daily single rollout.`,
          `From ABC Triple J Unearthed roots to radio across ${countries}, ${artist} releases one new licensed single every single day.`
        ]);
        const prompt = `Tell us what stands out on "${title}" and check out ${peers} in the catalog. Own the MP3 and cover art bundle and share freely with friends for non-commercial enjoyment.${notePart}${newsPart}${linksBlock}`;
        return sanitizeText(`${lead} ${bioSnippet} ${prompt}\n\n#MartinStrayd #Radio #DailySingle`).slice(0, 63206);
      }

      if (chId === "ytTitle") {
        const patterns = [
          `"${title}" - ${artist} | ${host} (${kw1})`,
          `${artist} - "${title}" | ${host} Daily Single`,
          `"${title}" by ${artist} - ${kw1} | ${host}`
        ];
        return fitUnderLimit(pickOne(rng, patterns), 100);
      }

      if (chId === "ytDesc") {
        return sanitizeText([
          `${callSign}.`,
          ``,
          `FEATURED RELEASE: "${title}" by ${artist} (focus: ${kw1}, ${kw2}).`,
          `Part of a continuous single-a-day launch from a catalog spanning more than 10 albums of original music, streaming worldwide on Spotify, Apple Music, iTunes, YouTube Music, and Shazam, with international radio airplay across ${countries}.`,
          ``,
          `ARTIST BACKGROUND:`,
          `Australian songwriter and composer Martin Strayd brings 55 years of experience in music, four decades of songwriting, 1990s Hollywood guitar technician credits with Steve Jones (Sex Pistols) and Doug Fieger (The Knack), and ABC Triple J Unearthed history.`,
          ``,
          `CATALOG UNIVERSE & OWNERSHIP:`,
          `Also in the catalog: ${peers}.${notePart}${newsPart}`,
          `Collect the "${title}" MP3 and cover art bundle for permanent personal ownership and free non-commercial sharing with friends.${linksBlock}`,
          ``,
          `#MartinStrayd #DailySingle #Songwriting #IndieMusic`
        ].join("\n")).slice(0, 5000);
      }

      return sanitizeText([
        `FOR IMMEDIATE RELEASE - ${dateStr}`,
        `THE DAILY SINGLES MEDIA EMPIRE - "${title}" BY ${artist}`,
        `Daily Single Rollout - Hosted on Air by ${host}`,
        ``,
        `${callSign}. Today's release spotlight centers on "${title}" (key themes: ${kw1}, ${kw2}) by Australian lyricist, songwriter, composer, and recording artist Martin Strayd, connecting listeners to more than 10 albums of original, licensed music (${CATALOG_SONGS.length || "100+"} catalog entries).`,
        ``,
        `GLOBAL STREAMING & INTERNATIONAL RADIO`,
        `"${title}" streams worldwide across Spotify, Apple Music, iTunes, YouTube Music, and Shazam, supported by radio airplay across ${countries}. Companion catalog releases include ${peers}.${note ? `\n\nSONG NOTES\n${note}` : ""}${news ? `\n\nLATEST NEWS & DISPATCH\n${news}` : ""}`,
        ``,
        `ABOUT MARTIN STRAYD`,
        `With 55 years of experience in music and four decades of songwriting, Australian artist Martin Strayd brings veteran craft and direct artist-to-listener distribution to the daily singles model. Prior to launching his solo catalog, Strayd worked behind the scenes in Hollywood during the 1990s as a celebrity guitar technician for rock legends including Steve Jones of the Sex Pistols and Doug Fieger of The Knack, and is a featured artist on ABC Triple J Unearthed.`,
        ``,
        `LISTENER OWNERSHIP & SHARING RIGHTS`,
        `Listeners can acquire the official "${title}" MP3 and cover art bundle directly for permanent personal ownership and share copies freely with friends for non-commercial enjoyment.${linksBlock}`
      ].join("\n"));
    }

    function generateNeverRepeatedText(chId, baseCtx) {
      for (let attempt = 0; attempt < 25; attempt++) {
        const rng = makeRng((baseCtx.seed + attempt * 7919) >>> 0);
        const candidate = sanitizeText(assembleUniqueCandidate(chId, { ...baseCtx, rng }));
        const key = `${chId}:${hashString(candidate)}`;
        if (!SEEN_HASHES.has(key)) {
          SEEN_HASHES.add(key);
          try {
            localStorage.setItem("anna_seen_posts_v1", JSON.stringify(Array.from(SEEN_HASHES).slice(-2000)));
          } catch {}
          return candidate;
        }
      }
      const fallbackRng = makeRng((baseCtx.seed + Date.now()) >>> 0);
      return sanitizeText(assembleUniqueCandidate(chId, { ...baseCtx, rng: fallbackRng }));
    }

    function buildPostsFromInput(advanceRefresh = false) {
      if (advanceRefresh) GEN_NONCE += 1;

      const idx = Number($("songSelect").value || 0);
      const songObj = CATALOG_SONGS[idx] || {};
      const title = cleanTitle($("customTitle").value) || cleanTitle(songObj.title || songObj.name || songObj.track || "") || "Featured Single";
      const artist = cleanTitle(songObj.artist) || "Martin Strayd";
      const note = sanitizeText($("noteInput").value);
      const news = sanitizeText($("newsInput").value);
      const countries = sanitizeText($("countriesInput").value) || "Australia, the Philippines, Ecuador, the United States, Chile, Canada, Indonesia, France, and Thailand";
      const dateStr = pressDateString();
      const { chosen } = getSelectedLinks();

      const seedNum = (parseInt(hashString(`${title.toLowerCase()}|${idx}|${GEN_NONCE}`), 36) || 104729) >>> 0;
      const baseRng = makeRng(seedNum);

      const fallbackSigns = [
        { host: "DJ ANNA", phrase: `tuning you into "${title}" by {ARTIST} on the daily singles frequency` },
        { host: "Veg Anna", phrase: `Veg Anna live on air with "${title}" from {ARTIST}` },
        { host: "DJ ANNA", phrase: `DJ ANNA in the studio with "${title}" by {ARTIST}` },
        { host: "Veg Anna", phrase: `late-night broadcast with Veg Anna spinning "${title}" from {ARTIST}` }
      ];
      const pool = BIBLE.callSignFragments.length ? BIBLE.callSignFragments : fallbackSigns;
      const pickedSign = pickOne(baseRng, pool);
      const host = /^(DJ ANNA|Veg Anna)$/i.test(pickedSign.host) ? pickedSign.host : "DJ ANNA";
      const callSign = sanitizeText(
        pickedSign.phrase
          .replace(/\{TITLE\}/g, title)
          .replace(/\{ARTIST\}/g, artist)
          .replace(/\{HOST\}/g, host)
      );

      const tokens = extractTitleTokens(title);
      const kw1 = tokens[Math.floor(baseRng() * tokens.length)] || title;
      const kw2 = tokens[Math.floor(baseRng() * tokens.length)] || "daily single";
      const peers = getCompanionTitles(idx, baseRng);
      const linksBlock = chosen.length ? `\n\n${chosen.join("\n")}` : "";
      const shortLink = chosen.length ? ` ${chosen[0].replace(/^[^:]+:\s*/, "")}` : "";

      CURRENT_ART = resolveArtUrl(songObj, title);
      $("songHeading").textContent = title;
      $("djMeta").textContent = `${host} - ${artist} (${CATALOG_SONGS.length || 1} active tracks)`;
      syncArtwork(title);

      const ctx = {
        title, artist, host, callSign, kw1, kw2, peers,
        note, news, countries, dateStr, linksBlock, shortLink, seed: seedNum
      };

      ALL_CHANNELS.forEach((ch) => {
        const ta = $(`ta-${ch.id}`);
        if (ta) {
          ta.value = generateNeverRepeatedText(ch.id, ctx);
          updateCounter(ch.id, ch.max);
        }
      });

      $("statusText").textContent = `${host} - "${title}" (unique set #${GEN_NONCE % 10000})`;
    }

    async function loadCatalog() {
      await loadBible();
      const select = $("songSelect");
      select.innerHTML = "";

      const sources = ["songs-db.json", "core-catalog.json", "../strayd/songs-db.json", "../strayd/core-catalog.json"];
      const byTitle = new Map();
      for (const url of sources) {
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) continue;
          const data = await r.json();
          const list = Array.isArray(data) ? data : (data.songs || data.tracks || data.items || []);
          list.forEach((item) => {
            const tClean = cleanTitle(item.title || item.name || item.track || "");
            if (!tClean) return;
            const key = tClean.toLowerCase();
            const prev = byTitle.get(key) || {};
            byTitle.set(key, { ...prev, ...item, title: tClean, artUrl: item.artUrl || prev.artUrl || "", art: item.art || prev.art || "" });
          });
        } catch {}
      }

      CATALOG_SONGS = Array.from(byTitle.values());
      try {
        const savedMap = JSON.parse(localStorage.getItem("anna_studio_allowed_tracks_v1") || "null");
        if (savedMap && typeof savedMap === "object") {
          const allowedOnly = CATALOG_SONGS.filter((t) => savedMap[t.title.toLowerCase()] === true);
          if (allowedOnly.length) CATALOG_SONGS = allowedOnly;
        } else {
          const autoMasters = CATALOG_SONGS.filter((t) => !/\bdemo\b|\bunfinished\b|\brough mix\b|\bscratch\b/i.test(`${t.title || ""} ${t.promoStatus || ""} ${t.sourceType || ""}`));
          if (autoMasters.length) CATALOG_SONGS = autoMasters;
        }
      } catch {}

      if (!CATALOG_SONGS.length) CATALOG_SONGS = [{ title: "Featured Single", artist: "Martin Strayd" }];

      CATALOG_SONGS.forEach((t, idx) => {
        const opt = document.createElement("option");
        opt.value = String(idx);
        opt.textContent = `${String(idx + 1).padStart(3, "0")} - ${t.title}`;
        select.appendChild(opt);
      });

      buildPostsFromInput(false);
    }

    if ("speechSynthesis" in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    renderCards();
    $("voiceSelect").addEventListener("change", () => {
      const v = getSelectedVoice();
      if (v) localStorage.setItem("anna_female_voice_name", v.name);
      $("statusText").textContent = `Selected voice: ${v ? v.name : "Default"}`;
    });
    $("testVoiceBtn").addEventListener("click", () => {
      const t = $("songHeading").textContent || "today's single";
      speakForRadio(`Tuning you into ${t} by Martin Strayd on the daily singles frequency.`);
    });
    $("makePostsBtn").addEventListener("click", () => buildPostsFromInput(true));
    $("songSelect").addEventListener("change", () => { GEN_NONCE += 1; buildPostsFromInput(false); });
    $("customTitle").addEventListener("input", () => buildPostsFromInput(false));
    $("noteInput").addEventListener("input", () => buildPostsFromInput(false));
    $("newsInput").addEventListener("input", () => buildPostsFromInput(false));
    $("countriesInput").addEventListener("input", () => buildPostsFromInput(false));
    ["chkHub", "chkCoffee", "chkPaypal", "chkWise"].forEach((id) => {
      $(id)?.addEventListener("change", () => buildPostsFromInput(false));
    });
    $("exportHistoryBtn").addEventListener("click", exportHistoryJson);
    $("stopSpeakBtn").addEventListener("click", () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      $("statusText").textContent = "Voice stopped";
    });
    loadCatalog();
  </script>
</body>
</html>
