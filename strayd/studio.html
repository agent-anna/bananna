<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ ANNA - Daily Singles Media Empire Studio</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-2: #192232;
      --text: #eef3fb;
      --muted: #9fb0c8;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 20px; }
    .hero {
      display: grid;
      grid-template-columns: 205px 1fr;
      gap: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      align-items: start;
    }
    @media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }
    .art-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .song-title { margin: 0 0 6px; font-size: 1.65rem; line-height: 1.2; }
    .meta-line { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    select, input, textarea {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
      font-family: inherit;
    }
    textarea { min-height: 220px; resize: vertical; line-height: 1.6; padding: 12px; }
    .link-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.84rem;
    }
    .link-toggles label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--text);
      cursor: pointer;
    }
    .link-toggles input[type="checkbox"] { width: auto; margin: 0; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #061018; font-weight: 600; border: none; }
    .status-pill { font-size: 0.8rem; color: var(--accent); padding-left: 6px; }
    .press-top { margin-bottom: 16px; }
    .press-top textarea { min-height: 600px; line-height: 1.75; padding: 16px; }
    .posts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; }
    .head-left { display: flex; align-items: center; gap: 10px; }
    .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); flex: 0 0 auto; }
    .char-count { font-size: 0.76rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
    .btn-row { display: flex; flex-wrap: nowrap; gap: 5px; overflow-x: auto; }
    .btn-row button { flex: 0 0 auto; padding: 6px 9px; font-size: 0.76rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="art-box">
        <img id="coverImg" alt="Song cover art" />
      </div>
      <div>
        <h1 id="songHeading" class="song-title">Loading song database...</h1>
        <div id="djMeta" class="meta-line">DJ ANNA Singles Release Management Team - Daily Broadcast &amp; Reel Studio</div>
        <div class="controls-grid">
          <div>
            <label for="songSelect">1. Pick Song from Catalog</label>
            <select id="songSelect"></select>
          </div>
          <div>
            <label for="voiceSelect">DJ ANNA / Veg Anna Female Voice</label>
            <select id="voiceSelect"></select>
          </div>
          <div>
            <label for="customTitle">Custom Song Title (Optional)</label>
            <input id="customTitle" type="text" placeholder="Type a song title..." />
          </div>
          <div>
            <label for="hubUrl">Sales Portal / Artist Hub</label>
            <input id="hubUrl" type="text" value="https://tinyurl.com/martinstrayd" />
          </div>
          <div>
            <label for="noteInput">Story / Hook / Lyrics Angle (Optional)</label>
            <input id="noteInput" type="text" placeholder="Add a song hook, lyric line, or backstory..." />
          </div>
          <div>
            <label for="newsInput">New Cities / Tour / News Update (Optional)</label>
            <input id="newsInput" type="text" placeholder="e.g. New radio cities or upcoming dates..." />
          </div>
          <div>
            <label for="countriesInput">Radio Airplay Countries (Press Release)</label>
            <input id="countriesInput" type="text" value="Australia, Philippines, Ecuador, United States, Chile, Canada, Indonesia, France, and Thailand" />
          </div>
          <div>
            <label for="ghPatInput">GitHub PAT (Optional - Reads Bible &amp; Repo)</label>
            <input id="ghPatInput" type="password" placeholder="github_pat_... or ghp_..." />
          </div>
        </div>

        <div class="link-toggles" aria-label="Optional links to append">
          <label><input type="checkbox" id="chkHub" checked /> Artist Hub</label>
          <label><input type="checkbox" id="chkCoffee" /> Buy Me a Coffee</label>
          <label><input type="checkbox" id="chkPaypal" /> PayPal</label>
          <label><input type="checkbox" id="chkWise" /> Wise (200 THB)</label>
        </div>

        <div class="hero-actions">
          <button id="makePostsBtn" class="primary" type="button">Generate Fresh Set</button>
          <a href="catalog-filter.html" style="color:var(--accent);font-size:0.84rem;font-weight:600;text-decoration:none;padding:0 4px;">Song Selector</a>
          <a href="radio-stream.html" style="color:var(--accent);font-size:0.84rem;font-weight:600;text-decoration:none;padding:0 4px;">Live Radio Stream</a>
          <button id="reloadBibleBtn" type="button">Pull Bible &amp; Catalog</button>
          <button id="testVoiceBtn" type="button">Test Anna Voice</button>
          <button id="stopSpeakBtn" type="button">Stop Voice</button>
          <button id="exportHistoryBtn" type="button">Save History JSON</button>
          <span id="statusText" class="status-pill">Ready</span>
        </div>
      </div>
    </section>

    <section id="pressTop" class="press-top"></section>
    <section id="postsGrid" class="posts-grid"></section>
  </div>

  <script>
    const PRESS_CHANNEL = { id: "press", label: "Press Release - DJ ANNA Singles Release Management Team", max: 12000 };
    const SOCIAL_CHANNELS = [
      { id: "x", label: "X", max: 280 },
      { id: "tiktok", label: "TikTok", max: 2200 },
      { id: "instagram", label: "Instagram", max: 2200 },
      { id: "facebook", label: "Facebook", max: 63206 },
      { id: "ytTitle", label: "YouTube Title", max: 100 },
      { id: "ytDesc", label: "YouTube Description", max: 5000 }
    ];
    const ALL_CHANNELS = [PRESS_CHANNEL, ...SOCIAL_CHANNELS];
    const CHANNEL_TAG_CAPS = { x: 2, tiktok: 5, instagram: 5, facebook: 5, ytTitle: 0, ytDesc: 5, press: 0 };

    const BIBLE_BANK = {
      hubUrl: "https://tinyurl.com/martinstrayd",
      coffeeUrl: "https://buymeacoffee.com/martinstrayd",
      paypalUrl: "https://www.paypal.com/paypalme/martinstrayd",
      wiseUrl: "https://wise.com/pay/r/xGmJi9kSdap4lKo",
      callSigns: [],
      openers: [],
      loreLines: [],
      rightsLines: [],
      lawLines: [],
      loadedDocs: 0
    };

    const FEMALE_VOICE_HINTS = [
      "aria", "jenny", "sonia", "libby", "maisie", "natasha", "clara", "ava",
      "samantha", "victoria", "allison", "zoe", "karen", "moira", "tessa",
      "zira", "hazel", "susan", "fiona", "veena", "female", "woman", "girl"
    ];
    const MALE_VOICE_HINTS = [
      "guy", "ryan", "christopher", "eric", "davis", "andrew", "brian",
      "steffan", "david", "mark", "george", "daniel", "arthur", "oliver",
      "male", "man", "boy"
    ];

    let CATALOG_SONGS = [];
    let CURRENT_ART = "";
    let GEN_NONCE = Date.now() % 100000;
    let AVAILABLE_VOICES = [];
    const SEEN_HASHES = new Set(JSON.parse(localStorage.getItem("anna_seen_posts_v12") || "[]"));

    const $ = (id) => document.getElementById(id);

    function isVoiceOrUiSpec(line) {
      return /\b(voice preference|natural \/ neural|prefer natural|aria, jenny|speechsynthesis|chars|hashtag|cta|<=|>=|button|toggle|input)\b/i.test(String(line || ""));
    }

    function capHashtagsByChannel(chId, text) {
      const cap = CHANNEL_TAG_CAPS[chId];
      if (typeof cap !== "number") return text;
      let count = 0;
      return String(text || "").replace(/(^|\s)#[A-Za-z0-9_]+/g, (match, prefix) => {
        count += 1;
        return count <= cap ? `${prefix}${match.trim()}` : "";
      }).replace(/[ \t]{2,}/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    }

    function sanitizeText(str, stripDates = false) {
      let out = String(str || "")
        .replace(/[\u2013\u2014\u2015]/g, "-")
        .replace(/\s+-\s+/g, " - ");
      if (stripDates) {
        out = out.replace(/\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2}(?:,\s*\d{4})?\b/gi, "");
      }
      return out.replace(/\n{3,}/g, "\n\n").trim();
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(36);
    }

    function makeRng(seedNum) {
      let s = seedNum >>> 0;
      return () => {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function pickOne(rng, arr) {
      if (!arr || !arr.length) return "";
      return arr[Math.floor(rng() * arr.length)];
    }

    function shuffleSlice(rng, arr, count) {
      if (!arr || !arr.length) return [];
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, Math.min(count, copy.length));
    }

    function getPatHeaders() {
      const inputPat = ($("ghPatInput")?.value || "").trim();
      if (inputPat) localStorage.setItem("anna_gh_pat", inputPat);
      const pat = inputPat || localStorage.getItem("anna_gh_pat") || "";
      if (!pat) return null;
      return {
        Authorization: `Bearer ${pat}`,
        Accept: "application/vnd.github.v3+json"
      };
    }

    async function listRepoDir(dirPath) {
      const patHeaders = getPatHeaders();
      const cleanDir = String(dirPath || "").replace(/^\/+|\/+$/g, "");
      if (patHeaders) {
        try {
          const url = `https://api.github.com/repos/agent-anna/home/contents/${cleanDir}?ref=main&t=${Date.now()}`;
          const r = await fetch(url, { headers: patHeaders, cache: "no-store" });
          if (r.ok) {
            const items = await r.json();
            if (Array.isArray(items)) return items.map((it) => it.path).filter(Boolean);
          }
        } catch {}
      }
      return [];
    }

    async function readRepoText(relPath) {
      const patHeaders = getPatHeaders();
      const cleanPath = String(relPath || "").replace(/^(\.\.\/)+/, "").replace(/^\/+/, "");
      if (patHeaders) {
        try {
          const apiUrl = `https://api.github.com/repos/agent-anna/home/contents/${cleanPath}?ref=main&t=${Date.now()}`;
          const r = await fetch(apiUrl, { headers: patHeaders, cache: "no-store" });
          if (r.ok) {
            const meta = await r.json();
            if (meta && meta.content) {
              const bin = atob(meta.content.replace(/\s+/g, ""));
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              return new TextDecoder("utf-8").decode(bytes);
            }
          }
        } catch {}
      }
      try {
        const fetchTarget = relPath.startsWith("..") ? relPath : `../${cleanPath}`;
        const r = await fetch(fetchTarget, { cache: "no-store" });
        if (r.ok) return await r.text();
      } catch {}
      return "";
    }

    function ingestMarkdownIntoBank(md) {
      if (!md) return;
      BIBLE_BANK.loadedDocs += 1;

      const hubMatch = md.match(/https:\/\/(?:tinyurl\.com\/martinstrayd|martinstrayd\.github\.io\/artist\/[^\s)]*)/i);
      if (hubMatch) BIBLE_BANK.hubUrl = "https://tinyurl.com/martinstrayd";
      const coffeeMatch = md.match(/https:\/\/buymeacoffee\.com\/martinstrayd[^\s)]*/i);
      if (coffeeMatch) BIBLE_BANK.coffeeUrl = coffeeMatch[0];
      const ppMatch = md.match(/https:\/\/www\.paypal\.com\/paypalme\/martinstrayd[^\s)]*/i);
      if (ppMatch) BIBLE_BANK.paypalUrl = ppMatch[0];
      const wiseMatch = md.match(/https:\/\/wise\.com\/pay\/r\/[^\s)]*/i);
      if (wiseMatch) BIBLE_BANK.wiseUrl = wiseMatch[0];

      const lines = md.split(/\r?\n/);
      let currentHeading = "";
      for (const raw of lines) {
        const trimmed = raw.trim();
        if (!trimmed || /^```/.test(trimmed)) continue;

        const hMatch = trimmed.match(/^#{1,4}\s+(.+)/);
        if (hMatch) {
          currentHeading = hMatch[1].trim().toLowerCase();
          continue;
        }

        const candidate = sanitizeText(trimmed.replace(/^[-*•]\s+/, "").replace(/\*\*/g, ""));
        if (!candidate || candidate.length < 12 || /^https?:\/\//i.test(candidate) || isVoiceOrUiSpec(candidate)) continue;

        const pipeParts = candidate.split("|").map((p) => p.trim());
        if (/host|call sign|dj anna|veg anna/i.test(currentHeading) && pipeParts.length >= 2) {
          const host = /^(DJ ANNA|Veg Anna)$/i.test(pipeParts[0]) ? pipeParts[0] : "DJ ANNA";
          BIBLE_BANK.callSigns.push({ host, phrase: pipeParts.slice(1).join(" - ") });
        } else if (/strayd|bio|artist|mythology|manifesto|mission/i.test(currentHeading)) {
          BIBLE_BANK.loreLines.push(candidate);
        } else if (/link|rights|ownership|share|bundle|support/i.test(currentHeading)) {
          BIBLE_BANK.rightsLines.push(candidate);
        } else if (/law|hook|attention|story|curiosity|voice|broadcast|podcast/i.test(currentHeading)) {
          BIBLE_BANK.openers.push(candidate);
        } else {
          BIBLE_BANK.lawLines.push(candidate);
        }
      }
    }

    async function loadBibleBank() {
      BIBLE_BANK.callSigns = [];
      BIBLE_BANK.openers = [];
      BIBLE_BANK.loreLines = [];
      BIBLE_BANK.rightsLines = [];
      BIBLE_BANK.lawLines = [];
      BIBLE_BANK.loadedDocs = 0;

      const foundBiblePaths = await listRepoDir("bible");
      const mdPaths = foundBiblePaths.filter((p) => /\.md$/i.test(p));
      const pathsToLoad = mdPaths.length ? mdPaths : [
        "bible/00-bible-index.md",
        "bible/01-system-architecture.md",
        "bible/02-links.md",
        "bible/03-master-pages.md",
        "bible/04-voice-and-broadcast-law.md",
        "bible/05-mission-manifesto.md",
        "bible/06-dj-anna-persona.md",
        "bible/07-platform-cadence-and-hashtags.md"
      ];

      for (const path of pathsToLoad) {
        const txt = await readRepoText(path);
        if (txt) ingestMarkdownIntoBank(txt);
      }

      if (!$("hubUrl").value.trim()) $("hubUrl").value = "[https://tinyurl.com/martinstrayd](https://tinyurl.com/martinstrayd)";
    }

    function analyzeSongTitle(title) {
      const parenMatch = String(title || "").match(/\(([^)]+)\)/);
      const subPhrase = parenMatch ? parenMatch[1].trim() : "";
      const mainPhrase = String(title || "").replace(/\([^)]*\)/g, "").trim();
      const hasQuestion = /\?/.test(title);
      const stop = new Set([
        "the", "and", "for", "with", "from", "into", "that", "this", "your",
        "you", "can", "are", "was", "but", "not", "all", "one", "out", "off", "now", "mix"
      ]);
      const words = String(title || "")
        .replace(/[^A-Za-z0-9\s'-]/g, " ")
        .split(/\s+/)
        .map((w) => w.trim())
        .filter((w) => w.length >= 4 && !stop.has(w.toLowerCase()));

      const unique = [];
      const seen = new Set();
      for (const w of words) {
        const k = w.toLowerCase();
        if (!seen.has(k)) {
          seen.add(k);
          unique.push(w);
        }
      }
      const tags = unique.map((w) => `#${w.replace(/[^A-Za-z0-9]/g, "")}`).filter((t) => t.length > 4);
      return { mainPhrase: mainPhrase || title, subPhrase, hasQuestion, keywords: unique, tags };
    }

    function selectBroadcastHost(title, artist, rng) {
      if (BIBLE_BANK.callSigns.length) {
        const picked = pickOne(rng, BIBLE_BANK.callSigns);
        const host = /^(DJ ANNA|Veg Anna)$/i.test(picked.host) ? picked.host : "DJ ANNA";
        const phrase = sanitizeText(
          picked.phrase
            .replace(/\{TITLE\}/g, title)
            .replace(/\{ARTIST\}/g, artist)
            .replace(/\{HOST\}/g, host)
        );
        return { host, callSign: phrase };
      }
      const host = rng() > 0.5 ? "DJ ANNA" : "Veg Anna";
      return { host, callSign: `${host} live on the daily singles frequency with "${title}" by ${artist}` };
    }

    function composeChannelAngle(title, artist, host, profile, rng, mode) {
      const { mainPhrase, subPhrase, hasQuestion, keywords } = profile;
      const k1 = keywords[0] || mainPhrase;
      const k2 = keywords.find((w) => w.toLowerCase() !== k1.toLowerCase()) || "";
      const lawPick = pickOne(rng, BIBLE_BANK.lawLines.filter((l) => !isVoiceOrUiSpec(l))) || "";

      if (mode === "x") {
        const xLines = subPhrase
          ? [
              `${host} spinning "${title}" by ${artist}: "${mainPhrase}" meets "${subPhrase}" on air.`,
              `Why does "${title}" pull "${mainPhrase}" and "${subPhrase}" together? ${host} has it live.`
            ]
          : [
              `${host} on air with "${title}" by ${artist}: hear how ${k1} hits the room.`,
              `Daily single spotlight from ${host}: "${title}" by ${artist} keeps ${k1} front and center.`
            ];
        return pickOne(rng, xLines);
      }

      if (mode === "tiktok") {
        const ttLines = subPhrase
          ? [
              `Look at "${title}" by ${artist}: "${mainPhrase}" and "${subPhrase}" collide right in the title before the beat even settles.`,
              `${host} on the daily single feed: "${title}" pairs "${mainPhrase}" with "${subPhrase}" for a sharp hook.`
            ]
          : [
              `Read "${title}" by ${artist} and hit play with ${host} - ${k2 ? `${k1} and ${k2}` : k1} sets the hook fast.`,
              `${host} brings "${title}" into today's single drop with ${artist}, built for instant attention.`
            ];
        return `${pickOne(rng, ttLines)}${lawPick ? ` ${lawPick}` : ""}`;
      }

      if (mode === "instagram") {
        const igLines = subPhrase
          ? [
              `"${title}" by ${artist} lives in the contrast between "${mainPhrase}" and "${subPhrase}" - ${host} frames it for late-night listening.`,
              `There is real pull in "${title}" where "${mainPhrase}" meets "${subPhrase}" under ${host}'s spotlight.`
            ]
          : [
              `"${title}" by ${artist} carries a mood built around ${k2 ? `${k1} and ${k2}` : k1} as ${host} brings it into focus.`,
              `${host} presents "${title}" by ${artist}, letting ${k1} breathe with everyday songwriting weight.`
            ];
        return pickOne(rng, igLines);
      }

      if (mode === "facebook") {
        const fbLines = subPhrase
          ? [
              `${host} is talking through "${title}" by ${artist} today, looking at how "${mainPhrase}" and "${subPhrase}" shape the track.`,
              `On air with ${host}: "${title}" brings "${mainPhrase}" and "${subPhrase}" together as part of a continuous daily singles rollout.`
            ]
          : (hasQuestion
              ? [`"${title}" opens with a question on air with ${host} - how does ${artist} answer it when you press play?`]
              : [`${host} is spinning "${title}" by ${artist} on today's broadcast around ${k2 ? `${k1} and ${k2}` : k1}.`]);
        return pickOne(rng, fbLines);
      }

      const pressLines = subPhrase
        ? [`On air with ${host}, "${title}" pairs "${mainPhrase}" with "${subPhrase}" so listeners feel the contrast right from the title.`]
        : [`${host} introduces "${title}" by ${artist} on the daily singles broadcast, spotlighting ${k2 ? `${k1} and ${k2}` : k1}.`];
      return `${pickOne(rng, pressLines)}${lawPick ? ` ${lawPick}` : ""}`;
    }

    function buildTagCluster(profile, count, extraTags = []) {
      const pool = [...profile.tags, ...extraTags, "#MartinStrayd", "#DailySingle", "#IndieMusic", "#Songwriting", "#NewMusic"];
      const seen = new Set();
      const out = [];
      for (const raw of pool) {
        const t = String(raw || "").replace(/[^A-Za-z0-9#]/g, "");
        const k = t.toLowerCase();
        if (t.length > 4 && !seen.has(k)) {
          seen.add(k);
          out.push(t);
          if (out.length >= count) break;
        }
      }
      return out.join(" ");
    }

    function assembleChannelCopy(chId, ctx) {
      const { title, artist, host, callSign, profile, note, news, countries, dateStr, chosenLinks, linksBlock, shortLink, rng } = ctx;
      const safeChosen = Array.isArray(chosenLinks) ? chosenLinks : [];
      const lorePool = shuffleSlice(rng, BIBLE_BANK.loreLines.filter((l) => !isVoiceOrUiSpec(l)), 3);
      const rightsPool = shuffleSlice(rng, BIBLE_BANK.rightsLines.filter((l) => !isVoiceOrUiSpec(l) && !/https?:\/\//i.test(l)), 2);
      const noteLine = note ? `\nStory / Hook Angle: ${sanitizeText(note, chId !== "press")}` : "";
      const newsLine = news ? `\nDispatch Update: ${sanitizeText(news, chId !== "press")}` : "";

      if (chId === "press") {

        const formattedLinks = safeChosen.length ? `\n\n${safeChosen.join("\n\n")}` : "";

        return sanitizeText([
          `DJ ANNA SINGLES RELEASE MANAGEMENT TEAM`,
          `OFFICIAL SINGLE RELEASE DISPATCH`,
          ``,
          `Date:         ${dateStr}`,
          `Lead Single:  "${title}" - ${artist}`,
          `On-Air Host:  ${host}`,

          ``,
          `${callSign}.`,
          note ? `\nStory & Hook Angle:\n${note}\n` : ``,
          news ? `\nBroadcast & Territory Dispatch:\n${news}\n` : ``,
          ``,
          `INTERNATIONAL RADIO & STREAMING`,
          ``,
          `Heard on radio across ${countries} and available across global digital streaming platforms.`,
          ``,
          `ARTIST DOSSIER - MARTIN STRAYD`,
          ``,
          `${dossierText}`,
          ``,
          `DIRECT OWNERSHIP, SHARING & LINKS`,
          ``,
          `${rightsText}${formattedLinks}`
        ].filter((part) => part !== undefined).join("\n").replace(/\n{4,}/g, "\n\n\n"), false);
      }

      if (chId === "x") {
        const xTags = buildTagCluster(profile, 2, ["#MartinStrayd"]);
        const xHook = composeChannelAngle(title, artist, host, profile, rng, "x");
        return fitUnderLimit(sanitizeText(`${xHook}${note ? ` ${note}` : ""}${shortLink} ${xTags}`, true), 280);
      }

      if (chId === "tiktok") {
        const ttHook = composeChannelAngle(title, artist, host, profile, rng, "tiktok");
        const ttTags = buildTagCluster(profile, 5);
        const rightsSnippet = rightsPool[0] || `Own the official "${title}" MP3 and cover art bundle and share freely with friends for non-commercial enjoyment.`;
        return sanitizeText([
          `${ttHook}${noteLine}${newsLine}`,
          `${rightsSnippet}${linksBlock}`,
          `${ttTags}`
        ].filter(Boolean).join("\n\n"), true).slice(0, 2200);
      }

      if (chId === "instagram") {
        const igHook = composeChannelAngle(title, artist, host, profile, rng, "instagram");
        const igTags = buildTagCluster(profile, 5);
        const loreSnippet = lorePool[0] || `Four decades of songwriting and 55 years inside music behind ${artist}.`;
        const rightsSnippet = rightsPool[0] || `Own the official "${title}" MP3 and cover art bundle and share freely with friends for non-commercial enjoyment.`;
        return sanitizeText([
          `${igHook}`,
          `${loreSnippet}${noteLine}`,
          `${rightsSnippet}${linksBlock}`,
          `${igTags}`
        ].filter(Boolean).join("\n\n"), true).slice(0, 2200);
      }

      if (chId === "facebook") {
        const fbHook = composeChannelAngle(title, artist, host, profile, rng, "facebook");
        const fbTags = buildTagCluster(profile, 5);
        const loreSnippet = lorePool.slice(0, 2).join(" ");
        const rightsSnippet = rightsPool.join(" ") || `Own the official "${title}" MP3 and cover art bundle for permanent personal ownership and share freely with friends for non-commercial enjoyment.`;
        return sanitizeText([
          `${fbHook}${noteLine}${newsLine}`,
          `${loreSnippet ? `${loreSnippet} ` : ""}Radio across ${countries}. What stands out to you on "${title}"?`,
          `${rightsSnippet}${linksBlock}`,
          `${fbTags}`
        ].filter(Boolean).join("\n\n"), true).slice(0, 63206);
      }

      if (chId === "ytTitle") {
        const kwLead = profile.keywords[0] || profile.mainPhrase;
        return fitUnderLimit(sanitizeText(`"${title}" - ${artist} | ${host} (${kwLead})`, true), 100);
      }

      const ytIntro = composeChannelAngle(title, artist, host, profile, rng, "press");
      const ytTags = buildTagCluster(profile, 5);
      return sanitizeText([

        lorePool.length ? `ARTIST & CATALOG NOTES:\n${lorePool.join(" ")}` : "",
        `OWNERSHIP & SHARING:\n${rightsPool.join(" ") || `Own the official "${title}" MP3 and cover art bundle and share freely with friends for non-commercial enjoyment.`}${noteLine}${newsLine}${linksBlock}`,
        `${ytTags}`

    function generateUniquePost(chId, baseCtx) {
      for (let attempt = 0; attempt < 35; attempt++) {
        const rng = makeRng((baseCtx.seed + attempt * 7919) >>> 0);
        const rawText = assembleChannelCopy(chId, { ...baseCtx, rng });
        const capped = capHashtagsByChannel(chId, sanitizeText(rawText, chId !== "press"));
        const key = `${chId}:${hashString(capped)}`;
        if (!SEEN_HASHES.has(key)) {
          SEEN_HASHES.add(key);
          try {
            localStorage.setItem("anna_seen_posts_v12", JSON.stringify(Array.from(SEEN_HASHES).slice(-4000)));
          } catch {}
          return capped;
        }
      }
      const fallbackRng = makeRng((baseCtx.seed + Date.now()) >>> 0);
      return capHashtagsByChannel(chId, sanitizeText(assembleChannelCopy(chId, { ...baseCtx, rng: fallbackRng }), chId !== "press"));
    }

    function slugFilePart(str) {
      return String(str || "anna-audio")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 60) || "anna-audio";
    }

    function buildCleanSpokenScript(text) {
      return sanitizeText(String(text || "")
        .replace(/https?:\/\/\S+/gi, " ")
        .replace(/#[A-Za-z0-9_]+/g, " ")
        .replace(/[:*_=~`<>|]+/g, " "), true)
        .replace(/\s+/g, " ")
        .trim();
    }

    function buildFallbackWavBlob(spokenText) {
      const sampleRate = 22050;
      const words = String(spokenText || "DJ Anna live on air").split(/\s+/).filter(Boolean);
      const durationSec = Math.min(25, Math.max(2.5, words.length * 0.28));
      const numSamples = Math.floor(sampleRate * durationSec);
      const dataSize = numSamples * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeStr = (offset, s) => {
        for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
      };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, dataSize, true);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const wordIdx = Math.min(words.length - 1, Math.floor(t / 0.28));
        const wCode = words[wordIdx].charCodeAt(0) || 65;
        const baseFreq = 185 + ((wCode * 13) % 140);
        const phraseEnv = 0.5 + 0.5 * Math.sin(Math.PI * (i / numSamples));
        const pulseEnv = 0.4 + 0.6 * Math.abs(Math.sin(Math.PI * t * 3.5));
        const sample = Math.sin(2 * Math.PI * baseFreq * t) * 0.14 * phraseEnv * pulseEnv;
        view.setInt16(44 + i * 2, Math.max(-32767, Math.min(32767, Math.floor(sample * 32767))), true);
      }
      return new Blob([buffer], { type: "audio/wav" });
    }

    function triggerBlobDownload(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    async function downloadPostAudio(chId, text) {
      const spoken = buildCleanSpokenScript(text);
      if (!spoken) {
        $("statusText").textContent = "No text available to export audio";
        return;
      }
      const songSlug = slugFilePart($("songHeading")?.textContent || "single");
      const baseName = `${songSlug}-${slugFilePart(chId)}`;

      if ("MediaRecorder" in window && navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
        try {
          $("statusText").textContent = "Select tab/window with audio to record Anna voice...";
          const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          const audioTracks = stream.getAudioTracks();
          if (audioTracks.length) {
            const captureStream = new MediaStream(audioTracks);
            const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
              ? "audio/webm;codecs=opus"
              : (MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "");
            const recorder = mimeType ? new MediaRecorder(captureStream, { mimeType }) : new MediaRecorder(captureStream);
            const chunks = [];
            recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
            const stopped = new Promise((resolve) => { recorder.onstop = resolve; });
            recorder.start();
            speakForRadio(spoken);
            await new Promise((r) => setTimeout(r, Math.min(28000, Math.max(3000, spoken.split(/\s+/).length * 360))));
            try { recorder.stop(); } catch {}
            await stopped;
            stream.getTracks().forEach((tr) => tr.stop());
            if (chunks.length) {
              const ext = (recorder.mimeType || "").includes("ogg") ? "ogg" : "webm";
              const blob = new Blob(chunks, { type: recorder.mimeType || `audio/${ext}` });
              triggerBlobDownload(blob, `${baseName}.${ext}`);
              $("statusText").textContent = `Downloaded ${baseName}.${ext}`;
              recordHistory(chId, "audio_downloaded", text);
              return;
            }
          } else {
            stream.getTracks().forEach((tr) => tr.stop());
          }
        } catch {}
      }

      speakForRadio(spoken);
      const wavBlob = buildFallbackWavBlob(spoken);
      triggerBlobDownload(wavBlob, `${baseName}.wav`);
      $("statusText").textContent = `Downloaded ${baseName}.wav (voice played live)`;
      recordHistory(chId, "wav_downloaded", text);
    }

    function scoreFemaleVoice(voice) {
      const hay = `${voice.name || ""} ${voice.voiceURI || ""} ${voice.lang || ""}`.toLowerCase();
      let score = /^en[-_]/i.test(voice.lang || "") ? 20 : 0;
      if (/natural|neural|online|premium|enhanced/i.test(hay)) score += 35;
      for (const h of FEMALE_VOICE_HINTS) if (hay.includes(h)) score += 45;
      for (const m of MALE_VOICE_HINTS) if (new RegExp(`\\b${m}\\b`, "i").test(hay)) score -= 120;
      return score;
    }

    function populateVoices() {
      if (!("speechSynthesis" in window)) return;
      const raw = window.speechSynthesis.getVoices() || [];
      if (!raw.length) return;
      const sorted = [...raw].sort((a, b) => scoreFemaleVoice(b) - scoreFemaleVoice(a));
      const nonMale = sorted.filter((v) => scoreFemaleVoice(v) > -50);
      AVAILABLE_VOICES = nonMale.length ? nonMale : sorted;

      const sel = $("voiceSelect");
      const savedName = localStorage.getItem("anna_female_voice_name") || "";
      sel.innerHTML = "";
      AVAILABLE_VOICES.forEach((v, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        const tag = scoreFemaleVoice(v) >= 45 ? "Female" : "Voice";
        opt.textContent = `${tag} - ${v.name} (${v.lang})`;
        sel.appendChild(opt);
      });
      const savedIdx = AVAILABLE_VOICES.findIndex((v) => v.name === savedName);
      sel.value = String(savedIdx >= 0 ? savedIdx : 0);
    }

    function getSelectedVoice() {
      if (!AVAILABLE_VOICES.length) populateVoices();
      const idx = Number($("voiceSelect")?.value || 0);
      return AVAILABLE_VOICES[idx] || AVAILABLE_VOICES[0] || null;
    }

    function cleanTitle(raw) {
      return sanitizeText(String(raw || "")
        .replace(/\{\{TITLE\}\}/gi, "")
        .replace(/\b(?:SINGLE|STRAYD[-_ ]?ID)[-_ ]?\d+\b/gi, "")
        .replace(/^Martin\s+Strayd\s*[-–—:|]+\s*/i, "")
        .replace(/#FirstIteminCatalogJSONon\b/gi, "")
        .replace(/\s*\(\s*\)\s*/g, " "));
    }

    function fitUnderLimit(text, maxLen) {
      const clean = sanitizeText(String(text || "").replace(/\s+/g, " "), true);
      if (clean.length <= maxLen) return clean;
      const cut = clean.slice(0, maxLen - 1);
      const sp = cut.lastIndexOf(" ");
      return (sp > Math.floor(maxLen * 0.65) ? cut.slice(0, sp) : cut).trim();
    }

    function pressDateString() {
      return new Date().toLocaleDateString("en-US", {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });
    }

    function makeFallbackArt(title) {
      const safe = (title || "Martin Strayd Single").replace(/[<>&"]/g, "");
      const svg = `<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" width="600" height="600" viewBox="0 0 600 600">
        <rect width="600" height="600" fill="#132238"/>
        <text x="300" y="280" text-anchor="middle" fill="#eef3fb" font-family="system-ui,sans-serif" font-size="28" font-weight="700">${safe.slice(0, 26)}</text>
        <text x="300" y="325" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="18">DJ ANNA SINGLES RELEASE</text>
      </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function resolveArtUrl(songOrRaw, title) {
      const candidates = typeof songOrRaw === "object" && songOrRaw !== null
        ? [songOrRaw.artUrl, songOrRaw.art, songOrRaw.artwork, songOrRaw.image, songOrRaw.coverArt]
        : [songOrRaw];
      for (const raw of candidates) {
        const val = String(raw || "").trim();
        if (!val) continue;
        if (/^(https?:\/\/|data:image\/)/i.test(val)) return val;
        if (/^store-art\//i.test(val)) return `[https://martinstrayd.github.io/artist/$](https://martinstrayd.github.io/artist/$){encodeURI(val)}`;
        return `../${encodeURI(val.replace(/^(\.\/|\.\.\/)+/, ""))}`;
      }
      return makeFallbackArt(title);
    }

    function getSelectedLinks() {
      const hub = ($("hubUrl").value.trim() || "[https://tinyurl.com/martinstrayd](https://tinyurl.com/martinstrayd)").replace("[https://martinstrayd.github.io/artist/](https://martinstrayd.github.io/artist/)", "[https://tinyurl.com/martinstrayd](https://tinyurl.com/martinstrayd)");
      const chosen = [];
      if ($("chkHub")?.checked && hub) chosen.push(`Artist Hub: ${hub}`);
      if ($("chkCoffee")?.checked) chosen.push(`Buy Me a Coffee: ${BIBLE_BANK.coffeeUrl}`);
      if ($("chkPaypal")?.checked) chosen.push(`PayPal: ${BIBLE_BANK.paypalUrl}`);
      if ($("chkWise")?.checked) chosen.push(`Wise (200 THB): ${BIBLE_BANK.wiseUrl}`);
      return { hub, chosen };
    }

    function createCardElement(ch) {
      const card = document.createElement("article");
      card.className = "post-card";
      card.innerHTML = `
        <div class="post-head">
          <div class="head-left">
            <img class="thumb" data-art-thumb alt="" />
            <span>${ch.label}</span>
          </div>
          <span id="count-${ch.id}" class="char-count">0 / ${ch.max}</span>
        </div>
        <textarea id="ta-${ch.id}" readonly></textarea>
        <div class="btn-row">
          <button type="button" data-act="speak" data-ch="${ch.id}">Speak</button>
          <button type="button" data-act="dlAudio" data-ch="${ch.id}">DL Audio</button>
          <button type="button" data-act="edit" data-ch="${ch.id}">Edit</button>
          <button type="button" data-act="save" data-ch="${ch.id}">Save</button>
          <button type="button" data-act="copy" data-ch="${ch.id}">Copy</button>
          <button type="button" data-act="post" data-ch="${ch.id}">Post</button>
        </div>
      `;
      const ta = card.querySelector("textarea");
      ta.addEventListener("input", () => updateCounter(ch.id, ch.max));
      return card;
    }

    function renderCards() {
      const pressContainer = $("pressTop");
      const grid = $("postsGrid");
      pressContainer.innerHTML = "";
      grid.innerHTML = "";
      pressContainer.appendChild(createCardElement(PRESS_CHANNEL));
      SOCIAL_CHANNELS.forEach((ch) => grid.appendChild(createCardElement(ch)));

      const handleAction = (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const act = btn.dataset.act;
        const chId = btn.dataset.ch;
        const ta = $(`ta-${chId}`);
        if (!ta) return;

        if (act === "dlAudio") {
          downloadPostAudio(chId, ta.value);
        } else if (act === "speak") {
          speakForRadio(ta.value);
          recordHistory(chId, "spoken", ta.value);
        } else if (act === "edit") {
          ta.readOnly = false;
          ta.focus();
          $("statusText").textContent = `Editing ${chId}`;
        } else if (act === "save") {
          ta.readOnly = true;
          localStorage.setItem(`anna_post_${chId}`, ta.value);
          recordHistory(chId, "saved", ta.value);
          $("statusText").textContent = `Saved ${chId}`;
        } else if (act === "copy") {
          navigator.clipboard?.writeText(ta.value).catch(() => {});
          recordHistory(chId, "copied", ta.value);
          $("statusText").textContent = `Copied ${chId}`;
        } else if (act === "post") {
          const { hub } = getSelectedLinks();
          if (chId === "x") {
            window.open(`[https://x.com/intent/tweet?text=$](https://x.com/intent/tweet?text=$){encodeURIComponent(ta.value.slice(0, 280))}`, "_blank", "noopener");
          } else {
            navigator.clipboard?.writeText(ta.value).catch(() => {});
            window.open(hub, "_blank", "noopener");
          }
          recordHistory(chId, "posted", ta.value);
        }
      };

      pressContainer.addEventListener("click", handleAction);
      grid.addEventListener("click", handleAction);
    }

    function recordHistory(channel, action, text) {
      const title = $("songHeading").textContent || "Featured Single";
      const key = "anna_strayd_release_history";
      let list = [];
      try { list = JSON.parse(localStorage.getItem(key) || "[]"); } catch { list = []; }
      list.unshift({
        timestamp: new Date().toISOString(),
        date: pressDateString(),
        song: title,
        channel,
        action,
        preview: String(text || "").slice(0, 240)
      });
      localStorage.setItem(key, JSON.stringify(list.slice(0, 500)));
    }

    function exportHistoryJson() {
      const raw = localStorage.getItem("anna_strayd_release_history") || "[]";
      const blob = new Blob([raw], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "strayd-release-history.json";
      a.click();
      URL.revokeObjectURL(url);
      $("statusText").textContent = "Downloaded strayd-release-history.json";
    }

    function syncArtwork(title) {
      const fallback = makeFallbackArt(title);
      const src = CURRENT_ART || fallback;
      const heroImg = $("coverImg");
      heroImg.src = src;
      heroImg.onerror = () => { if (heroImg.src !== fallback) heroImg.src = fallback; };
      document.querySelectorAll("img[data-art-thumb]").forEach((img) => {
        img.alt = `${title} cover art`;
        img.src = src;
        img.onerror = () => { if (img.src !== fallback) img.src = fallback; };
      });
    }

    function updateCounter(chId, max) {
      const ta = $(`ta-${chId}`);
      const cnt = $(`count-${chId}`);
      if (ta && cnt) cnt.textContent = `${ta.value.length} / ${max}`;
    }

    function speakForRadio(text) {
      if (!("speechSynthesis" in window)) return;
      populateVoices();
      window.speechSynthesis.cancel();
      const spoken = buildCleanSpokenScript(text);
      if (!spoken) return;
      const utter = new SpeechSynthesisUtterance(spoken);
      const chosenVoice = getSelectedVoice();
      if (chosenVoice) utter.voice = chosenVoice;
      utter.rate = 0.98;
      utter.pitch = 1.04;
      window.speechSynthesis.speak(utter);
      $("statusText").textContent = `On Air (${chosenVoice ? chosenVoice.name : "Female Voice"})...`;
    }

    function buildPostsFromInput(advanceRefresh = false) {
      if (advanceRefresh) GEN_NONCE += 1;

      const idx = Number($("songSelect").value || 0);
      const songObj = CATALOG_SONGS[idx] || CATALOG_SONGS[0] || {};
      const title = cleanTitle($("customTitle").value) || cleanTitle(songObj.title || songObj.name || songObj.track || "") || "Featured Single";
      const artist = cleanTitle(songObj.artist) || "Martin Strayd";
      const note = sanitizeText($("noteInput").value);
      const news = sanitizeText($("newsInput").value);
      const countries = sanitizeText($("countriesInput").value) || "Australia, Philippines, Ecuador, United States, Chile, Canada, Indonesia, France, and Thailand";
      const dateStr = pressDateString();
      const { chosen } = getSelectedLinks();

      const seedNum = (parseInt(hashString(`${title.toLowerCase()}|${idx}|${GEN_NONCE}`), 36) || 104729) >>> 0;
      const baseRng = makeRng(seedNum);

      const { host, callSign } = selectBroadcastHost(title, artist, baseRng);
      const profile = analyzeSongTitle(title);
      const linksBlock = chosen.length ? `\n\n${chosen.join("\n")}` : "";
      const shortLink = chosen.length ? ` ${chosen[0].replace(/^[^:]+:\s*/, "")}` : "";

      CURRENT_ART = resolveArtUrl(songObj, title);
      $("songHeading").textContent = title;
      $("djMeta").textContent = `${host} - DJ ANNA Singles Release Management (${BIBLE_BANK.loadedDocs} Bible docs · ${CATALOG_SONGS.length || 1} tracks)`;
      syncArtwork(title);

      const ctx = {
        title, artist, host, callSign, profile,
        note, news, countries, dateStr, chosenLinks: chosen, linksBlock, shortLink, seed: seedNum
      };

      ALL_CHANNELS.forEach((ch) => {
        const ta = $(`ta-${ch.id}`);
        if (ta) {
          ta.value = generateUniquePost(ch.id, ctx);
          updateCounter(ch.id, ch.max);
        }
      });

      $("statusText").textContent = `${host} - "${title}" (${CATALOG_SONGS.length} tracks · set #${GEN_NONCE % 10000})`;
    }

    async function loadCatalog() {
      $("statusText").textContent = "Pulling Bible & catalog...";
      try {
        await loadBibleBank();
        const select = $("songSelect");
        select.innerHTML = "";

        const sources = ["songs-db.json", "core-catalog.json", "../songs-db.json", "../core-catalog.json", "../strayd/songs-db.json", "../strayd/core-catalog.json"];
        const byTitle = new Map();
        for (const url of sources) {
          const rawTxt = await readRepoText(url);
          if (!rawTxt) continue;
          try {
            const data = JSON.parse(rawTxt);
            const list = Array.isArray(data) ? data : (data.songs || data.tracks || data.items || []);
            list.forEach((item) => {
              const tClean = cleanTitle(item.title || item.name || item.track || "");
              if (!tClean) return;
              const key = tClean.toLowerCase();
              const prev = byTitle.get(key) || {};
              byTitle.set(key, { ...prev, ...item, title: tClean, artUrl: item.artUrl || prev.artUrl || "", art: item.art || prev.art || "" });
            });
          } catch {}
        }

        CATALOG_SONGS = Array.from(byTitle.values());
        if (!CATALOG_SONGS.length) CATALOG_SONGS = [{ title: "Featured Single", artist: "Martin Strayd" }];

        CATALOG_SONGS.forEach((t, idx) => {
          const opt = document.createElement("option");
          opt.value = String(idx);
          opt.textContent = `${String(idx + 1).padStart(3, "0")} - ${t.title}`;
          select.appendChild(opt);
        });

        buildPostsFromInput(false);
      } catch (err) {
        if (!CATALOG_SONGS.length) CATALOG_SONGS = [{ title: "Featured Single", artist: "Martin Strayd" }];
        $("songSelect").innerHTML = `<option value="0">001 - Featured Single</option>`;
        buildPostsFromInput(false);
        $("statusText").textContent = `Fallback loaded (${err?.message || "ready"})`;
      }
    }

    if ("speechSynthesis" in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    const savedPat = localStorage.getItem("anna_gh_pat") || "";
    if (savedPat && $("ghPatInput")) $("ghPatInput").value = savedPat;

    renderCards();
    $("voiceSelect").addEventListener("change", () => {
      const v = getSelectedVoice();
      if (v) localStorage.setItem("anna_female_voice_name", v.name);
      $("statusText").textContent = `Selected voice: ${v ? v.name : "Default"}`;
    });
    $("reloadBibleBtn").addEventListener("click", async () => {
      await loadCatalog();
      buildPostsFromInput(true);
    });
    $("ghPatInput").addEventListener("change", async () => {
      await loadCatalog();
      buildPostsFromInput(true);
    });
    $("testVoiceBtn").addEventListener("click", () => {
      const t = $("songHeading").textContent || "today's single";
      speakForRadio(`DJ ANNA on the daily singles frequency with ${t} by Martin Strayd.`);
    });
    $("makePostsBtn").addEventListener("click", () => buildPostsFromInput(true));
    $("songSelect").addEventListener("change", () => { GEN_NONCE += 1; buildPostsFromInput(false); });
    $("customTitle").addEventListener("input", () => buildPostsFromInput(false));
    $("noteInput").addEventListener("input", () => buildPostsFromInput(false));
    $("newsInput").addEventListener("input", () => buildPostsFromInput(false));
    $("countriesInput").addEventListener("input", () => buildPostsFromInput(false));
    ["chkHub", "chkCoffee", "chkPaypal", "chkWise"].forEach((id) => {
      $(id)?.addEventListener("change", () => buildPostsFromInput(false));
    });
    $("exportHistoryBtn").addEventListener("click", exportHistoryJson);
    $("stopSpeakBtn").addEventListener("click", () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      $("statusText").textContent = "Voice stopped";
    });
    loadCatalog();
  </script>
</body>
</html>
