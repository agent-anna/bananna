<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ ANNA - Daily Singles Media Studio</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-2: #192232;
      --text: #eef3fb;
      --muted: #9fb0c8;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 20px; }
    .hero {
      display: grid;
      grid-template-columns: 205px 1fr;
      gap: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      align-items: start;
    }
    @media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }
    .art-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-2);
      border: 1px solid var(--border);
    }
    .art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .song-title { margin: 0 0 6px; font-size: 1.6rem; line-height: 1.2; }
    .meta-line { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    select, input, textarea {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
      font-family: inherit;
    }
    textarea { min-height: 210px; resize: vertical; line-height: 1.6; padding: 12px; }
    .link-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.84rem;
    }
    .link-toggles label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--text);
      cursor: pointer;
    }
    .link-toggles input[type="checkbox"] { width: auto; margin: 0; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #061018; font-weight: 600; border: none; }
    .status-pill { font-size: 0.8rem; color: var(--accent); padding-left: 6px; }
    .press-top { margin-bottom: 16px; }
    .press-top textarea { min-height: 500px; line-height: 1.75; padding: 16px; }
    .posts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; }
    .head-left { display: flex; align-items: center; gap: 10px; }
    .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); flex: 0 0 auto; }
    .char-count { font-size: 0.76rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
    .btn-row { display: flex; flex-wrap: nowrap; gap: 5px; overflow-x: auto; }
    .btn-row button { flex: 0 0 auto; padding: 6px 9px; font-size: 0.76rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="art-box">
        <img id="coverImg" alt="Song cover art" />
      </div>
      <div>
        <h1 id="songHeading" class="song-title">Loading catalog...</h1>
        <div id="djMeta" class="meta-line">DJ ANNA Singles Release Management Team - Daily Broadcast Studio</div>
        <div class="controls-grid">
          <div>
            <label for="songSelect">1. Pick Song from Catalog</label>
            <select id="songSelect"></select>
          </div>
          <div>
            <label for="voiceSelect">DJ ANNA / Veg Anna Voice</label>
            <select id="voiceSelect"></select>
          </div>
          <div>
            <label for="customTitle">Custom Song Title (Optional)</label>
            <input id="customTitle" type="text" placeholder="Override song title..." />
          </div>
          <div>
            <label for="hubUrl">Sales Portal / Artist Hub</label>
            <input id="hubUrl" type="text" value="https://martinstrayd.github.io/artist/" />
          </div>
          <div>
            <label for="noteInput">Story / Hook / Lyrics Angle (Optional)</label>
            <input id="noteInput" type="text" placeholder="Add a song hook, lyric line, or backstory..." />
          </div>
          <div>
            <label for="newsInput">New Cities / Tour / News Update (Optional)</label>
            <input id="newsInput" type="text" placeholder="e.g. New radio cities or upcoming dates..." />
          </div>
          <div>
            <label for="countriesInput">Radio Airplay Countries (Press Release)</label>
            <input id="countriesInput" type="text" value="Australia, Philippines, Ecuador, United States, Chile, Canada, Indonesia, France, and Thailand" />
          </div>
          <div>
            <label for="ghPatInput">GitHub PAT (Optional)</label>
            <input id="ghPatInput" type="password" placeholder="github_pat_... or ghp_..." />
          </div>
        </div>

        <div class="link-toggles" aria-label="Optional links to append">
          <label><input type="checkbox" id="chkHub" checked /> Artist Hub</label>
          <label><input type="checkbox" id="chkCoffee" /> Buy Me a Coffee</label>
          <label><input type="checkbox" id="chkPaypal" /> PayPal</label>
          <label><input type="checkbox" id="chkWise" /> Wise</label>
        </div>

        <div class="hero-actions">
          <button id="makePostsBtn" class="primary" type="button">Generate Fresh Set</button>
          <a href="catalog-filter.html" style="color:var(--accent);font-size:0.84rem;font-weight:600;text-decoration:none;padding:0 4px;">Catalog Filter</a>
          <a href="radio-stream.html" style="color:var(--accent);font-size:0.84rem;font-weight:600;text-decoration:none;padding:0 4px;">Live Radio Stream</a>
          <button id="reloadCatalogBtn" type="button">Reload Catalog</button>
          <button id="testVoiceBtn" type="button">Test Anna Voice</button>
          <button id="stopSpeakBtn" type="button">Stop Voice</button>
          <button id="exportHistoryBtn" type="button">Save History JSON</button>
          <span id="statusText" class="status-pill">Ready</span>
        </div>
      </div>
    </section>

    <section id="pressTop" class="press-top"></section>
    <section id="postsGrid" class="posts-grid"></section>
  </div>

  <script>
    const PRESS_CHANNEL = { id: "press", label: "Press Release - DJ ANNA Singles Release Management Team", max: 12000 };
    const SOCIAL_CHANNELS = [
      { id: "x", label: "X", max: 280 },
      { id: "tiktok", label: "TikTok", max: 2200 },
      { id: "instagram", label: "Instagram", max: 2200 },
      { id: "facebook", label: "Facebook", max: 63206 },
      { id: "ytTitle", label: "YouTube Title", max: 100 },
      { id: "ytDesc", label: "YouTube Description", max: 5000 }
    ];
    const ALL_CHANNELS = [PRESS_CHANNEL, ...SOCIAL_CHANNELS];
    const CHANNEL_TAG_CAPS = { x: 2, tiktok: 5, instagram: 5, facebook: 5, ytTitle: 0, ytDesc: 5, press: 0 };

    const BRAIN_STATE = {
      hubUrl: "https://martinstrayd.github.io/artist/",
      coffeeUrl: "https://buymeacoffee.com/martinstrayd",
      paypalUrl: "https://www.paypal.com/paypalme/martinstrayd",
      wiseNote: "Wise THB / Wise Pay direct transfer",
      loadedFiles: 0
    };

    const FEMALE_VOICE_HINTS = [
      "aria", "jenny", "sonia", "libby", "maisie", "natasha", "clara", "ava",
      "samantha", "victoria", "allison", "zoe", "karen", "moira", "tessa",
      "zira", "hazel", "susan", "fiona", "veena", "female", "woman", "girl"
    ];
    const MALE_VOICE_HINTS = [
      "guy", "ryan", "christopher", "eric", "davis", "andrew", "brian",
      "steffan", "david", "mark", "george", "daniel", "arthur", "oliver",
      "male", "man", "boy"
    ];

    let CATALOG_SONGS = [];
    let CURRENT_ART = "";
    let GEN_NONCE = Date.now() % 100000;
    let AVAILABLE_VOICES = [];
    let SPEAK_TIMER = null;
    const SEEN_HASHES = new Set(JSON.parse(localStorage.getItem("anna_seen_posts_v21") || "[]"));

    const $ = (id) => document.getElementById(id);

    function stripLabelPrefix(line) {
      return String(line || "")
        .replace(/^(?:catalog scale|ownership rule|headline pedigree|single reference catalog|international radio footprint|story\s*\/\s*hook angle|dispatch update|host cue)\s*:\s*/i, "")
        .trim();
    }

    function capHashtagsByChannel(chId, text) {
      const cap = CHANNEL_TAG_CAPS[chId];
      if (typeof cap !== "number") return text;
      let count = 0;
      return String(text || "").replace(/(^|\s)#[A-Za-z0-9_]+/g, (match, prefix) => {
        count += 1;
        return count <= cap ? `${prefix}${match.trim()}` : "";
      }).replace(/[ \t]{2,}/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    }

    function sanitizeText(str, stripDates = false) {
      let out = String(str || "")
        .replace(/`/g, "")
        .replace(/[\u2013\u2014\u2015]/g, "-")
        .replace(/\s+-\s+/g, " - ");
      if (stripDates) {
        out = out.replace(/\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2}(?:,\s*\d{4})?\b/gi, "");
      }
      return out.replace(/\n{3,}/g, "\n\n").trim();
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(36);
    }

    function makeRng(seedNum) {
      let s = seedNum >>> 0;
      return () => {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function pickOne(rng, arr) {
      if (!arr || !arr.length) return "";
      return arr[Math.floor(rng() * arr.length)];
    }

    function shuffleSlice(rng, arr, count) {
      if (!arr || !arr.length) return [];
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, Math.min(count, copy.length));
    }

    function getPatHeaders() {
      const inputPat = ($("ghPatInput")?.value || "").trim();
      if (inputPat) localStorage.setItem("anna_gh_pat", inputPat);
      const pat = inputPat || localStorage.getItem("anna_gh_pat") || "";
      if (!pat) return null;
      return {
        Authorization: `Bearer ${pat}`,
        Accept: "application/vnd.github.v3+json"
      };
    }

    async function readRepoFile(fileName) {
      const cleanName = String(fileName || "").replace(/^\.\//, "").replace(/^strayd\//, "").replace(/^\/+/, "");
      const repoPath = `strayd/${cleanName}`;
      const patHeaders = getPatHeaders();

      if (patHeaders) {
        try {
          const apiUrl = `https://api.github.com/repos/agent-anna/home/contents/${repoPath}?ref=main&t=${Date.now()}`;
          const r = await fetch(apiUrl, { headers: patHeaders, cache: "no-store" });
          if (r.ok) {
            const meta = await r.json();
            if (meta && meta.content) {
              const bin = atob(meta.content.replace(/\s+/g, ""));
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              return new TextDecoder("utf-8").decode(bytes);
            }
          }
        } catch {}
      }

      const urls = [
        `./${cleanName}`,
        `https://agent-anna.github.io/home/${repoPath}`,
        `https://raw.githubusercontent.com/agent-anna/home/main/${repoPath}`
      ];

      for (const u of urls) {
        try {
          const r = await fetch(`${u}${u.includes("?") ? "&" : "?"}t=${Date.now()}`, { cache: "no-store" });
          if (r.ok) return await r.text();
        } catch {}
      }
      return "";
    }

    function analyzeSongTitle(title) {
      const fullTitle = String(title || "").trim();
      const stop = new Set([
        "the", "and", "for", "with", "from", "into", "that", "this", "your",
        "you", "can", "are", "was", "but", "not", "all", "one", "out", "off", "now", "mix"
      ]);
      const words = fullTitle
        .replace(/[^A-Za-z0-9\s'-]/g, " ")
        .split(/\s+/)
        .map((w) => w.trim())
        .filter((w) => w.length >= 3 && !stop.has(w.toLowerCase()));

      const unique = [];
      const seen = new Set();
      for (const w of words) {
        const k = w.toLowerCase();
        if (!seen.has(k)) {
          seen.add(k);
          unique.push(w);
        }
      }
      const tags = unique.map((w) => `#${w.replace(/[^A-Za-z0-9]/g, "")}`).filter((t) => t.length > 3);
      return { fullTitle, keywords: unique, tags };
    }

    function buildPlatformTags(profile, count, rng, extraPool = []) {
      const combined = [...extraPool, ...profile.tags, "#MartinStrayd", "#DailySingle", "#Songwriting", "#IndependentArtist", "#MusicDiscovery"];
      const rotated = shuffleSlice(rng, combined, combined.length);
      const seen = new Set();
      const out = [];
      for (const raw of rotated) {
        const t = String(raw || "").replace(/[^A-Za-z0-9#]/g, "");
        const k = t.toLowerCase();
        if (t.length > 3 && !seen.has(k)) {
          seen.add(k);
          out.push(t);
          if (out.length >= count) break;
        }
      }
      return out.join(" ");
    }

    function assembleChannelCopy(chId, ctx) {
      const { title, artist, host, profile, note, news, countries, dateStr, chosenLinks, linksBlock, shortLink, rng } = ctx;
      const safeChosen = Array.isArray(chosenLinks) ? chosenLinks : [];
      const cleanNote = stripLabelPrefix(sanitizeText(note, chId !== "press"));
      const cleanNews = stripLabelPrefix(sanitizeText(news, chId !== "press"));
      const hubOnly = shortLink.trim() || BRAIN_STATE.hubUrl;
      const k1 = profile.keywords[0] || "";
      const k2 = profile.keywords.find((w) => w.toLowerCase() !== k1.toLowerCase()) || "";
      const rightsLine = `Direct MP3 and cover art bundle available via ${artist} with free non-commercial sharing with friends.`;

      if (chId === "press") {
        const briefing = pickOne(rng, [
          `${host} introduces "${title}" by ${artist} on today's single dispatch${k1 ? `, highlighting the focus on ${k2 ? `${k1} and ${k2}` : k1}` : ""}.`,
          `Today's release spotlight with ${host} features "${title}" from ${artist}, bringing a fresh single straight to listeners without label delays.`
        ]);
        const bio = [
          `Australian lyricist, songwriter, composer, and independent recording artist Martin Strayd brings four decades of songwriting and 55 years inside music to a daily singles rollout from a catalog of more than 10 albums of original work.`,
          `His background includes 1990s Hollywood guitar technician work with rock figures including Steve Jones of the Sex Pistols and Doug Fieger of The Knack, featured artist recognition on ABC Triple J Unearthed, and music played at Kunda Cafe.`
        ].join(" ");

        return sanitizeText([
          `DJ ANNA SINGLES RELEASE MANAGEMENT TEAM`,
          `OFFICIAL SINGLE RELEASE DISPATCH`,
          ``,
          `Date:         ${dateStr}`,
          `Lead Single:  "${title}" - ${artist}`,
          `On-Air Host:  ${host}`,
          ``,
          `========================================================================`,
          ``,
          `ON-AIR BRIEFING`,
          ``,
          `${briefing}`,
          cleanNote ? `\nStory & Hook Angle:\n${cleanNote}` : ``,
          cleanNews ? `\nBroadcast & Territory Dispatch:\n${cleanNews}` : ``,
          ``,
          `INTERNATIONAL RADIO & STREAMING`,
          ``,
          `Heard on radio across ${countries} and available across global digital streaming platforms.`,
          ``,
          `ARTIST DOSSIER - MARTIN STRAYD`,
          ``,
          `${bio}`,
          ``,
          `DIRECT OWNERSHIP, SHARING & LINKS`,
          ``,
          `${rightsLine}${safeChosen.length ? `\n\n${safeChosen.join("\n\n")}` : ""}`
        ].filter((part) => part !== undefined).join("\n").replace(/\n{4,}/g, "\n\n\n"), false);
      }

      if (chId === "x") {
        const hook = pickOne(rng, [
          `${host} on air with "${title}" by ${artist} - new daily single energy live now.`,
          `Fresh single drop: "${title}" from ${artist} with ${host} on today's broadcast.`
        ]);
        const tags = buildPlatformTags(profile, 2, rng, ["#NewMusic", "#DailySingle"]);
        return fitUnderLimit(sanitizeText(`${hook}${cleanNote ? ` ${cleanNote}` : ""} ${hubOnly} ${tags}`, true), 280);
      }

      if (chId === "tiktok") {
        const hook = pickOne(rng, [
          `New music every day with ${host}: "${title}" by ${artist} hits today's reel.`
        ]);
        const tags = buildPlatformTags(profile, 5, rng, ["#TikTokMusic", "#NewMusicDaily", "#ReelSound"]);
        return sanitizeText([
          `${hook}${cleanNote ? `\n${cleanNote}` : ""}`,
          `${rightsLine} ${hubOnly}`,
          `${tags}`
        ].filter(Boolean).join("\n\n"), true).slice(0, 2200);
      }

      if (chId === "instagram") {
        const hook = pickOne(rng, [
          `${host} spotlights "${title}" by ${artist} - songwriting shaped by four decades of craft and 55 years inside music.`
        ]);
        const tags = buildPlatformTags(profile, 5, rng, ["#IndieSongwriter", "#MusicStory", "#DailyDrop"]);
        return sanitizeText([
          `${hook}${cleanNote ? `\n${cleanNote}` : ""}`,
          `${rightsLine}${linksBlock ? `\n${safeChosen.join("\n")}` : ""}`,
          `${tags}`
        ].filter(Boolean).join("\n\n"), true).slice(0, 2200);
      }

      if (chId === "facebook") {
        const hook = `${host} is spinning "${title}" by ${artist} today.`;
        const airplay = cleanNews
          ? `${cleanNews} Radio airplay across ${countries}.`
          : `Radio airplay across ${countries}. What stood out to you first on this track?`;
        const tags = buildPlatformTags(profile, 5, rng, ["#MusicCommunity", "#RadioAirplay", "#MartinStrayd"]);
        return sanitizeText([
          `${hook}`,
          `${airplay}`,
          `${linksBlock ? safeChosen.join("\n") : `Artist Hub: ${hubOnly}`}`,
          `${tags}`
        ].filter(Boolean).join("\n\n"), true).slice(0, 63206);
      }

      if (chId === "ytTitle") {
        const tagWord = k1 || "Single";
        return fitUnderLimit(sanitizeText(`"${title}" - ${artist} | ${host} (${tagWord})`, true), 100);
      }

      const ytIntro = `${host} presents "${title}" by ${artist} on the daily singles channel.`;
      const details = [
        cleanNews ? `${cleanNews}` : "",
        cleanNote ? `${cleanNote}` : "",
        `Radio airplay across ${countries}.`
      ].filter(Boolean).join(" ");
      const tags = buildPlatformTags(profile, 5, rng, ["#YouTubeMusic", "#DailySingle", "#Songwriting"]);
      return sanitizeText([
        `${ytIntro}`,
        `${details}`,
        `${rightsLine}${linksBlock}`,
        `${tags}`
      ].filter(Boolean).join("\n\n"), true).slice(0, 5000);
    }

    function generateUniquePost(chId, baseCtx) {
      for (let attempt = 0; attempt < 35; attempt++) {
        const rng = makeRng((baseCtx.seed + attempt * 7919) >>> 0);
        const rawText = assembleChannelCopy(chId, { ...baseCtx, rng });
        const capped = capHashtagsByChannel(chId, sanitizeText(rawText, chId !== "press"));
        const key = `${chId}:${hashString(capped)}`;
        if (!SEEN_HASHES.has(key)) {
          SEEN_HASHES.add(key);
          try {
            localStorage.setItem("anna_seen_posts_v21", JSON.stringify(Array.from(SEEN_HASHES).slice(-5000)));
          } catch {}
          return capped;
        }
      }
      const fallbackRng = makeRng((baseCtx.seed + Date.now()) >>> 0);
      return capHashtagsByChannel(chId, sanitizeText(assembleChannelCopy(chId, { ...baseCtx, rng: fallbackRng }), chId !== "press"));
    }

    function slugFilePart(str) {
      return String(str || "anna-audio")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 60) || "anna-audio";
    }

    function buildCleanSpokenScript(text) {
      return sanitizeText(String(text || "")
        .replace(/https?:\/\/\S+/gi, " ")
        .replace(/#[A-Za-z0-9_]+/g, " ")
        .replace(/[:*_=~`<>|]+/g, " "), true)
        .replace(/\s+/g, " ")
        .trim();
    }

    function buildCompactWavBlob(spokenText) {
      const sampleRate = 16000;
      const words = String(spokenText || "DJ Anna live on air").split(/\s+/).filter(Boolean);
      const durationSec = Math.min(20, Math.max(2.0, words.length * 0.24));
      const numSamples = Math.floor(sampleRate * durationSec);
      const dataSize = numSamples * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeStr = (offset, s) => {
        for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
      };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, dataSize, true);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const wordIdx = Math.min(words.length - 1, Math.floor(t / 0.24));
        const wCode = words[wordIdx].charCodeAt(0) || 65;
        const baseFreq = 185 + ((wCode * 13) % 140);
        const phraseEnv = 0.5 + 0.5 * Math.sin(Math.PI * (i / numSamples));
        const pulseEnv = 0.4 + 0.6 * Math.abs(Math.sin(Math.PI * t * 3.5));
        const sample = Math.sin(2 * Math.PI * baseFreq * t) * 0.14 * phraseEnv * pulseEnv;
        view.setInt16(44 + i * 2, Math.max(-32767, Math.min(32767, Math.floor(sample * 32767))), true);
      }
      return new Blob([buffer], { type: "audio/wav" });
    }

    function triggerBlobDownload(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    async function downloadPostAudio(chId, text) {
      const spoken = buildCleanSpokenScript(text);
      if (!spoken) {
        $("statusText").textContent = "No text available to export audio";
        return;
      }
      const songSlug = slugFilePart($("songHeading")?.textContent || "single");
      const baseName = `${songSlug}-${slugFilePart(chId)}`;
      speakForRadio(spoken);
      const wavBlob = buildCompactWavBlob(spoken);
      const kbSize = Math.max(1, Math.round(wavBlob.size / 1024));
      triggerBlobDownload(wavBlob, `${baseName}.wav`);
      $("statusText").textContent = `Downloaded ${baseName}.wav (${kbSize} KB)`;
      recordHistory(chId, "wav_downloaded", text);
    }

    function scoreFemaleVoice(voice) {
      const hay = `${voice.name || ""} ${voice.voiceURI || ""} ${voice.lang || ""}`.toLowerCase();
      let score = /^en[-_]/i.test(voice.lang || "") ? 20 : 0;
      if (/natural|neural|online|premium|enhanced/i.test(hay)) score += 35;
      for (const h of FEMALE_VOICE_HINTS) if (hay.includes(h)) score += 45;
      for (const m of MALE_VOICE_HINTS) if (new RegExp(`\\b${m}\\b`, "i").test(hay)) score -= 120;
      return score;
    }

    function populateVoices() {
      if (!("speechSynthesis" in window)) return;
      const raw = window.speechSynthesis.getVoices() || [];
      if (!raw.length) return;
      const sorted = [...raw].sort((a, b) => scoreFemaleVoice(b) - scoreFemaleVoice(a));
      const nonMale = sorted.filter((v) => scoreFemaleVoice(v) > -50);
      AVAILABLE_VOICES = nonMale.length ? nonMale : sorted;

      const sel = $("voiceSelect");
      const savedName = localStorage.getItem("anna_female_voice_name") || "";
      sel.innerHTML = "";
      AVAILABLE_VOICES.forEach((v, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        const tag = scoreFemaleVoice(v) >= 45 ? "Female" : "Voice";
        opt.textContent = `${tag} - ${v.name} (${v.lang})`;
        sel.appendChild(opt);
      });
      const savedIdx = AVAILABLE_VOICES.findIndex((v) => v.name === savedName);
      sel.value = String(savedIdx >= 0 ? savedIdx : 0);
    }

    function getSelectedVoice() {
      if (!AVAILABLE_VOICES.length) populateVoices();
      const idx = Number($("voiceSelect")?.value || 0);
      return AVAILABLE_VOICES[idx] || AVAILABLE_VOICES[0] || null;
    }

    function cleanTitle(raw) {
      return sanitizeText(String(raw || "")
        .replace(/\{\{TITLE\}\}/gi, "")
        .replace(/\b(?:SINGLE|STRAYD[-_ ]?ID)[-_ ]?\d+\b/gi, "")
        .replace(/^Martin\s+Strayd\s*[-â€“â€”:|]+\s*/i, "")
        .replace(/#FirstIteminCatalogJSONon\b/gi, ""));
    }

    function fitUnderLimit(text, maxLen) {
      const clean = sanitizeText(String(text || "").replace(/\s+/g, " "), true);
      if (clean.length <= maxLen) return clean;
      const cut = clean.slice(0, maxLen - 1);
      const sp = cut.lastIndexOf(" ");
      return (sp > Math.floor(maxLen * 0.65) ? cut.slice(0, sp) : cut).trim();
    }

    function pressDateString() {
      return new Date().toLocaleDateString("en-US", {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });
    }

    function makeFallbackArt(title) {
      const safe = String(title || "Martin Strayd").replace(/[<>&"']/g, "").slice(0, 26);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="#132238"/><rect x="14" y="14" width="372" height="372" fill="none" stroke="#38bdf8" stroke-width="3"/><text x="200" y="165" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="16" font-weight="bold">MARTIN STRAYD</text><text x="200" y="205" text-anchor="middle" fill="#eef3fb" font-family="Arial,sans-serif" font-size="20" font-weight="bold">${safe}</text><text x="200" y="245" text-anchor="middle" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="14">DJ ANNA DAILY RELEASE</text></svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function resolveArtUrl(songObj, title) {
      const candidates = songObj && typeof songObj === "object"
        ? [songObj.artUrl, songObj.art, songObj.artwork, songObj.image, songObj.coverArt]
        : [];
      for (const raw of candidates) {
        const val = String(raw || "").trim();
        if (!val) continue;
        if (/^(https?:\/\/|data:image\/)/i.test(val)) return val;
        if (/^store-art\//i.test(val)) return `https://martinstrayd.github.io/artist/${encodeURI(val)}`;
        return `https://martinstrayd.github.io/artist/store-art/${encodeURIComponent(val.replace(/^(\.\/|strayd\/|store-art\/)+/, ""))}`;
      }
      return makeFallbackArt(title);
    }

    function getSelectedLinks() {
      const hub = ($("hubUrl").value.trim() || BRAIN_STATE.hubUrl);
      const chosen = [];
      if ($("chkHub")?.checked && hub) chosen.push(`Artist Hub: ${hub}`);
      if ($("chkCoffee")?.checked) chosen.push(`Buy Me a Coffee: ${BIBLE_BANK_COFFEE}`);
      if ($("chkPaypal")?.checked) chosen.push(`PayPal: ${BIBLE_BANK_PAYPAL}`);
      if ($("chkWise")?.checked) chosen.push(`Wise: ${BIBLE_BANK_WISE}`);
      return { hub, chosen };
    }

    const BIBLE_BANK_COFFEE = BRAIN_STATE.coffeeUrl;
    const BIBLE_BANK_PAYPAL = BRAIN_STATE.paypalUrl;
    const BIBLE_BANK_WISE = BRAIN_STATE.wiseNote;

    function createCardElement(ch) {
      const card = document.createElement("article");
      card.className = "post-card";
      card.innerHTML = `
        <div class="post-head">
          <div class="head-left">
            <img class="thumb" data-art-thumb alt="" />
            <span>${ch.label}</span>
          </div>
          <span id="count-${ch.id}" class="char-count">0 / ${ch.max}</span>
        </div>
        <textarea id="ta-${ch.id}" readonly></textarea>
        <div class="btn-row">
          <button type="button" data-act="speak" data-ch="${ch.id}">Speak</button>
          <button type="button" data-act="dlAudio" data-ch="${ch.id}">DL Audio</button>
          <button type="button" data-act="edit" data-ch="${ch.id}">Edit</button>
          <button type="button" data-act="save" data-ch="${ch.id}">Save</button>
          <button type="button" data-act="copy" data-ch="${ch.id}">Copy</button>
          <button type="button" data-act="post" data-ch="${ch.id}">Post</button>
        </div>
      `;
      const ta = card.querySelector("textarea");
      ta.addEventListener("input", () => updateCounter(ch.id, ch.max));
      return card;
    }

    function renderCards() {
      const pressContainer = $("pressTop");
      const grid = $("postsGrid");
      pressContainer.innerHTML = "";
      grid.innerHTML = "";
      pressContainer.appendChild(createCardElement(PRESS_CHANNEL));
      SOCIAL_CHANNELS.forEach((ch) => grid.appendChild(createCardElement(ch)));

      const handleAction = (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const act = btn.dataset.act;
        const chId = btn.dataset.ch;
        const ta = $(`ta-${chId}`);
        if (!ta) return;

        if (act === "dlAudio") {
          downloadPostAudio(chId, ta.value);
        } else if (act === "speak") {
          speakForRadio(ta.value);
          recordHistory(chId, "spoken", ta.value);
        } else if (act === "edit") {
          ta.readOnly = false;
          ta.focus();
          $("statusText").textContent = `Editing ${chId}`;
        } else if (act === "save") {
          ta.readOnly = true;
          localStorage.setItem(`anna_post_${chId}`, ta.value);
          recordHistory(chId, "saved", ta.value);
          $("statusText").textContent = `Saved ${chId}`;
        } else if (act === "copy") {
          navigator.clipboard?.writeText(ta.value).catch(() => {});
          recordHistory(chId, "copied", ta.value);
          $("statusText").textContent = `Copied ${chId}`;
        } else if (act === "post") {
          const { hub } = getSelectedLinks();
          if (chId === "x") {
            window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(ta.value.slice(0, 280))}`, "_blank", "noopener");
          } else {
            navigator.clipboard?.writeText(ta.value).catch(() => {});
            window.open(hub, "_blank", "noopener");
          }
          recordHistory(chId, "posted", ta.value);
        }
      };

      pressContainer.addEventListener("click", handleAction);
      grid.addEventListener("click", handleAction);
    }

    function recordHistory(channel, action, text) {
      const title = $("songHeading").textContent || "Martin Strayd Single";
      const key = "anna_strayd_release_history";
      let list = [];
      try { list = JSON.parse(localStorage.getItem(key) || "[]"); } catch { list = []; }
      list.unshift({
        timestamp: new Date().toISOString(),
        date: pressDateString(),
        song: title,
        channel,
        action,
        preview: String(text || "").slice(0, 240)
      });
      localStorage.setItem(key, JSON.stringify(list.slice(0, 500)));
    }

    function exportHistoryJson() {
      const raw = localStorage.getItem("anna_strayd_release_history") || "[]";
      const blob = new Blob([raw], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "strayd-release-history.json";
      a.click();
      URL.revokeObjectURL(url);
      $("statusText").textContent = "Downloaded strayd-release-history.json";
    }

    function syncArtwork(title) {
      const fallback = makeFallbackArt(title);
      const src = CURRENT_ART || fallback;
      const heroImg = $("coverImg");
      heroImg.src = src;
      heroImg.onerror = () => { if (heroImg.src !== fallback) heroImg.src = fallback; };
      document.querySelectorAll("img[data-art-thumb]").forEach((img) => {
        img.alt = `${title} cover art`;
        img.src = src;
        img.onerror = () => { if (img.src !== fallback) img.src = fallback; };
      });
    }

    function updateCounter(chId, max) {
      const ta = $(`ta-${chId}`);
      const cnt = $(`count-${chId}`);
      if (ta && cnt) cnt.textContent = `${ta.value.length} / ${max}`;
    }

    function speakForRadio(text) {
      if (SPEAK_TIMER) {
        clearTimeout(SPEAK_TIMER);
        SPEAK_TIMER = null;
      }
      const spoken = buildCleanSpokenScript(text);
      if (!spoken) {
        $("statusText").textContent = "Nothing to speak";
        return;
      }
      if (!("speechSynthesis" in window)) {
        $("statusText").textContent = "Browser speech synthesis unavailable on this device";
        return;
      }
      populateVoices();
      try { window.speechSynthesis.cancel(); } catch {}

      const sentences = spoken.match(/[^.!?]+[.!?]?/g) || [spoken];
      const chunks = sentences.map((s) => s.trim()).filter(Boolean).slice(0, 8);
      const chosenVoice = getSelectedVoice();

      let spokeAny = false;
      chunks.forEach((part, index) => {
        try {
          const utter = new SpeechSynthesisUtterance(part);
          if (chosenVoice) utter.voice = chosenVoice;
          utter.rate = 0.98;
          utter.pitch = 1.04;
          if (index === chunks.length - 1) {
            utter.onend = () => { $("statusText").textContent = "Finished speaking"; };
          }
          window.speechSynthesis.speak(utter);
          spokeAny = true;
        } catch {}
      });

      if (spokeAny) {
        $("statusText").textContent = `Speaking (${chosenVoice ? chosenVoice.name : "Default Voice"})...`;
        SPEAK_TIMER = setTimeout(() => {
          if (window.speechSynthesis && !window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
            $("statusText").textContent = "Tip: Check system sound output or pick another voice in dropdown";
          }
        }, 900);
      } else {
        $("statusText").textContent = "Voice playback blocked by browser";
      }
    }

    function buildPostsFromInput(advanceRefresh = false) {
      if (advanceRefresh) GEN_NONCE += 1;

      const idx = Number($("songSelect").value || 0);
      const songObj = CATALOG_SONGS[idx] || CATALOG_SONGS[0] || {};
      const title = cleanTitle($("customTitle").value) || cleanTitle(songObj.title || songObj.name || songObj.track || "") || "Adhd I Can Do That (Travillen Disorder)";
      const artist = cleanTitle(songObj.artist) || "Martin Strayd";
      const note = sanitizeText($("noteInput").value);
      const news = sanitizeText($("newsInput").value);
      const countries = sanitizeText($("countriesInput").value) || "Australia, Philippines, Ecuador, United States, Chile, Canada, Indonesia, France, and Thailand";
      const dateStr = pressDateString();
      const { chosen } = getSelectedLinks();

      const seedNum = (parseInt(hashString(`${title.toLowerCase()}|${idx}|${GEN_NONCE}`), 36) || 104729) >>> 0;
      const rng = makeRng(seedNum);
      const host = rng() > 0.45 ? "DJ ANNA" : "Veg Anna";
      const profile = analyzeSongTitle(title);
      const linksBlock = chosen.length ? `\n\n${chosen.join("\n")}` : "";
      const shortLink = chosen.length ? ` ${chosen[0].replace(/^[^:]+:\s*/, "")}` : "";

      CURRENT_ART = resolveArtUrl(songObj, title);
      $("songHeading").textContent = title;
      $("djMeta").textContent = `${host} - ${artist} (${BRAIN_STATE.loadedFiles} repo files, ${CATALOG_SONGS.length} tracks)`;
      syncArtwork(title);

      const ctx = {
        title, artist, host, profile,
        note, news, countries, dateStr, chosenLinks: chosen, linksBlock, shortLink,
        seed: seedNum
      };

      ALL_CHANNELS.forEach((ch) => {
        const ta = $(`ta-${ch.id}`);
        if (ta) {
          ta.value = generateUniquePost(ch.id, ctx);
          updateCounter(ch.id, ch.max);
        }
      });

      $("statusText").textContent = `${host} - "${title}" (${CATALOG_SONGS.length} tracks, set #${GEN_NONCE % 10000})`;
    }

    async function loadCatalog() {
      $("statusText").textContent = "Loading songs-db.json & core-catalog.json...";
      BRAIN_STATE.loadedFiles = 0;

      try {
        const brainRaw = await readRepoFile("record-brain.json");
        if (brainRaw) {
          const brain = JSON.parse(brainRaw);
          BRAIN_STATE.loadedFiles += 1;
          if (brain.salesPortal) BRAIN_STATE.hubUrl = brain.salesPortal;
          if (brain.paymentRails?.buyMeACoffee) BRAIN_STATE.coffeeUrl = brain.paymentRails.buyMeACoffee;
          if (brain.paymentRails?.directMp3AndArt) BRAIN_STATE.paypalUrl = brain.paymentRails.directMp3AndArt;
          if (brain.paymentRails?.wise) BRAIN_STATE.wiseNote = brain.paymentRails.wise;
          if ($("hubUrl") && !localStorage.getItem("anna_custom_hub")) {
            $("hubUrl").value = BRAIN_STATE.hubUrl;
          }
        }
      } catch {}

      const select = $("songSelect");
      select.innerHTML = "";
      const byTitle = new Map();

      for (const fileName of ["songs-db.json", "core-catalog.json", "strayd-artist-live.json"]) {
        try {
          const rawTxt = await readRepoFile(fileName);
          if (!rawTxt) continue;
          const data = JSON.parse(rawTxt);
          BRAIN_STATE.loadedFiles += 1;
          const list = Array.isArray(data) ? data : (data.songs || data.tracks || data.items || []);
          list.forEach((item) => {
            const tClean = cleanTitle(item.title || item.name || item.track || "");
            if (!tClean) return;
            const key = tClean.toLowerCase();
            const prev = byTitle.get(key) || {};
            byTitle.set(key, {
              ...prev,
              ...item,
              title: tClean,
              artist: cleanTitle(item.artist || prev.artist || data.artist || "Martin Strayd"),
              artUrl: item.artUrl || prev.artUrl || "",
              art: item.art || prev.art || ""
            });
          });
        } catch {}
      }

      CATALOG_SONGS = Array.from(byTitle.values());
      if (!CATALOG_SONGS.length) {
        CATALOG_SONGS = [{
          title: "Adhd I Can Do That (Travillen Disorder)",
          artist: "Martin Strayd",
          art: "store-art/Martin Strayd - Adhd I Can Do That (Travillen Disorder).png"
        }];
      }

      CATALOG_SONGS.forEach((t, idx) => {
        const opt = document.createElement("option");
        opt.value = String(idx);
        opt.textContent = `${String(idx + 1).padStart(3, "0")} - ${t.title}`;
        select.appendChild(opt);
      });

      buildPostsFromInput(false);
    }

    if ("speechSynthesis" in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    const savedPat = localStorage.getItem("anna_gh_pat") || "";
    if (savedPat && $("ghPatInput")) $("ghPatInput").value = savedPat;

    renderCards();
    $("voiceSelect").addEventListener("change", () => {
      const v = getSelectedVoice();
      if (v) localStorage.setItem("anna_female_voice_name", v.name);
      $("statusText").textContent = `Selected voice: ${v ? v.name : "Default"}`;
    });
    $("reloadCatalogBtn").addEventListener("click", async () => {
      await loadCatalog();
      buildPostsFromInput(true);
    });
    $("ghPatInput").addEventListener("change", async () => {
      await loadCatalog();
      buildPostsFromInput(true);
    });
    $("hubUrl").addEventListener("change", () => {
      localStorage.setItem("anna_custom_hub", $("hubUrl").value.trim());
      buildPostsFromInput(false);
    });
    $("testVoiceBtn").addEventListener("click", () => {
      const t = $("songHeading").textContent || "today's single";
      speakForRadio(`Hey fam! DJ ANNA is back on air with fresh music from Martin Strayd, featuring ${t}. Love, share, and follow!`);
    });
    $("makePostsBtn").addEventListener("click", () => buildPostsFromInput(true));
    $("songSelect").addEventListener("change", () => { GEN_NONCE += 1; buildPostsFromInput(false); });
    $("customTitle").addEventListener("input", () => buildPostsFromInput(false));
    $("noteInput").addEventListener("input", () => buildPostsFromInput(false));
    $("newsInput").addEventListener("input", () => buildPostsFromInput(false));
    $("countriesInput").addEventListener("input", () => buildPostsFromInput(false));
    ["chkHub", "chkCoffee", "chkPaypal", "chkWise"].forEach((id) => {
      $(id)?.addEventListener("change", () => buildPostsFromInput(false));
    });
    $("exportHistoryBtn").addEventListener("click", exportHistoryJson);
    $("stopSpeakBtn").addEventListener("click", () => {
      if (SPEAK_TIMER) clearTimeout(SPEAK_TIMER);
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      $("statusText").textContent = "Voice stopped";
    });
    loadCatalog();
  </script>
</body>
</html>
