<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ ANNA • Daily Single Press & Social Studio</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-2: #192232;
      --text: #eef3fb;
      --muted: #9fb0c8;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 1140px;
      margin: 0 auto;
      padding: 20px;
    }
    .hero {
      display: grid;
      grid-template-columns: 205px 1fr;
      gap: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      align-items: start;
    }
    @media (max-width: 720px) {
      .hero { grid-template-columns: 1fr; }
    }
    .art-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .art-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .song-title {
      margin: 0 0 6px;
      font-size: 1.65rem;
      line-height: 1.2;
    }
    .meta-line {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    select, input, textarea {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
      font-family: inherit;
    }
    textarea {
      min-height: 155px;
      resize: vertical;
    }
    .link-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.84rem;
    }
    .link-toggles label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--text);
      cursor: pointer;
    }
    .link-toggles input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.84rem;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: var(--accent);
      color: #061018;
      font-weight: 600;
      border: none;
    }
    .status-pill {
      font-size: 0.8rem;
      color: var(--accent);
      padding-left: 6px;
    }
    .press-top {
      margin-bottom: 16px;
    }
    .press-top textarea {
      min-height: 360px;
      line-height: 1.58;
    }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 14px;
    }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .head-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex: 0 0 auto;
    }
    .char-count {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 400;
      white-space: nowrap;
    }
    .btn-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
    }
    .btn-row button {
      flex: 0 0 auto;
      padding: 6px 10px;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="art-box">
        <img id="coverImg" alt="Song cover art" />
      </div>
      <div>
        <h1 id="songHeading" class="song-title">Loading song database...</h1>
        <div id="djMeta" class="meta-line">DJ ANNA • Martin Strayd Daily Single Radio Launch</div>
        <div class="controls-grid">
          <div>
            <label for="songSelect">1. Pick Song from Catalog</label>
            <select id="songSelect"></select>
          </div>
          <div>
            <label for="voiceSelect">DJ ANNA / Veg Anna Female Voice</label>
            <select id="voiceSelect"></select>
          </div>
          <div>
            <label for="customTitle">Custom Song Title (Optional)</label>
            <input id="customTitle" type="text" placeholder="Type a song title..." />
          </div>
          <div>
            <label for="hubUrl">Sales Portal / Artist Hub</label>
            <input id="hubUrl" type="text" value="https://martinstrayd.github.io/artist/" />
          </div>
          <div>
            <label for="noteInput">Story / Mood / Hook Note (Optional)</label>
            <input id="noteInput" type="text" placeholder="Add a song angle, hook, or story..." />
          </div>
          <div>
            <label for="countriesInput">Radio Airplay Countries (Press Release)</label>
            <input id="countriesInput" type="text" value="Australia, the Philippines, Ecuador, the United States, Chile, Canada, Indonesia, France, and Thailand" />
          </div>
        </div>

        <div class="link-toggles" aria-label="Optional links to append">
          <label><input type="checkbox" id="chkHub" checked /> Artist Hub</label>
          <label><input type="checkbox" id="chkCoffee" /> Buy Me a Coffee</label>
          <label><input type="checkbox" id="chkPaypal" /> PayPal</label>
          <label><input type="checkbox" id="chkWise" /> Wise (200 THB)</label>
        </div>

        <div class="hero-actions">
          <button id="makePostsBtn" class="primary" type="button">Make / Refresh Posts</button>
          <button id="testVoiceBtn" type="button">Test Anna Voice</button>
          <button id="stopSpeakBtn" type="button">Stop Voice</button>
          <button id="exportHistoryBtn" type="button">Save History JSON</button>
          <span id="statusText" class="status-pill">Loading bible & song database...</span>
        </div>
      </div>
    </section>

    <section id="pressTop" class="press-top"></section>
    <section id="postsGrid" class="posts-grid"></section>
  </div>

  <script>
    const PRESS_CHANNEL = { id: "press", label: "Official Press Release (Dated • Full Bio)", max: 12000 };

    const SOCIAL_CHANNELS = [
      { id: "x", label: "X", max: 280 },
      { id: "tiktok", label: "TikTok", max: 2200 },
      { id: "instagram", label: "Instagram", max: 2200 },
      { id: "facebook", label: "Facebook", max: 63206 },
      { id: "ytTitle", label: "YouTube Title", max: 100 },
      { id: "ytDesc", label: "YouTube Description", max: 5000 }
    ];

    const ALL_CHANNELS = [PRESS_CHANNEL, ...SOCIAL_CHANNELS];

    const BIBLE_STATE = {
      loadedFiles: [],
      hubUrl: "https://martinstrayd.github.io/artist/",
      coffeeUrl: "https://buymeacoffee.com/martinstrayd",
      paypalUrl: "https://www.paypal.com/paypalme/martinstrayd",
      wiseUrl: "https://wise.com/pay/r/xGmJi9kSdap4lKo"
    };

    const RADIO_ANGLES = [
      {
        tag: "Prime-Time Broadcast",
        host: "DJ ANNA",
        callSign: "Live on the daily frequency, this is DJ ANNA",
        xHook: (t, a) => `Why can't anyone stop replaying "${t}" by ${a}? DJ ANNA just put today's single on heavy rotation—`,
        ttHook: (t, a) => `Stop scrolling—"${t}" by ${a} just hit the airwaves and it's pure replay fuel.\n\nDJ ANNA here on the daily single launch: 10 albums' worth of raw songwriting, one new single every single day. Hear why "${t}" hits different from the first bar, then grab the MP3 + cover art bundle to own and share freely with friends.`,
        igHook: (t, a) => `Some songs don't ask for permission—they take over the room on the first chord.\n\nDJ ANNA spinning "${t}" by ${a} on today's daily single launch. Four decades of songwriting craft distilled into a track built for midnight drives and repeat plays.\n\nOwn the MP3 + cover art bundle outright and pass it along freely to friends for non-commercial enjoyment.`,
        fbHook: (t, a) => `DJ ANNA on air with today's daily single drop: "${t}" by ${a}.\n\nWhen a songwriter brings 40+ years of real-world stories and zero industry filter, you hear it in every line. Crank "${t}" up, tell us the lyric or hook that hits you hardest, and grab the MP3 + cover art bundle to own and share freely with friends.`,
        ytTag: "Daily Single Radio Premiere"
      },
      {
        tag: "Late-Night Confessional",
        host: "Veg Anna",
        callSign: "Veg Anna in the booth on the 365 daily single run",
        xHook: (t, a) => `The hook in "${t}" (${a}) is dangerously addictive. Veg Anna has it spinning now—`,
        ttHook: (t, a) => `Nobody warns you how fast "${t}" by ${a} gets stuck in your head.\n\nVeg Anna here on the 365-day single rollout. While everybody else drops one track a year, Martin Strayd is unleashing an entire vault—one daily single at a time. Grab the MP3 + cover art bundle and send it to a friend who gets real music.`,
        igHook: (t, a) => `Late-night radio confession: "${t}" by ${a} is the track you play once and immediately hit repeat.\n\nVeg Anna here with today's daily single drop. No label gatekeepers, no waiting—just direct music you can own as an MP3 + cover art bundle and share freely with friends.`,
        fbHook: (t, a) => `Veg Anna checking in from the studio booth with "${t}" by ${a}.\n\nDry wit, razor-sharp hooks, and zero filler—this is why our daily single party never slows down. Listen to "${t}", drop your take in the comments, and pick up the MP3 + cover art bundle to own and share with friends.`,
        ytTag: "Veg Anna Radio Spotlight"
      },
      {
        tag: "Global Crate Dig",
        host: "DJ ANNA",
        callSign: "Across the global airwaves, you're locked in with DJ ANNA",
        xHook: (t, a) => `365 days. One new single every day. "${t}" by ${a} is live with DJ ANNA—`,
        ttHook: (t, a) => `Imagine having 10 albums of unreleased firepower and dropping a fresh single every single day.\n\nDJ ANNA on the mic with "${t}" by ${a}. Turn this up, share it with your crew, and own the MP3 + cover art bundle with full non-commercial friend-sharing rights.`,
        igHook: (t, a) => `From international radio rotation straight to your headphones: "${t}" by ${a}.\n\nDJ ANNA presenting today's daily single release. Own the MP3 + cover art bundle outright and share it freely with friends for non-commercial enjoyment.`,
        fbHook: (t, a) => `DJ ANNA spinning "${t}" by ${a} across our 24/7 daily single launch!\n\nEvery day brings a new chapter from Martin Strayd's 10-album vault. Stream "${t}", share the link with music lovers who crave authenticity, and grab your MP3 + cover art bundle today.`,
        ytTag: "365 Daily Singles"
      }
    ];

    const FEMALE_VOICE_HINTS = [
      "aria", "jenny", "sonia", "libby", "maisie", "natasha", "clara", "ava",
      "samantha", "victoria", "allison", "zoe", "karen", "moira", "tessa",
      "zira", "hazel", "susan", "fiona", "veena", "female", "woman", "girl"
    ];

    const MALE_VOICE_HINTS = [
      "guy", "ryan", "christopher", "eric", "davis", "andrew", "brian",
      "steffan", "david", "mark", "george", "daniel", "arthur", "oliver",
      "male", "man", "boy"
    ];

    let CATALOG_SONGS = [];
    let CURRENT_ART = "";
    let ANGLE_CURSOR = 0;
    let AVAILABLE_VOICES = [];

    const $ = (id) => document.getElementById(id);

    function scoreFemaleVoice(voice) {
      const hay = `${voice.name || ""} ${voice.voiceURI || ""} ${voice.lang || ""}`.toLowerCase();
      let score = 0;
      if (/^en[-_]/i.test(voice.lang || "")) score += 20;
      if (/natural|neural|online|premium|enhanced/i.test(hay)) score += 35;
      for (const h of FEMALE_VOICE_HINTS) {
        if (hay.includes(h)) score += 45;
      }
      for (const m of MALE_VOICE_HINTS) {
        if (new RegExp(`\\b${m}\\b`, "i").test(hay)) score -= 120;
      }
      return score;
    }

    function populateVoices() {
      if (!("speechSynthesis" in window)) return;
      const raw = window.speechSynthesis.getVoices() || [];
      if (!raw.length) return;

      const sorted = [...raw].sort((a, b) => scoreFemaleVoice(b) - scoreFemaleVoice(a));
      const nonMale = sorted.filter((v) => scoreFemaleVoice(v) > -50);
      AVAILABLE_VOICES = nonMale.length ? nonMale : sorted;

      const sel = $("voiceSelect");
      const savedName = localStorage.getItem("anna_female_voice_name") || "";
      sel.innerHTML = "";

      AVAILABLE_VOICES.forEach((v, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        const tag = scoreFemaleVoice(v) >= 45 ? "★ Female" : "Voice";
        opt.textContent = `${tag} • ${v.name} (${v.lang})`;
        sel.appendChild(opt);
      });

      const savedIdx = AVAILABLE_VOICES.findIndex((v) => v.name === savedName);
      sel.value = String(savedIdx >= 0 ? savedIdx : 0);
    }

    function getSelectedVoice() {
      if (!AVAILABLE_VOICES.length) populateVoices();
      const idx = Number($("voiceSelect")?.value || 0);
      return AVAILABLE_VOICES[idx] || AVAILABLE_VOICES[0] || null;
    }

    function cleanTitle(raw) {
      return String(raw || "")
        .replace(/\{\{TITLE\}\}/gi, "")
        .replace(/\b(?:SINGLE|STRAYD[-_ ]?ID)[-_ ]?\d+\b/gi, "")
        .replace(/^Martin\s+Strayd\s*[-–—:|]+\s*/i, "")
        .replace(/#FirstIteminCatalogJSONon\b/gi, "")
        .replace(/\s*\(\s*\)\s*/g, " ")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function pressDateString() {
      return new Date().toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function makeFallbackArt(title) {
      const safe = (title || "Martin Strayd Single").replace(/[<>&"]/g, "");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#132238"/>
            <stop offset="100%" stop-color="#0b101b"/>
          </linearGradient>
        </defs>
        <rect width="600" height="600" fill="url(#g)"/>
        <circle cx="300" cy="235" r="105" fill="#38bdf8" fill-opacity="0.18"/>
        <text x="300" y="255" text-anchor="middle" fill="#eef3fb" font-family="system-ui,sans-serif" font-size="30" font-weight="700">${safe.slice(0, 26)}</text>
        <text x="300" y="305" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="18" font-weight="600">DJ ANNA • DAILY SINGLE</text>
        <text x="300" y="340" text-anchor="middle" fill="#9fb0c8" font-family="system-ui,sans-serif" font-size="16">Martin Strayd</text>
      </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function resolveArtUrl(songOrRaw, title) {
      const candidates = typeof songOrRaw === "object" && songOrRaw !== null
        ? [songOrRaw.artUrl, songOrRaw.art, songOrRaw.artwork, songOrRaw.image, songOrRaw.coverArt]
        : [songOrRaw];

      for (const raw of candidates) {
        const val = String(raw || "").trim();
        if (!val) continue;
        if (/^(https?:\/\/|data:image\/)/i.test(val)) return val;
        if (/^store-art\//i.test(val)) {
          return `https://martinstrayd.github.io/artist/${encodeURI(val)}`;
        }
        const cleaned = val.replace(/^(\.\/|\.\.\/)+/, "");
        return `../${encodeURI(cleaned)}`;
      }
      return makeFallbackArt(title);
    }

    async function loadBibleRules() {
      const files = [
        "../bible/00-bible-index.md",
        "../bible/02-links.md",
        "../bible/03-master-pages.md",
        "../bible/04-voice-and-broadcast-law.md",
        "../bible/05-mission-manifesto.md",
        "../bible/06-dj-anna-persona.md"
      ];
      for (const path of files) {
        try {
          const r = await fetch(path, { cache: "no-store" });
          if (!r.ok) continue;
          const txt = await r.text();
          BIBLE_STATE.loadedFiles.push(path.replace("../", ""));
          const hubMatch = txt.match(/https:\/\/martinstrayd\.github\.io\/artist\/[^\s)]*/i);
          if (hubMatch) BIBLE_STATE.hubUrl = hubMatch[0];
          const coffeeMatch = txt.match(/https:\/\/buymeacoffee\.com\/martinstrayd[^\s)]*/i);
          if (coffeeMatch) BIBLE_STATE.coffeeUrl = coffeeMatch[0];
          const ppMatch = txt.match(/https:\/\/www\.paypal\.com\/paypalme\/martinstrayd[^\s)]*/i);
          if (ppMatch) BIBLE_STATE.paypalUrl = ppMatch[0];
          const wiseMatch = txt.match(/https:\/\/wise\.com\/pay\/r\/[^\s)]*/i);
          if (wiseMatch) BIBLE_STATE.wiseUrl = wiseMatch[0];
        } catch {}
      }
      if (!$("hubUrl").value.trim()) {
        $("hubUrl").value = BIBLE_STATE.hubUrl;
      }
    }

    function getSelectedLinks() {
      const hub = $("hubUrl").value.trim() || BIBLE_STATE.hubUrl;
      const chosen = [];
      if ($("chkHub")?.checked && hub) chosen.push(`Official Store & Artist Hub: ${hub}`);
      if ($("chkCoffee")?.checked) chosen.push(`Buy Me a Coffee: ${BIBLE_STATE.coffeeUrl}`);
      if ($("chkPaypal")?.checked) chosen.push(`PayPal: ${BIBLE_STATE.paypalUrl}`);
      if ($("chkWise")?.checked) chosen.push(`Wise (200 THB): ${BIBLE_STATE.wiseUrl}`);
      return { hub, chosen };
    }

    function createCardElement(ch) {
      const card = document.createElement("article");
      card.className = "post-card";
      card.innerHTML = `
        <div class="post-head">
          <div class="head-left">
            <img class="thumb" data-art-thumb alt="" />
            <span>${ch.label}</span>
          </div>
          <span id="count-${ch.id}" class="char-count">0 / ${ch.max}</span>
        </div>
        <textarea id="ta-${ch.id}" readonly></textarea>
        <div class="btn-row">
          <button type="button" data-act="speak" data-ch="${ch.id}">Speak</button>
          <button type="button" data-act="edit" data-ch="${ch.id}">Edit</button>
          <button type="button" data-act="save" data-ch="${ch.id}">Save</button>
          <button type="button" data-act="copy" data-ch="${ch.id}">Copy</button>
          <button type="button" data-act="post" data-ch="${ch.id}">Post</button>
        </div>
      `;
      const ta = card.querySelector("textarea");
      ta.addEventListener("input", () => updateCounter(ch.id, ch.max));
      return card;
    }

    function renderCards() {
      const pressContainer = $("pressTop");
      const grid = $("postsGrid");
      pressContainer.innerHTML = "";
      grid.innerHTML = "";

      pressContainer.appendChild(createCardElement(PRESS_CHANNEL));
      SOCIAL_CHANNELS.forEach((ch) => grid.appendChild(createCardElement(ch)));

      const handleAction = (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const act = btn.dataset.act;
        const chId = btn.dataset.ch;
        const ta = $(`ta-${chId}`);
        if (!ta) return;

        if (act === "speak") {
          speakForRadio(ta.value);
          recordHistory(chId, "spoken", ta.value);
        } else if (act === "edit") {
          ta.readOnly = false;
          ta.focus();
          $("statusText").textContent = `Editing ${chId}`;
        } else if (act === "save") {
          ta.readOnly = true;
          localStorage.setItem(`anna_post_${chId}`, ta.value);
          recordHistory(chId, "saved", ta.value);
          $("statusText").textContent = `Saved ${chId}`;
        } else if (act === "copy") {
          navigator.clipboard?.writeText(ta.value).catch(() => {});
          recordHistory(chId, "copied", ta.value);
          $("statusText").textContent = `Copied ${chId}`;
        } else if (act === "post") {
          openShareTarget(chId, ta.value);
          recordHistory(chId, "posted", ta.value);
        }
      };

      pressContainer.addEventListener("click", handleAction);
      grid.addEventListener("click", handleAction);
    }

    function recordHistory(channel, action, text) {
      const title = $("songHeading").textContent || "Featured Single";
      const key = "anna_strayd_release_history";
      let list = [];
      try { list = JSON.parse(localStorage.getItem(key) || "[]"); } catch { list = []; }
      list.unshift({
        timestamp: new Date().toISOString(),
        date: pressDateString(),
        song: title,
        channel,
        action,
        preview: String(text || "").slice(0, 240)
      });
      localStorage.setItem(key, JSON.stringify(list.slice(0, 500)));
    }

    function exportHistoryJson() {
      const key = "anna_strayd_release_history";
      const raw = localStorage.getItem(key) || "[]";
      const blob = new Blob([raw], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "strayd-release-history.json";
      a.click();
      URL.revokeObjectURL(url);
      $("statusText").textContent = "Downloaded strayd-release-history.json";
    }

    function syncArtwork(title) {
      const fallback = makeFallbackArt(title);
      const src = CURRENT_ART || fallback;
      const heroImg = $("coverImg");
      heroImg.src = src;
      heroImg.onerror = () => {
        if (heroImg.src !== fallback) heroImg.src = fallback;
      };
      document.querySelectorAll("img[data-art-thumb]").forEach((img) => {
        img.alt = `${title} cover art`;
        img.src = src;
        img.onerror = () => {
          if (img.src !== fallback) img.src = fallback;
        };
      });
    }

    function updateCounter(chId, max) {
      const ta = $(`ta-${chId}`);
      const cnt = $(`count-${chId}`);
      if (ta && cnt) {
        cnt.textContent = `${ta.value.length} / ${max}`;
      }
    }

    function speakForRadio(text) {
      if (!("speechSynthesis" in window)) return;
      populateVoices();
      window.speechSynthesis.cancel();
      const spoken = String(text || "")
        .replace(/https?:\/\/\S+/gi, " ")
        .replace(/#[A-Za-z0-9_]+/g, " ")
        .replace(/[:*_=~`<>|]+/g, " ")
        .replace(/\s{2,}/g, " ")
        .trim();
      if (!spoken) return;

      const utter = new SpeechSynthesisUtterance(spoken);
      const chosenVoice = getSelectedVoice();
      if (chosenVoice) utter.voice = chosenVoice;
      utter.rate = 0.98;
      utter.pitch = 1.04;
      window.speechSynthesis.speak(utter);
      const label = chosenVoice ? chosenVoice.name : "Female Radio Voice";
      $("statusText").textContent = `On Air (${label})...`;
    }

    function openShareTarget(chId, text) {
      const { hub } = getSelectedLinks();
      if (chId === "x") {
        window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(text.slice(0, 280))}`, "_blank", "noopener");
      } else {
        navigator.clipboard?.writeText(text).catch(() => {});
        window.open(hub, "_blank", "noopener");
      }
      $("statusText").textContent = `Prepared ${chId}`;
    }

    function buildPostsFromInput(advanceAngle = false) {
      if (advanceAngle) {
        ANGLE_CURSOR = (ANGLE_CURSOR + 1) % RADIO_ANGLES.length;
      }
      const angleObj = RADIO_ANGLES[ANGLE_CURSOR];

      const idx = Number($("songSelect").value || 0);
      const songObj = CATALOG_SONGS[idx] || {};
      const chosenOptionTitle = cleanTitle(songObj.title || songObj.name || songObj.track || "");
      const title = cleanTitle($("customTitle").value) || chosenOptionTitle || "Featured Single";
      const artist = cleanTitle(songObj.artist) || "Martin Strayd";
      const note = cleanTitle($("noteInput").value);
      const countries = $("countriesInput").value.trim() || "Australia, the Philippines, Ecuador, the United States, Chile, Canada, Indonesia, France, and Thailand";
      const dateStr = pressDateString();
      const { chosen } = getSelectedLinks();

      CURRENT_ART = resolveArtUrl(songObj, title);
      $("songHeading").textContent = title;
      $("djMeta").textContent = `${angleObj.host} • ${artist} (${angleObj.tag} • ${CATALOG_SONGS.length || 1} songs in DB)`;
      syncArtwork(title);

      const extraNote = note ? `\n\n${note}` : "";
      const inlineNote = note ? ` ${note}` : "";
      const linkBlock = chosen.length ? `\n\n${chosen.join("\n")}` : "";
      const shortLink = chosen.length ? ` ${chosen[0].replace(/^[^:]+:\s*/, "")}` : "";

      const pressRelease = [
        `FOR IMMEDIATE RELEASE — ${dateStr}`,
        `GLOBAL RADIO & STREAMING LAUNCH: "${title}" BY MARTIN STRAYD`,
        `Presented on Air by ${angleObj.host}`,
        ``,
        `INTERNATIONAL BROADCAST DESK — ${angleObj.callSign}, introducing "${title}," the newest daily single release from Australian lyricist, songwriter, and recording artist Martin Strayd.${extraNote}`,
        ``,
        `Drawing from a deep vault spanning more than 10 albums' worth of licensed material (over 100 original tracks), "${title}" continues Martin Strayd's 365-day single-a-day launch across global streaming services—including Spotify, Apple Music, iTunes, YouTube Music, and Shazam—alongside international radio rotation across ${countries}.`,
        ``,
        `ABOUT MARTIN STRAYD`,
        `With 55 years of life experience and four decades of songwriting behind him, Australian artist Martin Strayd brings lived-in rock authenticity and cinematic storytelling to every release. Prior to launching his independent solo catalog, Strayd worked extensively behind the scenes in Hollywood as a 1990s celebrity guitar technician for rock icons including Steve Jones of the Sex Pistols and Doug Fieger of The Knack, and is a featured artist on ABC Triple J Unearthed. Channeling decades of studio craft, live grit, and unvarnished wit, Strayd delivers a new licensed single every single day of the year.`,
        ``,
        `LISTENER OWNERSHIP & SHARING RIGHTS`,
        `In addition to global streaming and radio play, listeners can acquire the official "${title}" MP3 + cover art bundle directly—giving fans permanent personal ownership and the freedom to share copies with friends for non-commercial enjoyment.${linkBlock}`
      ].join("\n");

      const values = {
        press: pressRelease,
        x: `${angleObj.xHook(title, artist)}${inlineNote}${shortLink} #MartinStrayd #DJAnna`.trim().slice(0, 280),
        tiktok: `${angleObj.ttHook(title, artist)}${extraNote}${linkBlock}\n\n#MartinStrayd #DJAnna #VegAnna #DailySingle #IndieMusic #NewMusic`.trim().slice(0, 2200),
        instagram: `${angleObj.igHook(title, artist)}${extraNote}${linkBlock}\n\n#MartinStrayd #DJAnna #VegAnna #DailySingle #Songwriting #IndieMusic #NewRelease`.trim().slice(0, 2200),
        facebook: `${angleObj.fbHook(title, artist)}${extraNote}${linkBlock}\n\n#MartinStrayd #DJAnna #VegAnna #DailySingle #IndieMusic`.trim().slice(0, 63206),
        ytTitle: `"${title}" — ${artist} | ${angleObj.ytTag} w/ ${angleObj.host} #MartinStrayd`.slice(0, 100),
        ytDesc: `${angleObj.igHook(title, artist)}${extraNote}\n\nPresented by ${angleObj.host} for Martin Strayd's 365-day single-a-day launch across Spotify, Apple Music / iTunes, YouTube Music, and international radio. Own the MP3 + cover art bundle outright and share freely with friends for non-commercial enjoyment.${linkBlock}\n\n#MartinStrayd #DJAnna #VegAnna #DailySingle #Songwriting #IndieMusic`.trim().slice(0, 5000)
      };

      ALL_CHANNELS.forEach((ch) => {
        const ta = $(`ta-${ch.id}`);
        if (ta) {
          ta.value = values[ch.id] || "";
          updateCounter(ch.id, ch.max);
        }
      });

      $("statusText").textContent = `Built (${angleObj.host} • ${angleObj.tag}) for "${title}"`;
    }

    async function loadCatalog() {
      await loadBibleRules();
      const select = $("songSelect");
      select.innerHTML = "";

      const sources = [
        "songs-db.json",
        "core-catalog.json",
        "../strayd/songs-db.json",
        "../strayd/core-catalog.json"
      ];

      const byTitle = new Map();
      for (const url of sources) {
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) continue;
          const data = await r.json();
          const list = Array.isArray(data) ? data : (data.songs || data.tracks || data.items || []);
          list.forEach((item) => {
            const tClean = cleanTitle(item.title || item.name || item.track || "");
            if (!tClean) return;
            const key = tClean.toLowerCase();
            const prev = byTitle.get(key) || {};
            byTitle.set(key, {
              ...prev,
              ...item,
              title: tClean,
              artUrl: item.artUrl || prev.artUrl || "",
              art: item.art || prev.art || ""
            });
          });
        } catch {}
      }

      CATALOG_SONGS = Array.from(byTitle.values());
      try {
        const savedMap = JSON.parse(localStorage.getItem("anna_studio_allowed_tracks_v1") || "null");
        if (savedMap && typeof savedMap === "object") {
          const allowedOnly = CATALOG_SONGS.filter((t) => savedMap[t.title.toLowerCase()] === true);
          if (allowedOnly.length) CATALOG_SONGS = allowedOnly;
        } else {
          const autoMasters = CATALOG_SONGS.filter((t) => !/\bdemo\b|\bunfinished\b|\brough mix\b|\bscratch\b/i.test(`${t.title || ""} ${t.promoStatus || ""} ${t.sourceType || ""}`));
          if (autoMasters.length) CATALOG_SONGS = autoMasters;
        }
      } catch {}
      if (!CATALOG_SONGS.length) {
        CATALOG_SONGS = [{ title: "Featured Single", artist: "Martin Strayd" }];
      }

      CATALOG_SONGS.forEach((t, idx) => {
        const opt = document.createElement("option");
        opt.value = String(idx);
        opt.textContent = `${String(idx + 1).padStart(3, "0")} • ${t.title}`;
        select.appendChild(opt);
      });

      buildPostsFromInput(false);
    }

    if ("speechSynthesis" in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    renderCards();
    $("voiceSelect").addEventListener("change", () => {
      const v = getSelectedVoice();
      if (v) localStorage.setItem("anna_female_voice_name", v.name);
      $("statusText").textContent = `Selected voice: ${v ? v.name : "Default"}`;
    });
    $("testVoiceBtn").addEventListener("click", () => {
      const t = $("songHeading").textContent || "today's single";
      speakForRadio(`Live on the daily frequency, this is DJ ANNA with Martin Strayd's daily single, ${t}.`);
    });
    $("makePostsBtn").addEventListener("click", () => buildPostsFromInput(true));
    $("songSelect").addEventListener("change", () => buildPostsFromInput(false));
    $("countriesInput").addEventListener("input", () => buildPostsFromInput(false));
    ["chkHub", "chkCoffee", "chkPaypal", "chkWise"].forEach((id) => {
      $(id)?.addEventListener("change", () => buildPostsFromInput(false));
    });
    $("exportHistoryBtn").addEventListener("click", exportHistoryJson);
    $("stopSpeakBtn").addEventListener("click", () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      $("statusText").textContent = "Voice stopped";
    });
    loadCatalog();
  </script>
</body>
</html>
