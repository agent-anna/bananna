<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Social - Agent Anna</title><style>
:root{--bg:#0b0f17;--card:#131a26;--card2:#192232;--tx:#eef3fb;--mu:#9fb0c8;--ac:#38bdf8;--bd:rgba(255,255,255,.14)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:18px}
.wrap{max-width:1180px;margin:0 auto}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.nav a{color:var(--tx);text-decoration:none;background:var(--card2);padding:6px 11px;border-radius:8px;font-size:.86rem}
.nav a.on,.nav a:hover{background:var(--ac);color:#061018;font-weight:600}
.hero{display:grid;grid-template-columns:180px 1fr;gap:18px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}.art img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.cleft{display:flex;align-items:center;gap:10px}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover}
label{display:block;font-size:.78rem;color:var(--mu);margin-bottom:4px}
select,input,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-family:inherit}
textarea{min-height:190px;line-height:1.55;padding:12px}.acts,.bbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:6px 10px;font-size:.78rem;cursor:pointer}
button.pri{background:var(--ac);color:#061018;border:none;font-weight:600;padding:8px 14px;font-size:.86rem}.st{color:var(--ac);font-size:.84rem}</style></head><body>
<div class="wrap"><nav class="nav"><a href="studio.html">Studio</a><a href="press.html">Press</a>
<a href="social.html" class="on">Social</a><a href="catalog-filter.html">Filter</a><a href="radio-stream.html">Radio</a></nav>
<section class="hero"><div class="art"><img id="artImg" alt="Cover"/></div><div>
<h1 id="titleEl" style="margin:0 0 4px">Loading catalog...</h1>
<div id="metaEl" style="color:var(--mu);font-size:.88rem;margin-bottom:10px">Agent Anna · Dahl MiniMaxAI/MiniMax-M2.7 · Unique Reach Social</div>
<div class="grid"><div><label for="songSel">Song</label><select id="songSel"></select></div>
<div><label for="voiceSel">Female Voice</label><select id="voiceSel"></select></div>
<div><label for="dahlKey">Dahl API Key</label><input id="dahlKey" type="password" placeholder="Dahl key..."/></div>
<div><label for="dahlModel">Model</label><input id="dahlModel" value="MiniMaxAI/MiniMax-M2.7"/></div>
<div><label for="noteIn">Hook / Angle</label><input id="noteIn" placeholder="Song angle..."/></div>
<div><label for="hubIn">Artist Hub</label><input id="hubIn" value="https://martinstrayd.github.io/artist/"/></div>
<div><label for="ghPat">GitHub PAT (Optional)</label><input id="ghPat" type="password" placeholder="ghp_..."/></div></div>
<div class="acts"><button id="genBtn" class="pri" type="button">Generate Social Set</button>
<button id="reloadBtn" type="button">Reload Catalog</button><span id="stEl" class="st">Ready</span></div></div></section>
<section id="cardsGrid" class="cards"></section></div>
<script>
const VOICE_PREF_KEY = "anna_selected_voice";
function saveVoicePref() {
  const sel = $("voiceSel");
  const v = VOICES[Number(sel?.value || 0)] || VOICES[0];
  if (v) localStorage.setItem(VOICE_PREF_KEY, v.voiceURI || v.name || "");
}
function applySavedVoicePref() {
  const sel = $("voiceSel");
  if (!sel || !VOICES.length) return;
  const saved = localStorage.getItem(VOICE_PREF_KEY) || "";
  if (saved) {
    const idx = VOICES.findIndex(v => (v.voiceURI || "") === saved || (v.name || "") === saved);
    if (idx >= 0) { sel.value = String(idx); return; }
  }
  const firstFemale = VOICES.findIndex(v => (typeof scV === "function" ? scV(v) >= 40 : true));
  sel.value = String(firstFemale >= 0 ? firstFemale : 0);
  saveVoicePref();
}
function cleanSpeechText(raw) {
  return String(raw || "")
    .replace(/<think>[\s\S]*?<\/think>/gi, " ")
    .replace(/https?:\/\/\S+/gi, " ")
    .replace(/#[A-Za-z0-9_]+/g, " ")
    .replace(/```[\s\S]*?```/g, " ")
    .replace(/[*_`~=#|<>\\[\]{}]+/g, " ")
    .replace(/[\u2013\u2014]/g, " - ")
    .replace(/\s+/g, " ")
    .trim();
}
function getSelectedVoice() {
  if (!VOICES.length) return null;
  const idx = Number($("voiceSel")?.value || 0);
  return VOICES[idx] || VOICES[0] || null;
}
function speakClean(raw, maxLen = 1400) {
  const sp = cleanSpeechText(raw).slice(0, maxLen);
  if (!sp || !("speechSynthesis" in window)) return "";
  popV();
  try { speechSynthesis.cancel(); } catch {}
  const voice = getSelectedVoice();
  const parts = sp.match(/[^.!?]+[.!?]?/g) || [sp];
  parts.slice(0, 12).forEach(pt => {
    const txt = pt.trim();
    if (!txt) return;
    const u = new SpeechSynthesisUtterance(txt);
    if (voice) u.voice = voice;
    u.pitch = 1.03;
    u.rate = 0.98;
    speechSynthesis.speak(u);
  });
  return sp;
}
async function saveSelectedSpeechAudio(raw, filename, statusSetter) {
  const sp = cleanSpeechText(raw).slice(0, 2500);
  if (!sp) { if (statusSetter) statusSetter("Nothing to save"); return; }
  const voice = getSelectedVoice();
  const vLabel = voice ? voice.name : "default";
  if (typeof MediaRecorder !== "undefined" && navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: false });
      const audioTracks = stream.getAudioTracks();
      if (audioTracks.length) {
        const recStream = new MediaStream(audioTracks);
        const chunks = [];
        const rec = new MediaRecorder(recStream);
        rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        const done = new Promise(resolve => { rec.onstop = resolve; });
        rec.start();
        speakClean(sp, 2500);
        await new Promise(r => setTimeout(r, Math.min(25000, Math.max(2500, sp.length * 65))));
        try { rec.stop(); } catch {}
        await done;
        stream.getTracks().forEach(t => t.stop());
        if (chunks.length) {
          const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
          const ext = (blob.type || "").includes("wav") ? "wav" : "webm";
          const outName = filename.replace(/\.(mp3|wav|webm)$/i, "." + ext);
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = outName;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          if (statusSetter) statusSetter("Saved " + outName + " (" + vLabel + ")");
          return;
        }
      }
      stream.getTracks().forEach(t => t.stop());
    } catch {}
  }
  speakClean(sp, 2500);
  const blob = new Blob([sp + "\n"], { type: "text/plain;charset=utf-8" });
  const txtName = filename.replace(/\.(mp3|wav|webm)$/i, "-spoken-script.txt");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = txtName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  if (statusSetter) statusSetter("Spoke with " + vLabel + "; saved " + txtName);
}const ENDPOINT="https://inference.dahl.global/v1/chat/completions";const $=id=>document.getElementById(id);
const CH=[["x","X",280],["tiktok","TikTok",2200],["instagram","Instagram",2200],["facebook","Facebook",63206],["ytTitle","YouTube Title",100],["ytDesc","YouTube Description",5000]];
let SONGS=[],VOICES=[],ANNA_BODY="";
const FH=["aria","jenny","sonia","libby","maisie","natasha","clara","ava","samantha","victoria","zira","hazel","female"];
const MH=["guy","ryan","christopher","eric","davis","andrew","brian","david","mark","daniel","male"];
const clean=s=>String(s||"").replace(/`/g,"").replace(/[\u2013\u2014]/g,"-").replace(/\n{3,}/g,"\n\n").trim();
const cleanT=s=>clean(String(s||"").replace(/\{\{TITLE\}\}/gi,"").replace(/\b(?:SINGLE|STRAYD[-_ ]?ID)[-_ ]?\d+\b/gi,"").replace(/^Martin\s+Strayd\s*[-:|]+\s*/i,""));
function fit(txt,lim){const c=clean(String(txt||"").replace(/\s+/g," "));if(c.length<=lim)return c;const cut=c.slice(0,lim-1),sp=cut.lastIndexOf(" ");return(sp>Math.floor(lim*.65)?cut.slice(0,sp):cut).trim();}
function edt(id){const t=$("ta_"+id);t.readOnly=false;t.focus();$("stEl").textContent="Editing "+id;}
function sav(id){$("ta_"+id).readOnly=true;$("stEl").textContent="Saved "+id;}
function cpy(id){navigator.clipboard?.writeText($("ta_"+id).value);$("stEl").textContent="Copied "+id;}
function pst(id){const v=$("ta_"+id).value;if(id==="x")window.open("https://x.com/intent/tweet?text="+encodeURIComponent(v.slice(0,280)),"_blank","noopener");else{navigator.clipboard?.writeText(v);window.open($("hubIn").value||"https://martinstrayd.github.io/artist/","_blank","noopener");}}
function ghHdr(){const v=($("ghPat")?.value||"").trim();if(v)localStorage.setItem("anna_gh_pat",v);const p=v||localStorage.getItem("anna_gh_pat")||"";return p?{Authorization:"Bearer "+p,Accept:"application/vnd.github.v3+json"}:null;}
async function repoGet(path){const h=ghHdr();if(h){try{const r=await fetch("https://api.github.com/repos/agent-anna/bananna/contents/"+path+"?ref=main&t="+Date.now(),{headers:h,cache:"no-store"});if(r.ok){const j=await r.json();if(j.content){const b=atob(j.content.replace(/\s+/g,"")),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u);}}}catch{}}
for(const base of["https://raw.githubusercontent.com/agent-anna/bananna/main/","https://agent-anna.github.io/bananna/"]){try{const r=await fetch(base+path+"?t="+Date.now(),{cache:"no-store"});if(r.ok)return await r.text();}catch{}}return "";}
async function loadAll(){$("stEl").textContent="Loading Agent Anna body/bible & catalog...";const parts=[],h=ghHdr();
for(const d of["body","bible","soul","character"]){if(h){try{const r=await fetch("https://api.github.com/repos/agent-anna/bananna/contents/"+d+"?ref=main",{headers:h,cache:"no-store"});if(r.ok){const fs=await r.json();for(const f of(Array.isArray(fs)?fs.slice(0,3):[])){if(f.type==="file"){const t=await repoGet(f.path);if(t)parts.push("["+f.path+"]\n"+t.slice(0,800));}}}}catch{}}}
ANNA_BODY=parts.join("\n\n").slice(0,2800);const m=new Map();
for(const f of["strayd/songs-db.json","strayd/core-catalog.json","strayd/strayd-artist-live.json"]){try{const raw=await repoGet(f);if(!raw)continue;const d=JSON.parse(raw);const arr=Array.isArray(d)?d:(d.songs||d.tracks||[]);arr.forEach(x=>{const t=cleanT(x.title||x.name||x.track||"");if(!t)return;const k=t.toLowerCase();m.set(k,{...(m.get(k)||{}),...x,title:t,artist:cleanT(x.artist||"Martin Strayd")});});}catch{}}
SONGS=[...m.values()];if(!SONGS.length)SONGS=[{title:"Adhd I Can Do That (Travillen Disorder)",artist:"Martin Strayd"}];
const sel=$("songSel");sel.innerHTML="";SONGS.forEach((s,i)=>{const o=document.createElement("option");o.value=i;o.textContent=(i+1)+" - "+s.title;sel.appendChild(o);});
syncSong();$("stEl").textContent="Loaded "+SONGS.length+" tracks";}
function artUrl(s,t){const r=String((s&&(s.artUrl||s.art||s.image||s.artwork))||"").trim();if(!r)return "https://martinstrayd.github.io/artist/store-art/Martin%20Strayd%20-%20"+encodeURIComponent(t)+".png";if(/^https?:\/\//i.test(r))return r;return "https://martinstrayd.github.io/artist/"+encodeURI(r.replace(/^\.?\//,""));}
function syncSong(){const s=SONGS[Number($("songSel").value||0)]||SONGS[0];const t=cleanT(s.title)||"Single";const u=artUrl(s,t);$("titleEl").textContent=t;$("metaEl").textContent=(s.artist||"Martin Strayd")+" - "+SONGS.length+" songs - Dahl MiniMax-M2.7";$("artImg").src=u;document.querySelectorAll("img[data-th]").forEach(im=>im.src=u);return{t,a:s.artist||"Martin Strayd"};}
function getKey(){const k=($("dahlKey").value||"").trim();if(k)localStorage.setItem("anna_dahl_key",k);return k||localStorage.getItem("anna_dahl_key")||"";}
function parseObj(raw){const st=String(raw||"").replace(/^```json\s*/i,"").replace(/```\s*$/i,"").trim();try{return JSON.parse(st);}catch{}const i=st.indexOf("{"),j=st.lastIndexOf("}");if(i>=0&&j>i)return JSON.parse(st.slice(i,j+1));throw new Error("Invalid JSON from Dahl");}
async function genSocial(){const key=getKey();if(!key){$("stEl").textContent="Enter Dahl API key first";return;}const model=($("dahlModel").value||"MiniMaxAI/MiniMax-M2.7").trim();const{t,a}=syncSong();
const sys="You are Agent Anna using agent-anna/home body & bible context to write social posts for Martin Strayd (STRAYD). Return ONLY JSON with keys x, tiktok, instagram, facebook, ytTitle, ytDesc. CRITICAL: Every platform must have a completely different angle, wording, and structure—NEVER repeat the same sentence across cards and NEVER repeat the same hashtags across platforms. Use up to 2 hashtags on x, 3 on tiktok, 3 on instagram, 2 on facebook, 0 on ytTitle, 3 on ytDesc. Keep ytTitle under 95 chars and x under 275 chars. Keep song title as ONE single title. "+(ANNA_BODY?"\n"+ANNA_BODY:"");
const usr=["Song (ONE track): \""+t+"\" by "+a,$("noteIn").value?"Angle: "+clean($("noteIn").value):"",$("hubIn").value?"Hub: "+clean($("hubIn").value):"","Seed: "+Date.now()+"-"+Math.random()].filter(Boolean).join("\n");
try{$("stEl").textContent="Calling Dahl ("+model+")...";const r=await fetch(ENDPOINT,{method:"POST",headers:{Authorization:"Bearer "+key,"Content-Type":"application/json"},body:JSON.stringify({model,messages:[{role:"system",content:sys},{role:"user",content:usr}]})});
if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();const obj=parseObj(j?.choices?.[0]?.message?.content||"");
const out={x:fit(obj.x||"",280),tiktok:clean(obj.tiktok||"").slice(0,2200),instagram:clean(obj.instagram||"").slice(0,2200),facebook:clean(obj.facebook||"").slice(0,63206),ytTitle:fit(obj.ytTitle||"",100),ytDesc:clean(obj.ytDesc||"").slice(0,5000)};
CH.forEach(([id,,lim])=>{const v=out[id]||"";$("ta_"+id).value=v;$("cnt_"+id).textContent=v.length+" / "+lim;});$("stEl").textContent="Generated unique social set";}catch(e){$("stEl").textContent=e.message||"Dahl error";}}
function scV(v){const h=(v.name+" "+v.lang).toLowerCase();let s=0;for(const x of FH)if(h.includes(x))s+=40;for(const x of MH)if(new RegExp("\\b"+x+"\\b").test(h))s-=100;return s;}
function popV(){
  if(!("speechSynthesis"in window))return;
  const list=(speechSynthesis.getVoices()||[]).sort((a,b)=>scV(b)-scV(a));
  VOICES=list.filter(v=>scV(v)>-50);
  if(!VOICES.length)VOICES=list;
  const sel=$("voiceSel");
  if(!sel)return;
  sel.innerHTML="";
  VOICES.forEach((v,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=(scV(v)>=40?"Female - ":"")+v.name;
    sel.appendChild(o);
  });
  applySavedVoicePref();
  sel.onchange=saveVoicePref;
}
function speakClean($("ta_"+id)?.value||""){const sp=clean(String($("ta_"+id)?.value||"").replace(/https?:\/\/\S+/g," ").replace(/#[A-Za-z0-9_]+/g," ")).slice(0,800);if(!sp||!("speechSynthesis"in window))return;popV();try{speechSynthesis.cancel();}catch{}const v=VOICES[Number($("voiceSel").value||0)]||VOICES[0]||null;(sp.match(/[^.!?]+[.!?]?/g)||[sp]).slice(0,6).forEach(pt=>{const u=new SpeechSynthesisUtterance(pt.trim());if(v)u.voice=v;u.pitch=1.05;speechSynthesis.speak(u);});}
async function mp3(id){await saveSelectedSpeechAudio($("ta_"+id)?.value||"",id+"-anna.webm",msg=>{$("stEl").textContent=msg;});}
if("speechSynthesis"in window){popV();speechSynthesis.onvoiceschanged=popV;}
if(localStorage.getItem("anna_gh_pat"))$("ghPat").value=localStorage.getItem("anna_gh_pat");
if(localStorage.getItem("anna_dahl_key"))$("dahlKey").value=localStorage.getItem("anna_dahl_key");
$("genBtn").onclick=genSocial;$("reloadBtn").onclick=loadAll;$("songSel").onchange=()=>{syncSong();if(getKey())genSocial();};loadAll();
</script></body></html>
