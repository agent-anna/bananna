<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Anna Docs — A1/v3</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #131922;
      --panel-2: #18202c;
      --border: #263244;
      --text: #e6edf3;
      --muted: #8b9bb0;
      --accent: #e5b84b;
      --accent-soft: rgba(229, 184, 75, 0.14);
      --code-bg: #0a0e14;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 56px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
    }

    .star { color: var(--accent); font-size: 1.1rem; }

    .path-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    button, a.btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    button:hover, a.btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      flex: 1;
      min-height: calc(100vh - 56px);
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 14px;
      overflow-y: auto;
    }

    .nav-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 4px 8px 10px;
    }

    .doc-link {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 0.88rem;
    }

    .doc-link:hover { background: var(--panel-2); border-color: var(--border); }

    .doc-link.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    main {
      padding: 28px 36px 64px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    .doc-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .doc-meta code {
      color: var(--accent);
      background: var(--panel-2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    article h1, article h2, article h3, article h4 {
      margin-top: 1.6em;
      margin-bottom: 0.6em;
      line-height: 1.3;
      color: #f3f6fa;
    }

    article h1 { font-size: 1.9rem; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    article h2 { font-size: 1.35rem; }
    article h3 { font-size: 1.1rem; }
    article p { margin: 0 0 14px; }
    article ul, article ol { margin: 0 0 16px; padding-left: 24px; }
    article li { margin-bottom: 6px; }
    article a { color: var(--accent); text-decoration: none; }
    article a:hover { text-decoration: underline; }

    article blockquote {
      margin: 16px 0;
      padding: 10px 16px;
      border-left: 3px solid var(--accent);
      background: var(--panel);
      color: var(--muted);
      border-radius: 0 6px 6px 0;
    }

    article pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 16px 0;
    }

    article code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 4px;
    }

    article pre code { background: transparent; padding: 0; }
    article hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    .status-note {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 14px 16px;
      border-radius: 6px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 240px; }
      main { padding: 20px 18px 48px; }
      .path-badge { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="star">✦</span>
      <span>AGENT ANNA DOCS</span>
      <span class="path-badge">agent-anna/anna-v2/A1/v3/docs</span>
    </div>
    <div class="header-actions">
      <button id="reloadBtn" type="button">Reload File</button>
      <a class="btn" id="rawLink" href="./README.md" target="_blank" rel="noopener">Raw .md</a>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="nav-title">Documentation Index</div>
      <div id="navList"></div>
    </aside>

    <main>
      <div class="doc-meta">
        <span>Active file: <code id="currentFileLabel">README.md</code></span>
        <span>Source of Truth: <code>A1/v3/docs</code></span>
      </div>
      <article id="viewer">
        <div class="status-note">Loading documentation...</div>
      </article>
    </main>
  </div>

  <script>
    const CANDIDATE_DOCS = [
      { title: "00 Anna Bible Index", candidates: ["00-anna-bible-index.md", "imported-content/00-anna-bible-index.md", "README.md"] },
      { title: "01 The Roots", candidates: ["imported-content/01-the-roots.md", "01-the-roots.md"] },
      { title: "02 The Trunk", candidates: ["imported-content/02-the-trunk.md", "02-the-trunk.md"] },
      { title: "03 The Branches", candidates: ["imported-content/03-the-branches.md", "03-the-branches.md"] },
      { title: "04 Tree of Life", candidates: ["imported-content/04-tree-of-life.md", "04-tree-of-life.md"] },
      { title: "README", candidates: ["README.md"] }
    ];

    const navList = document.getElementById("navList");
    const viewer = document.getElementById("viewer");
    const currentFileLabel = document.getElementById("currentFileLabel");
    const rawLink = document.getElementById("rawLink");
    const reloadBtn = document.getElementById("reloadBtn");

    let docs = [];
    let activeDoc = null;

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatInline(text) {
      const codeSpans = [];
      let out = text.replace(/`([^`]+)`/g, (_, code) => {
        const idx = codeSpans.length;
        codeSpans.push(`<code>${escapeHtml(code)}</code>`);
        return `@@CODE${idx}@@`;
      });

      out = escapeHtml(out);
      out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        const safeHref = href.trim();
        const isExternal = /^https?:\/\//i.test(safeHref);
        const targetAttr = isExternal ? ' target="_blank" rel="noopener"' : "";
        return `<a href="${safeHref}"${targetAttr}>${label}</a>`;
      });
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/@@CODE(\d+)@@/g, (_, idx) => codeSpans[Number(idx)] || "");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let inCode = false;
      let codeLang = "";
      let codeBuffer = [];
      let inUl = false;
      let inOl = false;
      let inBlockquote = false;

      function closeLists() {
        if (inUl) { html += "</ul>\n"; inUl = false; }
        if (inOl) { html += "</ol>\n"; inOl = false; }
      }

      function closeBlockquote() {
        if (inBlockquote) { html += "</blockquote>\n"; inBlockquote = false; }
      }

      for (const line of lines) {
        const fenceMatch = line.match(/^```(.*)$/);
        if (fenceMatch) {
          closeLists();
          closeBlockquote();
          if (!inCode) {
            inCode = true;
            codeLang = fenceMatch[1].trim();
            codeBuffer = [];
          } else {
            const cls = codeLang ? ` class="language-${escapeHtml(codeLang)}"` : "";
            html += `<pre><code${cls}>${escapeHtml(codeBuffer.join("\n"))}</code></pre>\n`;
            inCode = false;
            codeLang = "";
          }
          continue;
        }

        if (inCode) { codeBuffer.push(line); continue; }

        if (/^\s*$/.test(line)) { closeLists(); closeBlockquote(); continue; }

        if (/^---+\s*$/.test(line)) { closeLists(); closeBlockquote(); html += "<hr />\n"; continue; }

        const headingMatch = line.match(/^(#{1,4})\s+(.*)$/);
        if (headingMatch) {
          closeLists();
          closeBlockquote();
          const level = headingMatch[1].length;
          html += `<h${level}>${formatInline(headingMatch[2].trim())}</h${level}>\n`;
          continue;
        }

        const bqMatch = line.match(/^>\s?(.*)$/);
        if (bqMatch) {
          closeLists();
          if (!inBlockquote) { html += "<blockquote>\n"; inBlockquote = true; }
          html += `<p>${formatInline(bqMatch[1])}</p>\n`;
          continue;
        } else {
          closeBlockquote();
        }

        const ulMatch = line.match(/^\s*[-*+]\s+(.*)$/);
        if (ulMatch) {
          if (inOl) { html += "</ol>\n"; inOl = false; }
          if (!inUl) { html += "<ul>\n"; inUl = true; }
          html += `<li>${formatInline(ulMatch[1])}</li>\n`;
          continue;
        }

        const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
        if (olMatch) {
          if (inUl) { html += "</ul>\n"; inUl = false; }
          if (!inOl) { html += "<ol>\n"; inOl = true; }
          html += `<li>${formatInline(olMatch[1])}</li>\n`;
          continue;
        }

        closeLists();
        html += `<p>${formatInline(line)}</p>\n`;
      }

      if (inCode) html += `<pre><code>${escapeHtml(codeBuffer.join("\n"))}</code></pre>\n`;
      closeLists();
      closeBlockquote();
      return html;
    }

    async function resolveExistingFile(paths) {
      for (const rel of paths) {
        try {
          const res = await fetch(`./${encodeURI(rel)}?t=${Date.now()}`, { cache: "no-store" });
          if (res.ok) {
            const text = await res.text();
            return { path: rel, text };
          }
        } catch (_) {
          // Try next candidate
        }
      }
      return null;
    }

    function renderNav() {
      navList.innerHTML = "";
      for (const item of docs) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "doc-link" + (activeDoc && item.title === activeDoc.title ? " active" : "");
        btn.textContent = item.title;
        btn.addEventListener("click", () => selectDoc(item));
        navList.appendChild(btn);
      }
    }

    async function selectDoc(item) {
      activeDoc = item;
      currentFileLabel.textContent = item.resolvedPath || item.candidates[0];
      rawLink.href = `./${item.resolvedPath || item.candidates[0]}`;
      renderNav();
      viewer.innerHTML = `<div class="status-note">Loading <code>${escapeHtml(currentFileLabel.textContent)}</code>...</div>`;

      const found = await resolveExistingFile(item.candidates);
      if (!found) {
        viewer.innerHTML = `
          <div class="status-note">
            <strong>File not found for ${escapeHtml(item.title)}</strong><br />
            Checked: <code>${escapeHtml(item.candidates.join(", "))}</code> inside <code>A1/v3/docs/</code>.
          </div>`;
        return;
      }

      item.resolvedPath = found.path;
      currentFileLabel.textContent = found.path;
      rawLink.href = `./${found.path}`;
      viewer.innerHTML = renderMarkdown(found.text);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function init() {
      const available = [];
      for (const entry of CANDIDATE_DOCS) {
        const found = await resolveExistingFile(entry.candidates);
        if (found) {
          available.push({ ...entry, resolvedPath: found.path });
        }
      }

      docs = available.length > 0 ? available : CANDIDATE_DOCS;
      renderNav();
      await selectDoc(docs[0]);
    }

    reloadBtn.addEventListener("click", () => activeDoc && selectDoc(activeDoc));
    init();
  </script>
</body>
</html>
