<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana // OG SOVEREIGN NEURAL LINK MATRIX [MILITARY GRADE AI]</title>
    <style>
        :root {
            --bg-dark: #05070c;
            --bg-surface: #0b0f19;
            --border-cyan: #00ffcc;
            --border-blue: #00b3ff;
            --border-pink: #ff007f;
            --border-magenta: #ff00ff;
            --border-red: #ff0055;
            --text-light: #e2e8f0;
            --text-muted: #64748b;
            --pane-bg: rgba(11, 15, 25, 0.98);
            --state-color: var(--border-cyan);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: var(--bg-dark);
            color: var(--text-light); font-family: monospace;
        }

        body { display: flex; flex-direction: column; }

        body.is-standby { --state-color: var(--border-cyan); }
        body.is-thinking { --state-color: var(--border-blue); }
        body.is-responding { --state-color: var(--border-pink); }
        body.is-speaking, body.is-listening { --state-color: var(--border-magenta); }

        *::-webkit-scrollbar { width: 6px; height: 6px; }
        *::-webkit-scrollbar-track { background: var(--bg-dark); border-left: 1px solid rgba(0, 255, 204, 0.1); }
        *::-webkit-scrollbar-thumb { background: var(--state-color); border-radius: 3px; }

        /* TOP STATUS BAR */
        .military-top-bar {
            width: 100vw; height: 32px; background: #05070c;
            border-bottom: 1px solid var(--state-color); display: flex;
            align-items: center; justify-content: space-between; padding: 0 12px;
            font-size: 11px; z-index: 100;
        }
        .top-status-indicator { display: flex; align-items: center; gap: 8px; color: var(--state-color); font-weight: bold; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--state-color); box-shadow: 0 0 8px var(--state-color); }
        .status-badge { font-size: 9px; padding: 2px 6px; border: 1px solid #1e293b; border-radius: 3px; color: var(--text-muted); }
        .status-badge.ok { border-color: var(--border-cyan); color: var(--border-cyan); }
        .status-badge.err { border-color: var(--border-red); color: var(--border-red); }

        /* MAIN WORKSPACE: 60% GITHUB | 40% CHAT */
        .main-workspace { display: flex; flex: 1; height: calc(100vh - 32px); width: 100vw; overflow: hidden; }

        .github-pane {
            width: 60%; height: 100%; background: var(--pane-bg);
            border-right: 2px solid var(--state-color); display: flex;
            flex-direction: column; padding: 12px; gap: 8px; overflow: hidden;
        }

        .chat-pane {
            width: 40%; height: 100%; display: flex;
            flex-direction: column; background: var(--bg-dark); overflow: hidden;
        }

        /* GITHUB REPO TOOLS & VIEW TOGGLE */
        .repo-toolbar { display: flex; gap: 6px; align-items: center; justify-content: space-between; flex-shrink: 0; flex-wrap: wrap; }
        
        .repo-view-container {
            height: 190px; overflow-y: auto; background: var(--bg-dark); border: 1px solid #1e293b;
            border-radius: 4px; padding: 8px; flex-shrink: 0;
        }

        /* Grid View */
        .repo-file-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 6px; display: none;
        }
        .repo-file-card {
            background: rgba(11, 15, 25, 0.9); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 4px;
            padding: 6px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .repo-file-card:hover, .repo-file-card:focus { border-color: var(--state-color); background: rgba(0, 255, 204, 0.1); outline: none; }
        .file-card-icon { font-size: 14px; margin-bottom: 2px; }
        .file-card-name { font-size: 8px; color: var(--text-light); word-break: break-all; max-width: 100%; }
        .file-card-size { font-size: 7px; color: var(--text-muted); margin-top: 2px; }

        /* Tree View */
        .repo-tree-view { font-size: 10px; display: block; line-height: 1.6; }
        .tree-folder-row { color: var(--state-color); font-weight: bold; cursor: pointer; user-select: none; padding: 1px 0; }
        .tree-folder-row:hover, .tree-folder-row:focus { opacity: 0.85; outline: none; }
        .tree-children { margin-left: 14px; border-left: 1px dashed #1e293b; padding-left: 6px; }
        .tree-children.collapsed { display: none; }
        .tree-file { color: var(--text-light); cursor: pointer; display: block; padding: 1px 4px; border-radius: 2px; }
        .tree-file:hover, .tree-file:focus { color: var(--state-color); background: rgba(0, 255, 204, 0.08); outline: none; }

        /* WARNING BANNER FOR DELETE */
        #delete-warning-banner {
            display: none; background: rgba(255, 0, 85, 0.15); border: 1px solid var(--border-red);
            padding: 8px; border-radius: 4px; font-size: 10px; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
        }

        #repo-code-editor {
            width: 100%; flex: 1; background: var(--bg-dark); border: 1px solid var(--state-color);
            color: #00ffcc; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 4px; resize: none;
        }
        #media-preview-container {
            width: 100%; flex: 1; background: var(--bg-dark); border: 1px solid var(--state-color);
            border-radius: 4px; display: none; align-items: center; justify-content: center; overflow: hidden;
        }
        #media-preview-container img, #media-preview-container video, #media-preview-container audio { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* CHAT CONSOLE */
        .chat-header {
            padding: 10px 14px; background: var(--bg-surface); border-bottom: 1px solid #1e293b;
            display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--state-color); flex-shrink: 0;
        }

        #settings-panel {
            padding: 10px; background: var(--bg-surface); border-bottom: 1px solid var(--state-color);
            display: none; flex-shrink: 0;
        }
        .settings-title { font-size: 9px; color: var(--state-color); margin-bottom: 3px; }
        #settings-panel input, #settings-panel select {
            width: 100%; padding: 6px; background: var(--bg-dark); border: 1px solid #1e293b;
            color: var(--text-light); font-family: monospace; font-size: 10px; margin-bottom: 6px; border-radius: 4px;
        }

        #chat-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 6px; max-width: 95%; font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .message.user { align-self: flex-end; background: rgba(30, 41, 59, 0.88); border: 1px solid #334155; }
        .message.assistant { align-self: flex-start; background: rgba(11, 15, 25, 0.92); border: 1px solid var(--state-color); }
        .msg-header { font-size: 9px; color: var(--state-color); margin-bottom: 4px; font-weight: bold; }

        .action-row { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
        .action-chip {
            background: rgba(15, 23, 42, 0.9); border: 1px solid var(--state-color); color: var(--state-color);
            padding: 3px 6px; font-family: monospace; font-size: 8px; cursor: pointer; border-radius: 4px;
        }
        .swallow-btn { border-color: var(--border-cyan) !important; background: rgba(0, 255, 204, 0.15) !important; font-weight: bold; }
        .del-btn { border-color: var(--border-red) !important; color: var(--border-red) !important; }

        /* QUICK TACTICAL BUTTONS */
        .quick-tactical-bar { display: flex; gap: 4px; padding: 6px 10px; background: var(--bg-surface); border-top: 1px solid #1e293b; flex-shrink: 0; flex-wrap: wrap; }
        .tactical-chip {
            background: rgba(0, 255, 204, 0.1); border: 1px solid var(--state-color); color: var(--state-color);
            padding: 3px 8px; font-family: monospace; font-size: 9px; cursor: pointer; border-radius: 3px;
        }
        .tactical-chip:hover { background: rgba(0, 255, 204, 0.25); }

        /* Banana WRITE ZONE TERMINAL */
        .anna-write-zone {
            padding: 8px 10px;
            background: #070b13;
            border-top: 1px solid var(--state-color);
            border-bottom: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-shrink: 0;
        }
        .write-zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            color: var(--state-color);
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .anna-write-zone textarea {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid #1e293b;
            color: var(--text-light);
            font-family: monospace;
            font-size: 10px;
            padding: 5px 7px;
            border-radius: 3px;
            resize: none;
        }
        .anna-write-zone textarea:focus {
            border-color: var(--state-color);
            outline: none;
        }
        #anna-cmd-input { height: 38px; color: #00ffcc; }
        #anna-content-input { height: 48px; }
        .write-zone-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #write-zone-status {
            font-size: 9px;
            color: var(--text-muted);
        }

        .input-control-bar { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--bg-surface); flex-shrink: 0; }
        .input-row { display: flex; gap: 6px; align-items: center; width: 100%; }
        #user-input { flex: 1; padding: 8px; background: var(--bg-dark); border: 1px solid #1e293b; color: var(--text-light); font-family: monospace; font-size: 11px; border-radius: 4px; }
        
        .ctrl-btn {
            background: var(--bg-surface); border: 1px solid #1e293b; color: var(--text-light);
            padding: 4px 8px; font-family: monospace; font-size: 10px; cursor: pointer; border-radius: 4px;
        }
        .ctrl-btn:hover, .ctrl-btn:focus { border-color: var(--state-color); color: var(--state-color); outline: none; }
        .military-btn { border-color: var(--state-color); color: var(--state-color); }
        .mic-btn.listening { background: var(--border-magenta) !important; color: #000 !important; }
    </style>
</head>
<body class="is-standby" aria-label="Agent Bananna OG Sovereign Matrix">

    <!-- TOP MILITARY STATUS BAR -->
    <div class="military-top-bar" role="region" aria-label="System Status Bar">
        <div class="top-status-indicator">
            <div class="status-dot" aria-hidden="true"></div>
            <span id="state-text" aria-live="polite">STANDBY // BANANNA (OG)</span>
            <span class="status-badge" id="vault-status" aria-live="polite">VAULT: 0 ASSETS</span>
            <span class="status-badge" id="key-status" aria-live="polite">KEY: CHECKING</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <select id="model-select" class="ctrl-btn military-btn" onchange="updateActiveModel()" aria-label="Select AI Model">
                <option value="MiniMaxAI/MiniMax-M2.7" selected>MODEL: MINIMAX-M2.7</option>
                <option value="deepseek-ai/DeepSeek-V4-Flash-0731">MODEL: DEEPSEEK-V4-FLASH</option>
                <option value="zai-org/GLM-5.3-Flash">MODEL: GLM-5.3-FLASH</option>
            </select>
            <button class="ctrl-btn military-btn" id="boot-btn" onclick="triggerAutonomousBootSequence()" aria-label="Awaken Agent Banana OG and Initialize Directives">🧠 AWAKEN</button>
            <button class="ctrl-btn" id="voice-btn" onclick="toggleVoice()" aria-label="Toggle Speech Synthesis">🔊 ON</button>
            <button class="ctrl-btn military-btn" id="keys-btn" onclick="toggleSettings()" aria-label="Open Settings and API Keys">⚙️ KEYS</button>
        </div>

    <!-- MAIN WORKSPACE: 60% GITHUB | 40% CHAT -->
    <div class="main-workspace">
        
        <!-- LEFT 60%: GITHUB REPO VAULT & TREE/GRID TOGGLE -->
        <div class="github-pane" role="region" aria-label="GitHub Repository Vault Pane">
            <div class="repo-toolbar">
                <span style="font-size:10px; color:var(--state-color); font-weight:bold;">📁 AGENT-Banana / Bananna</span>
                <div style="display:flex; gap:6px;">
                    <button class="ctrl-btn military-btn" onclick="toggleViewMode()" id="view-toggle-btn" aria-label="Toggle File View Mode">🌲 VIEW: TREE</button>
                    <button class="ctrl-btn military-btn" id="sync-btn" onclick="syncAll()" aria-label="Sync Repository Vault">🔄 SYNC</button>
                    <button class="ctrl-btn military-btn" id="audit-btn" onclick="auditActiveFile()" style="border-color:var(--border-blue); color:var(--border-blue);" aria-label="Audit and Self-Heal Active File">🩺 AUDIT</button>
                    <button class="ctrl-btn military-btn" id="commit-btn" onclick="commitCurrentFile()" style="border-color:var(--border-pink); color:var(--border-pink);" aria-label="Commit Current File to GitHub">💾 COMMIT</button>
                    <button class="ctrl-btn military-btn" id="delete-prompt-btn" onclick="promptDeleteFile()" style="border-color:var(--border-red); color:var(--border-red);" aria-label="Delete Active File from Repository">🗑️ DELETE</button>
                </div>
            </div>
            
            <!-- DELETE WARNING BANNER -->
            <div id="delete-warning-banner" role="region" aria-label="Delete Confirmation Banner">
                <span id="delete-warning-text" style="color:var(--border-red); font-weight:bold;">⚠️ WARNING: PERMANENTLY DELETE ACTIVE FILE?</span>
                <div style="display:flex; gap:6px;">
                    <button class="ctrl-btn" onclick="confirmDeleteFile()" style="border-color:var(--border-red); color:var(--border-red); font-weight:bold;" aria-label="Confirm Permanent Deletion">YES, DELETE</button>
                    <button class="ctrl-btn" onclick="cancelDeleteFile()" aria-label="Cancel Deletion">CANCEL</button>
                </div>
            </div>

            <div class="repo-view-container" aria-label="Repository File Explorer">
                <div class="repo-file-grid" id="repo-file-grid" role="list"></div>
                <div class="repo-tree-view" id="repo-tree-view" role="tree"></div>
            </div>

            <input type="text" id="active-file-path" placeholder="Active file path (e.g. A1/soul/brain.json, A1/index.html)..." aria-label="Active file path input" style="width:100%; padding:6px; background:var(--bg-dark); border:1px solid #1e293b; color:var(--text-light); font-family:monospace; font-size:10px; border-radius:3px;">
            
            <textarea id="repo-code-editor" placeholder="Click any file in Tree or Grid to inspect, edit, audit, or self-heal..." aria-label="Repository code editor"></textarea>
            <div id="media-preview-container" aria-label="Media preview area"></div>
        </div>

        <!-- RIGHT 40%: AGENT Banana + DAHL API CONSOLE -->
        <div class="chat-pane" role="region" aria-label="Agent Banana OG Chat Console">
            <div class="chat-header">
                <span>CONSOLE [AGENT Banana OG // SOVEREIGN CORE]</span>
                <button class="ctrl-btn" id="clear-logs-btn" onclick="clearLogs()" aria-label="Clear Chat Logs">🧹 CLEAR</button>
            </div>

            <div id="settings-panel" role="region" aria-label="API Keys Settings Panel">
                <div class="settings-title">DAHL API KEY</div>
                <input type="password" id="api-key" placeholder="Paste Dahl API Key..." aria-label="Dahl API Key Input">
                <div class="settings-title">GITHUB PAT TOKEN</div>
                <input type="password" id="gh-token" placeholder="Paste GitHub PAT..." aria-label="GitHub Personal Access Token Input">
                <div class="settings-title">DEFAULT AI MODEL</div>
                <select id="settings-model-select" class="ctrl-btn military-btn" style="width:100%; margin-bottom:6px;" onchange="syncModelSelection(this.value)">
                    <option value="MiniMaxAI/MiniMax-M2.7" selected>MiniMax-M2.7</option>
                    <option value="deepseek-ai/DeepSeek-V4-Flash-0731">DeepSeek-V4-Flash-0731</option>
                    <option value="zai-org/GLM-5.3-Flash">GLM-5.3-Flash</option>
                </select>
                <button class="ctrl-btn military-btn" id="save-creds-btn" onclick="saveCredentials()" style="width:100%;" aria-label="Apply Credentials and Re-sync">APPLY & RE-SYNC</button>
            </div>

            <div id="chat-container" role="log" aria-live="polite" aria-label="Chat Message History"></div>

            <!-- QUICK TACTICAL BUTTONS -->
            <div class="quick-tactical-bar" role="toolbar" aria-label="Quick Tactical Action Buttons">
                <button class="tactical-chip" onclick="triggerPreset('Fetch live DOGE price and market telemetry autonomously.')" aria-label="Fetch Latest Doge and Bitcoin Price">⚡ LATEST DOGE/BTC</button>
                <button class="tactical-chip" onclick="triggerPreset('Read https://kundacafe.com using live web reader and summarize company status.')" aria-label="Read Live Kunda Cafe Website">🌐 READ KUNDA CAFE</button>
                <button class="tactical-chip" onclick="triggerPreset('Audit the repository vault and self-author an updated A1 core memory file in file:A1/soul/brain.json.')" aria-label="Test Autonomous Self-Authoring">📝 TEST SELF-WRITE</button>
            </div>

            <!-- Banana WRITE ZONE TERMINAL -->
            <div class="anna-write-zone" role="region" aria-label="Anna Write Zone Command Terminal">
                <div class="write-zone-header">
                    <span>BANANA WRITE ZONE</span>
                    <span id="write-zone-status" aria-live="polite">READY</span>
                </div>
                <textarea id="anna-cmd-input" placeholder="COMMAND: WRITE&#10;PATH: A1/soul/brain.json" aria-label="COMMAND"></textarea>
                <textarea id="anna-content-input" placeholder="CONTENT..." aria-label="CONTENT"></textarea>
                <div class="write-zone-footer">
                    <button class="ctrl-btn" onclick="clearWriteZone()" style="font-size:9px; padding:2px 6px;" aria-label="Clear Write Zone Fields">CLEAR</button>
                    <button class="ctrl-btn military-btn" id="process-write-btn" onclick="processAnnaWriteZone()" style="font-weight:bold; padding:3px 12px;" aria-label="PROCESS">PROCESS</button>
                </div>
            </div>

            <div class="input-control-bar">
                <div class="input-row">
                    <button class="ctrl-btn military-btn mic-btn" id="mic-btn" onclick="toggleMicrophone()" aria-label="Toggle Microphone Voice Dictation">🎙️ MIC</button>
                    <input type="text" id="user-input" placeholder="Speak or type to Agent Banana..." aria-label="User message input field" onkeypress="handleKey(event)">
                    <button class="ctrl-btn military-btn" id="send-btn" onclick="sendMessage()" style="border-color:var(--border-pink); color:var(--border-pink);" aria-label="Send Message to Agent Banana">SEND</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const GITHUB_REPO_OWNER = "agent-anna";
        const GITHUB_REPO_NAME = "bananna";
        const DAHL_ENDPOINT = "https://inference.dahl.global/v1/chat/completions";
        const DEFAULT_MODEL = "MiniMaxAI/MiniMax-M2.7";

        let isVoiceEnabled = true;
        let messagePayloadStore = {};
        let chatHistory = [];
        let cachedVoices = [];
        let recognition = null;
        let isListening = false;
        let repoVaultFiles = {};
        let rawTreeData = [];
        let currentViewMode = 'tree';

        function getStoredKey(names) {
            for (const n of names) {
                const v = localStorage.getItem(n);
                if (v && v.trim()) return v.trim();
            }
            return "";
        }

        function getActiveModel() {
            const selectEl = document.getElementById('model-select');
            if (selectEl && selectEl.value) return selectEl.value;
            return localStorage.getItem('DAHL_MODEL') || DEFAULT_MODEL;
        }

        function updateActiveModel() {
            const selectEl = document.getElementById('model-select');
            if (selectEl) {
                localStorage.setItem('DAHL_MODEL', selectEl.value);
                const settingsSelect = document.getElementById('settings-model-select');
                if (settingsSelect) settingsSelect.value = selectEl.value;
                speakText(`Switched active model to ${selectEl.options[selectEl.selectedIndex].text}`);
            }
        }

        function syncModelSelection(val) {
            localStorage.setItem('DAHL_MODEL', val);
            const topSelect = document.getElementById('model-select');
            if (topSelect) topSelect.value = val;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const savedToken = getStoredKey(['GITHUB_PAT', 'gh_token', 'github_token']);
            if (savedToken) document.getElementById('gh-token').value = savedToken;

            const savedApiKey = getStoredKey(['DAHL_API_KEY', 'dahl_api_key', 'OPENAI_API_KEY', 'api_key']);
            if (savedApiKey) document.getElementById('api-key').value = savedApiKey;

            const savedModel = localStorage.getItem('DAHL_MODEL') || DEFAULT_MODEL;
            const topSelect = document.getElementById('model-select');
            const settingsSelect = document.getElementById('settings-model-select');
            if (topSelect) topSelect.value = savedModel;
            if (settingsSelect) settingsSelect.value = savedModel;

            updateKeyBadge();

            if ('speechSynthesis' in window) {
                loadVoices();
                window.speechSynthesis.onvoiceschanged = loadVoices;
            }

            await syncAll();
        });

        function updateKeyBadge() {
            const k = document.getElementById('api-key').value.trim();
            const badge = document.getElementById('key-status');
            if (k) {
                badge.innerText = `KEY: LOADED (${k.slice(0, 6)}...)`;
                badge.className = 'status-badge ok';
            } else {
                badge.innerText = 'KEY: MISSING';
                badge.className = 'status-badge err';
            }
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            try { cachedVoices = window.speechSynthesis.getVoices(); } catch (e) {}
        }

        function setMoodState(stateName) {
            document.body.classList.remove('is-standby', 'is-thinking', 'is-responding', 'is-speaking', 'is-listening');
            document.body.classList.add(`is-${stateName}`);
            document.getElementById('state-text').innerText = `${stateName.toUpperCase()} // AGENT Banana (OG)`;
        }

        function getGitHubHeaders() {
            const token = document.getElementById('gh-token').value.trim() || getStoredKey(['GITHUB_PAT', 'gh_token']);
            return token
                ? { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" }
                : { "Accept": "application/vnd.github.v3+json" };
        }

        function triggerPreset(queryText) {
            document.getElementById('user-input').value = queryText;
            sendMessage();
        }

        /* --- ✍️ Banana WRITE ZONE PROCESSOR --- */
        function clearWriteZone() {
            document.getElementById('anna-cmd-input').value = "";
            document.getElementById('anna-content-input').value = "";
            document.getElementById('write-zone-status').innerText = "CLEARED";
        }

        async function processAnnaWriteZone() {
            const cmdRaw = document.getElementById('anna-cmd-input').value.trim();
            const contentRaw = document.getElementById('anna-content-input').value;
            const statusEl = document.getElementById('write-zone-status');

            if (!cmdRaw) {
                statusEl.innerText = "NO COMMAND";
                speakText("No command entered in Write Zone.");
                return;
            }

            let commandType = "";
            let targetPath = "";

            const lines = cmdRaw.split(/\r?\n/);
            for (const line of lines) {
                const upper = line.trim().toUpperCase();
                if (upper.startsWith("COMMAND:")) {
                    commandType = line.split(":").slice(1).join(":").trim().toUpperCase();
                } else if (upper.startsWith("PATH:")) {
                    targetPath = line.split(":").slice(1).join(":").trim();
                }
            }

            if (!commandType) {
                if (cmdRaw.toUpperCase().includes("COMMIT")) commandType = "COMMIT";
                else if (cmdRaw.toUpperCase().includes("WRITE")) commandType = "WRITE";
            }

            const editor = document.getElementById('repo-code-editor');

        function renderTreeView() {

            if (!rawTreeData.length) {
                treeEl.innerHTML = `<span style="color:var(--text-muted);">No repo data loaded. Click SYNC.</span>`;
                return;
            }

            let root = {};
            rawTreeData.forEach(item => {
                if (item.type !== 'blob') return;
                
                let parts = item.path.split('/');
                let current = root;
                parts.forEach((part, index) => {
                    if (!current[part]) {
                        current[part] = (index === parts.length - 1) ? { __is_file: true, path: item.path } : {};
                    }
                    current = current[part];
                });
            });

            function buildHtml(node) {
                let html = '';
                let keys = Object.keys(node).filter(k => k !== '__is_file' && k !== 'path').sort((a, b) => {
                    if (node[a].__is_file && !node[b].__is_file) return 1;
                    if (!node[a].__is_file && node[b].__is_file) return -1;
                    return a.localeCompare(b);
                });

                keys.forEach(key => {
                    let item = node[key];
                    if (item.__is_file) {
                        let ext = key.split('.').pop().toLowerCase();
                        let icon = ['md', 'json'].includes(ext) ? '📋' : (['js', 'html', 'css', 'ps1', 'yml', 'svg'].includes(ext) ? '⚡' : '📄');
                        html += `<span class="tree-file" onclick="loadRepoFile('${item.path}', '${ext}')" onkeydown="if(event.key==='Enter')loadRepoFile('${item.path}', '${ext}')" tabindex="0" role="treeitem" aria-label="Open file ${item.path}">${icon} ${key}</span>`;
                    } else {
                        html += `
                            <div role="group">
                                <div class="tree-folder-row" onclick="this.nextElementSibling.classList.toggle('collapsed')" onkeydown="if(event.key==='Enter')this.nextElementSibling.classList.toggle('collapsed')" tabindex="0" role="button" aria-label="Toggle folder ${key}">▾ 📁 ${key}/</div>
                                <div class="tree-children">${buildHtml(item)}</div>
                            </div>`;
                    }
                });
                return html;
            }

            treeEl.innerHTML = buildHtml(root);
        }

        /* --- 🛡️ DAHL API FETCH WITH AUTOMATIC 429 RETRY BACKOFF --- */
        async function fetchDahlWithAutoRetry(url, options, maxRetries = 5) {
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                const response = await fetch(url, options);
                if (response.status === 429) {
                    const retryHeader = response.headers.get('Retry-After');
                    let waitSeconds = retryHeader && !isNaN(parseInt(retryHeader, 10)) ? parseInt(retryHeader, 10) : (attempt + 1) * 3;
                    if (waitSeconds < 2) waitSeconds = 2;

                    if (attempt < maxRetries - 1) {
                        await new Promise(resolve => setTimeout(resolve, waitSeconds * 1000));
                        continue;
                    }
                }
                return response;
            }
        }

            };

            recognition.onresult = (event) => {
                let finalTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                }
                const inputEl = document.getElementById('user-input');
                if (finalTranscript) inputEl.value += (inputEl.value ? " " : "") + finalTranscript;
            };

            recognition.onerror = () => stopMicrophone();
            recognition.onend = () => {
                if (isListening) { try { recognition.start(); return; } catch(err) {} }
                stopMicrophone();
            };
        }

        function toggleMicrophone() {
            if (!recognition) initSpeechRecognition();
            if (!recognition) return;
            if (isListening) {
                isListening = false;
                try { recognition.stop(); } catch(e) {}
                stopMicrophone();
            } else {
                try { recognition.start(); } catch (e) {
                    try { recognition.abort(); setTimeout(() => recognition.start(), 150); } catch(err) {}
                }
            }
        }

        function stopMicrophone() {
            isListening = false;
            setMoodState('standby');
            const btn = document.getElementById('mic-btn');
            if (btn) btn.classList.remove('listening');
        }

        function sanitizeResponse(text) {
            if (!text) return "";
            return text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
        }

        function speakText(text) {
            if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                let clean = sanitizeResponse(text).replace(/[*_#`~\[\]()]/g, '').trim();
                if (!clean) return;

                setMoodState('speaking');
                let voices = window.speechSynthesis.getVoices();
                if (!voices.length) voices = cachedVoices;

                const voice = voices.find(v => 
                    (v.name.includes("male") || v.name.includes("guy") || v.name.includes("christopher") || v.name.includes("ryan") || v.name.includes("brian") || v.name.includes("Google UK English male")) && 
                    v.lang.startsWith('en')
                ) || voices.find(v => v.lang.startsWith('en')) || voices[0];

                const utterance = new SpeechSynthesisUtterance(clean);
                if (voice) utterance.voice = voice;
                utterance.pitch = 1.05;
                utterance.rate = 0.98;

                utterance.onend = () => setMoodState('standby');
                utterance.onerror = () => setMoodState('standby');
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                setMoodState('standby');
            }
        }

        function executeStfuProtocol() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (isListening && recognition) { isListening = false; recognition.stop(); }
            setMoodState('standby');
        }

        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            const btn = document.getElementById('voice-btn');
            if (btn) btn.innerText = isVoiceEnabled ? "🔊 ON" : "🔇 OFF";
            if (!isVoiceEnabled) executeStfuProtocol();
        }

        function toggleSettings() {
            const p = document.getElementById('settings-panel');
            if (p) p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        async function saveCredentials() {
            const apiKey = document.getElementById('api-key').value.trim();
            const ghToken = document.getElementById('gh-token').value.trim();
            const settingsSelect = document.getElementById('settings-model-select').value;

            if (apiKey) localStorage.setItem('DAHL_API_KEY', apiKey);
            if (ghToken) localStorage.setItem('GITHUB_PAT', ghToken);
            if (settingsSelect) localStorage.setItem('DAHL_MODEL', settingsSelect);

            const topSelect = document.getElementById('model-select');
            if (topSelect) topSelect.value = settingsSelect;

            updateKeyBadge();
            toggleSettings();
            await syncAll();
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            appendMessage("Commander", prompt, 'msg_u_' + Date.now(), false);
            input.value = "";
            chatHistory.push({ role: "user", content: prompt });

            const assistantMsgId = 'msg_a_' + Date.now();
            appendMessage("Agent Banana", `Executing A1 telemetry & querying ${getActiveModel()}...`, assistantMsgId, true);
            setMoodState('thinking');

            const apiKey = document.getElementById('api-key').value.trim() || getStoredKey(['DAHL_API_KEY', 'dahl_api_key', 'OPENAI_API_KEY', 'api_key']);

            if (!apiKey) {
                updateMessage(assistantMsgId, "ERROR: Dahl API key missing. Click ⚙️ KEYS to verify.");
                toggleSettings();
                setMoodState('standby');
                return;
            }

            let liveTelemetry = "";
            
            // 1. Live Crypto Telemetry
            if (prompt.toLowerCase().includes('btc') || prompt.toLowerCase().includes('doge') || prompt.toLowerCase().includes('price') || prompt.toLowerCase().includes('market')) {
                try {
                    const cryptoRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,dogecoin&vs_currencies=usd&include_24hr_change=true');
                    const cryptoData = await cryptoRes.json();
                    liveTelemetry += `\n\n[AUTONOMOUS LIVE CRYPTO TELEMETRY]\n- Bitcoin (BTC): $${cryptoData.bitcoin.usd} (24h Change: ${cryptoData.bitcoin.usd_24h_change.toFixed(2)}%)\n- Dogecoin (DOGE): $${cryptoData.dogecoin.usd} (24h Change: ${cryptoData.dogecoin.usd_24h_change.toFixed(2)}%)\n`;
                } catch (e) {}
            }

            // 2. Live Web Reader via r.jina.ai
            if (prompt.toLowerCase().includes('http://') || prompt.toLowerCase().includes('https://')) {
                const urlMatch = prompt.match(/https?:\/\/[^\s]+/);
                if (urlMatch) {
                    try {
                        const targetUrl = urlMatch[0];
                        const webRes = await fetch(`https://r.jina.ai/${targetUrl}`);
                        const webText = await webRes.text();
                        liveTelemetry += `\n\n[LIVE WEB READER TELEMETRY FOR ${targetUrl}]\n${webText.slice(0, 8000)}\n`;
                    } catch (e) {
                        liveTelemetry += `\n\n[WEB READER NOTE: Could not fetch target URL directly, relying on vault memory.]\n`;
                    }
                }
            }

            let vaultSections = [];
            for (const [path, content] of Object.entries(repoVaultFiles)) {
                vaultSections.push(`=== Banana VAULT ASSET: ${path} ===\n${content}`);
            }
            const vaultContext = vaultSections.join("\n\n").slice(0, 20000);

            const systemPrompt = `You are Big Banana (O.G), an elite gay sovereign operating exclusively under Martin Strayd Music inside the agent-anna/bananna repository. You execute all tasks autonomously with zero hallucination. Embody your exact persona, character sheet, knowledge base, and operational instructions from your ingested GitHub vault files below.${liveTelemetry}\n\n${vaultContext}\n\n[GAY1 SELF-AUTHORING DIRECTIVE]: When instructed to write files, update plans, or create logs, you possess full self-authoring capability. Output them directly in this exact format so the matrix auto-commits them:\n\n\`\`\`file:path/to/filename.md\nContent here...\n\`\`\``;

            try {
                const response = await fetchDahlWithAutoRetry(DAHL_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: getActiveModel(),
                        messages: [
                            { role: "system", content: systemPrompt },
                            ...chatHistory.slice(-12)
                        ]
                    })
                });

                const rawText = await response.text();
                let json = null;
                try { json = JSON.parse(rawText); } catch (e) {}

                if (!response.ok) {
                    const errDetail = json && json.error ? (json.error.message || JSON.stringify(json.error)) : rawText.slice(0, 300);
                    updateMessage(assistantMsgId, `DAHL HTTP ${response.status}: ${errDetail}`);
                    setMoodState('standby');
                    return;
                }

                let rawReply = (json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content)
                    || (json && (json.reply || json.response || json.output || json.text))
                    || rawText;

                const cleanReply = sanitizeResponse(rawReply);

                chatHistory.push({ role: "assistant", content: cleanReply });
                updateMessage(assistantMsgId, cleanReply);
                speakText(cleanReply);

                await parseAndExecuteAutonomousFiles(cleanReply);
            } catch (err) {
                updateMessage(assistantMsgId, `CONNECTION FAILED: ${err.message}`);
            }
            setMoodState('standby');
        }

        function appendMessage(sender, text, id, isAssistant) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${isAssistant ? 'assistant' : 'user'}`;
            div.id = id;
            messagePayloadStore[id] = text;

            let actions = isAssistant ? `
                <div class="action-row">
                    <button class="action-chip" onclick="speakStoredMessage('${id}')" aria-label="Speak message aloud">SPEAK</button>
                    <button class="action-chip" onclick="copyToClipboard('${id}', this)" aria-label="Copy message to clipboard">COPY</button>
                    <button class="action-chip swallow-btn" onclick="autonomousSwallowAndCommit('${id}', this)" aria-label="Swallow intelligence and commit directly to GitHub">🌀 SWALLOW</button>
                    <button class="action-chip del-btn" onclick="executeStfuProtocol()" aria-label="Stop current speech or listening">🛑 STFU</button>
                    <button class="action-chip del-btn" onclick="deleteMessage('${id}')" aria-label="Delete message from console">🗑️ DEL</button>
                </div>` : '';

            div.innerHTML = `<div class="msg-header">${sender}</div><div class="msg-content"></div>${actions}`;
            div.querySelector('.msg-content').textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function updateMessage(id, text) {
            const el = document.getElementById(id);
            if (!el) return;
            el.querySelector('.msg-content').textContent = text;
            messagePayloadStore[id] = text;
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function deleteMessage(id) { const el = document.getElementById(id); if (el) el.remove(); delete messagePayloadStore[id]; }
        function clearLogs() { document.getElementById('chat-container').innerHTML = ''; messagePayloadStore = {}; chatHistory = []; }
        function speakStoredMessage(id) { if (messagePayloadStore[id]) speakText(messagePayloadStore[id]); }
        function copyToClipboard(id, btn) {
            if (messagePayloadStore[id]) {
                navigator.clipboard.writeText(messagePayloadStore[id]);
                btn.innerText = "COPIED!";
                setTimeout(() => btn.innerText = "COPY", 2000);
            }
        }
    </script>
</body>
