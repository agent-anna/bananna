<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍌 Banana Ops — Agent Anna Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- BANANA HEADER -->
<div id="header">
    <div class="logo">🍌 <span id="title">Banana Ops</span></div>
    <div id="status-bar">
        <span id="utc-clock">--:--:-- UTC</span>
        <span id="local-clock">--:--:-- local</span>
        <span id="mission-clock"></span>
        <span id="connection-status" class="offline">OFFLINE</span>
        <button id="settings-btn" onclick="openSettings()">⚙️</button>
    </div>
</div>

<!-- SETTINGS PANEL -->
<div id="settings-panel" class="hidden">
    <h3>⚙️ Settings</h3>
    <label>API Key: <input type="password" id="api-key" placeholder="sk-..."></label>
    <label>GitHub Token: <input type="password" id="gh-token" placeholder="ghp_..."></label>
    <button onclick="saveSettings()">💾 Save</button>
    <button onclick="closeSettings()">✖ Close</button>
</div>

<!-- MAIN CHAT PANEL -->
<div id="chat-container">
    <div id="chat-messages"></div>
    <div id="chat-input-area">
        <textarea id="chat-input" placeholder="Ask Anna anything..." rows="2"></textarea>
        <button id="speak-btn" onclick="speakMessage()">🔊 Speak</button>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- MEMORY PANEL -->
<div id="memory-panel" class="hidden">
    <h3>🧠 Memory</h3>
    <div id="memory-content"></div>
    <button onclick="loadMemory()">📂 Load Memory</button>
</div>

<!-- BRAIN PANEL -->
<div id="brain-panel" class="hidden">
    <h3>🧠 Brain</h3>
    <div id="brain-content"></div>
    <button onclick="loadBrain()">📂 Load Brain</button>
</div>

<!-- BIBLE PANEL -->
<div id="bible-panel" class="hidden">
    <h3>📖 Bible</h3>
    <div id="bible-content"></div>
</div>

<!-- SIDEBAR / TOOLS -->
<div id="sidebar">
    <button onclick="togglePanel('memory')">🧠 Memory</button>
    <button onclick="togglePanel('brain')">🧠 Brain</button>
    <button onclick="togglePanel('bible')">📖 Bible</button>
    <button onclick="togglePanel('tasks')">📋 Tasks</button>
    <button onclick="togglePanel('soul')">💜 Soul</button>
</div>

<!-- SOUL PANEL -->
<div id="soul-panel" class="hidden">
    <h3>💜 Soul</h3>
    <div id="soul-content"></div>
    <button onclick="loadSoul()">📂 Load Soul</button>
</div>

<!-- TASKS PANEL -->
<div id="tasks-panel" class="hidden">
    <h3>📋 Tasks</h3>
    <div id="tasks-content"></div>
    <button onclick="loadTasks()">📂 Load Tasks</button>
</div>

<!-- SPEAK FUNCTION -->
<script>
async function speakMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.95;
    utterance.pitch = 1.1;
    const voices = speechSynthesis.getVoices();
    const femaleVoice = voices.find(v => 
        v.name.includes('Female') || v.name.includes('Samantha') || 
        v.name.includes('Victoria') || v.name.includes('Karen')
    );
    if (femaleVoice) utterance.voice = femaleVoice;
    
    speechSynthesis.speak(utterance);
}

async function sendMessage() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    
    addMessage(msg, 'user');
    input.value = '';
    
    // API call to AI
    const apiKey = localStorage.getItem('apiKey');
    if (!apiKey) {
        addMessage('⚠️ Add your API key in settings first.', 'system');
        return;
    }
    
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: 'gpt-4o',
                messages: [{ role: 'user', content: msg }]
            })
        });
        
        const data = await response.json();
        if (data.choices && data.choices[0]) {
            addMessage(data.choices[0].message.content, 'bot');
        } else {
            addMessage('Error: ' + JSON.stringify(data), 'system');
        }
    } catch (e) {
        addMessage('Error: ' + e.message, 'system');
    }
}

    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `message ${type}`;
    
    // Basic markdown rendering
    const rendered = text
        .replace(/
